니다.\n\n그분은 [직접 채울 것: 구체적인 행동 — 예: 불량이 나면 조건을 바꾸기 전에 \"무엇이 달라졌는지\"부터 물었다]. 그 모습에서 **문제를 대하는 순서**를 배웠습니다.\n\n저도 지금은 [직접 채울 것: 본인이 따라 하고 있는 행동]을 실천하고 있습니다.", "k": [["인물", "존경|선배|교수|부모|멘토"], ["행동", "모습|행동|물었|했"], ["실천", "저도|실천|배웠"]], "tip": "유명인보다 실제로 가까이서 본 사람이 설득력이 있습니다. 현 직장 사람을 말할 때 실명은 필요 없습니다.", "s": ["comm"], "f": []}, {"id": "F09", "c": "fit", "t": "예상", "sec": 90, "q": "문제의 본질을 끝까지 파고들어 해결한 경험을 말해 보세요.", "why": ["올해 SK하이닉스가 제시한 3대 미래 역량 중 '본질적 탐구 역량'을 확인하는 질문입니다. 지원서의 핵심 경험을 이 틀로 다시 말할 수 있어야 합니다."], "p": ["겉으로 보인 문제 vs 본질", "'왜'를 몇 단계 내려갔는가", "본질에 맞춘 해결"], "m": "연신율 오차 문제가 그랬습니다. 겉으로 보인 문제는 '같은 조건인데 치수가 다르다'였고, 흔한 대응은 가압력을 다시 맞추는 것이었습니다.\n\n저는 **왜 같은 압력이 다른 결과를 만드는지**를 물었습니다. 압력이 소재 안에서 어디로 가는지를 따라가 보니, **입자가 부서지며 흡수하는 경우와 옆으로 밀려나는 경우**가 달랐고, 기재와의 **접착 상태**에 따라 기재가 함께 늘어나는 정도가 달랐습니다. 문제의 본질은 설비가 아니라 **소재가 압력을 전달하는 방식**이었습니다.\n\n그래서 설비 값을 맞추는 대신 **소재 특성별로 가압 방식을 달리하는 기준**을 만들었고, 오차를 스펙 안으로 줄였습니다. 한 번 본질을 정리해 두니 **다음 소재가 들어올 때는 훨씬 빨리 조건을 잡을 수 있었습니다** [직접 채울 것: 실제로 그랬다면 유지].", "k": [["겉 문제", "겉|치수|같은 조건"], ["왜", "왜|따라가|물었"], ["본질", "본질|전달|입자|접착"], ["해결", "기준|가압 방식|줄였"], ["확장", "다음|빨리|재사용"]], "f": [["본질을 찾느라 시간이 오래 걸리면 일정에 문제가 생기지 않습니까?", "급한 불은 임시 조치로 끄고, 본질 분석은 병행했다는 식으로 사실대로."]], "s": ["half1", "app"]}, {"id": "F10", "c": "fit", "t": "예상", "sec": 90, "q": "새로운 것을 빠르게 배워서 성과로 연결한 경험을 말해 보세요.", "why": ["3대 미래 역량 중 '변화 적응력'입니다. 배터리에서 반도체로 넘어오는 지원자에게 가장 중요한 증명입니다."], "p": ["무엇이 새로웠는가", "어떻게 배웠는가 (방법)", "얼마나 빨리, 어떤 성과로", "반도체에도 같은 방식으로"], "m": "저는 화학 전공이라 **설비 제어는 처음 접하는 분야**였습니다 [직접 채울 것: 사실과 다르면 수정]. 그런데 장력을 낮춘 뒤 생긴 정렬 문제를 풀려면 EPC 제어를 이해해야 했습니다.\n\n배우는 방법은 세 가지였습니다. [직접 채울 것: 실제 방법 — 예: 설비 담당자에게 원리를 묻고, 매뉴얼을 읽고, AI에게 제어공학 개념을 질문하며 정리]. 특히 **모르는 분야일수록 질문을 구체적으로 만드는 것**이 가장 빨랐습니다.\n\n그 결과 [직접 채울 것: 걸린 기간] 만에 장력 조건과 제어 게인을 연동하는 방안을 제안할 수 있었고, 치수와 정렬을 함께 맞췄습니다.\n\n반도체 패키지도 같은 방식으로 배우고 있습니다. **모르는 것을 구체적인 질문으로 바꾸는 습관**이 제 적응력의 바탕이라고 생각합니다.", "k": [["새로운 분야", "처음|새로|제어|전공이 아닌"], ["학습 방법", "묻|매뉴얼|질문|정리"], ["성과", "제안|맞췄|결과"], ["원리", "구체적|습관|적응"]], "f": [["반도체는 훨씬 더 넓고 깊습니다. 같은 방식이 통하겠습니까?", "통하지 않는 부분(실습·설비 경험)은 현장에서 선배에게 배우겠다는 겸손한 답."]], "s": ["half1", "app"]}, {"id": "F11", "c": "fit", "t": "예상", "sec": 90, "q": "나와 다른 관점을 받아들여서 결과가 더 좋아진 경험이 있습니까?", "why": ["3대 미래 역량 중 '사고적 다양성'입니다. Group Discussion에서도 같은 것을 봅니다. \"내가 설득했다\"가 아니라 \"내 생각이 바뀌었다\"는 이야기가 필요합니다."], "p": ["내 원래 생각", "다른 관점 (누가, 무엇을)", "내 생각이 바뀐 지점", "결과"], "m": "처음에 저는 연신 오차를 **소재와 가압 조건의 문제로만** 보고 있었습니다.\n\n그런데 [직접 채울 것: 누가 — 예: 설비·제어 담당자, 뒤 공정 담당자]가 **이송과 정렬의 관점**에서 문제를 지적했습니다. 장력을 낮추면 제 지표는 좋아지지만 소재가 불안정해진다는 것이었습니다. 처음에는 제 공정과 별개의 문제라고 생각했습니다.\n\n하지만 그 지적을 받아들여 **장력과 정렬 제어를 하나의 문제로 묶어 보니** 해법이 달라졌습니다. 가압 조건만 만지던 것에서 **제어 게인까지 함께 조정**하는 쪽으로 바뀌었고, 두 지표를 모두 만족시켰습니다.\n\n이 일로 **제 전공의 눈으로만 보면 문제의 절반만 보인다**는 것을 배웠습니다. [직접 채울 것: 일 밖에서 관점을 넓히려고 하는 것 — 독서, 다른 분야 사람과의 교류 등이 있다면]", "k": [["원래 생각", "처음|원래|로만"], ["다른 관점", "관점|지적|다른"], ["수용", "받아들|바뀌|묶어"], ["결과", "해법|만족|결과"], ["배운 점", "절반|배웠|전공"]], "f": [["도저히 받아들일 수 없는 의견이면 어떻게 합니까?", "왜 그렇게 생각하는지 질문으로 근거를 확인. 근거가 없으면 정중히 내 근거를 제시."]], "s": ["half1", "app"]}, {"id": "F12", "c": "fit", "t": "예상", "sec": 60, "q": "상사의 지시가 틀렸다고 생각될 때는 어떻게 합니까?", "why": ["패기(일과 싸워서 이기는 기질)와 조직 적응을 함께 봅니다. 무조건 따른다도, 무조건 맞선다도 답이 아닙니다."], "p": ["먼저 내가 놓친 배경이 있는지 확인", "근거를 가지고 의견 제시", "결정되면 따르고, 결과를 기록", "예외: 안전·품질·윤리"], "m": "먼저 **제가 모르는 배경이 있는지**를 확인하겠습니다. 상사는 일정이나 다른 부서 상황처럼 제가 보지 못한 정보를 갖고 있을 수 있습니다.\n\n그래도 다르게 생각된다면 **데이터와 대안을 준비해서** 말씀드리겠습니다. \"틀렸습니다\"가 아니라 \"이 데이터를 보면 이런 위험이 있어 보이는데, 이런 방법은 어떻겠습니까\"라고 하겠습니다.\n\n그 뒤에 내려진 결정은 **따르겠습니다**. 다만 결과를 확인할 수 있게 기록해 두고, 다음 판단에 쓰겠습니다.\n\n예외는 **안전, 품질, 윤리**에 관한 문제입니다. 이 경우에는 한 번 더 분명하게 말씀드리고, 필요하면 정해진 절차로 알리겠습니다.", "k": [["배경 확인", "배경|모르는|확인"], ["근거 제시", "데이터|대안|말씀"], ["수용", "따르|결정"], ["예외", "안전|품질|윤리"]], "s": ["gen"], "f": []}, {"id": "F13", "c": "fit", "t": "예상", "sec": 60, "q": "SK의 경영철학(SKMS) 가운데 가장 공감하는 것은 무엇입니까?", "why": ["회사 가치에 대한 이해를 묻는 질문입니다. 용어 설명에서 끝나지 말고 본인 경험 하나를 붙여야 합니다."], "p": ["하나만 고르기 (VWBE, SUPEX, 패기, 행복 중)", "내가 이해한 뜻", "내 경험과의 연결"], "m": "**VWBE, 자발적이고 의욕적인 두뇌 활용**에 가장 공감합니다.\n\n저는 이 말을 **시켜서 하는 일과 스스로 이유를 찾아서 하는 일의 결과가 다르다**는 뜻으로 이해했습니다.\n\n현 직장에서 불량이 났을 때, 주어진 조건표대로 값을 바꾸는 것까지가 제 일이었지만, 저는 **왜 그런지를 스스로 묻고** 소재별 기준으로 정리했습니다. 누가 시킨 일이 아니었기 때문에 오히려 더 깊이 들어갈 수 있었습니다 [직접 채울 것: 사실과 다르면 수정].\n\nSK하이닉스에서도 **주어진 범위에서 멈추지 않고 스스로 다음 질문을 만드는 구성원**이 되겠습니다.", "k": [["선택", "VWBE|SUPEX|패기|행복"], ["이해", "자발|의욕|스스로|뜻"], ["경험", "왜|정리|경험"], ["다짐", "구성원|되겠습니다"]], "f": [["SUPEX는 무엇이라고 이해하고 있습니까?", "인간의 능력으로 도달할 수 있는 최고 수준. 높은 목표를 세우고 도전하는 것."]], "s": ["gen"]}, {"id": "F14", "c": "fit", "t": "예상", "sec": 60, "q": "실험 데이터가 기대와 다르게 나왔는데 보고 일정이 내일입니다. 어떻게 하겠습니까?", "why": ["엔지니어의 정직성을 보는 상황형 질문입니다. 데이터를 다듬고 싶은 유혹 앞에서 어떻게 하는지 봅니다."], "p": ["있는 그대로 보고", "기대와 다른 이유의 가설", "다음 확인 계획과 일정 영향"], "m": "**데이터는 있는 그대로 보고**하겠습니다. 기대와 다르다는 사실 자체가 중요한 정보이기 때문입니다.\n\n대신 숫자만 내놓지 않고 세 가지를 함께 준비하겠습니다. **측정이나 실험 자체에 오류가 없었는지** 확인한 내용, **기대와 달라진 이유에 대한 가설**, 그리고 **다음에 무엇을 확인할지와 일정에 미치는 영향**입니다.\n\n결과를 보기 좋게 다듬으면 당장은 넘어가도 **뒤 공정이나 양산 단계에서 훨씬 큰 비용**으로 돌아옵니다. 개발 단계에서 나쁜 데이터를 빨리 드러내는 것이 엔지니어의 일이라고 생각합니다.", "k": [["정직", "있는 그대로|사실|그대로"], ["오류 확인", "오류|측정|확인"], ["가설", "가설|이유"], ["계획", "다음|일정|계획"], ["원칙", "비용|드러내|엔지니어"]], "s": ["gen"], "f": []}, {"id": "C01", "c": "company", "t": "기출", "sec": 60, "q": "삼성전자가 아니라 SK하이닉스를 선택한 이유는 무엇입니까?", "why": ["과거 후기에 나온 질문입니다. 경쟁사를 깎아내리지 않고 SK하이닉스에 대해 확인한 사실로만 답하세요."], "p": ["경쟁사 평가는 하지 않는다", "SK하이닉스를 고른 사실 근거 2가지", "본인 직무와의 연결"], "m": "다른 회사를 평가하기보다 **제가 SK하이닉스를 고른 이유**를 말씀드리겠습니다.\n\n첫째, **패키징 기술로 시장의 판을 바꾼 경험이 있는 회사**이기 때문입니다. MR-MUF를 HBM에 일찍 적용하고 12단에서 어드밴스드 MR-MUF로 한계를 넘은 과정은, 후공정 엔지니어가 제품 경쟁력을 직접 만들 수 있다는 것을 보여 줬습니다.\n\n둘째, **패키징에 대한 투자가 가장 분명한 회사**이기 때문입니다. 올해 청주에 첨단 패키징 전용 팹인 P&T7을 착공했고, 이천과 청주, 미국 인디애나까지 패키징 거점을 넓히고 있습니다.\n\n패키지 공정 개발을 하고 싶은 저에게는 **이 일이 회사의 중심에 있는 곳**이 가장 좋은 선택이라고 판단했습니다.", "k": [["태도", "평가하기보다|제가 고른"], ["기술 근거", "MR-MUF|HBM|어드밴스드"], ["투자 근거", "P&T7|청주|투자|거점"], ["직무 연결", "패키지|중심|개발"]], "f": [["경쟁사의 패키징 기술은 어떻게 평가합니까?", "깎아내리지 않기. 방식의 장단점(예: TC-NCF는 휨 대응에 유리)을 사실로만 말하고, 본인이 SK하이닉스를 고른 이유로 돌아오기."]], "s": ["hbm3", "pt7"]}, {"id": "C02", "c": "company", "t": "기출", "sec": 90, "q": "최근 관심 있게 본 반도체 뉴스를 말해 보세요.", "why": ["과거 후기에 나온 질문입니다. 뉴스 요약이 아니라 \"그래서 내 직무에 어떤 의미인가\"까지 말해야 합니다. 면접 직전 1주일 뉴스를 꼭 다시 확인하세요."], "p": ["뉴스 한 가지 (언제, 무엇)", "왜 중요하다고 봤는가", "PKG 엔지니어에게 주는 의미"], "m": "올해 반도체 학회에서 SK하이닉스가 발표한 **HBM 패키징 로드맵**을 관심 있게 봤습니다. 보도에 따르면 MR-MUF와 비교해 **하이브리드 본딩이 열저항을 약 35% 낮출 수 있다**는 내용이 있었습니다.\n\n제가 주목한 것은 **적층 단수와 속도를 올리는 것만으로는 한계가 있고, 열이 다음 병목**이라는 점입니다. HBM4가 양산에 들어간 지금도 다음 세대의 과제는 결국 **방열과 두께**로 모이고 있습니다.\n\nPKG 엔지니어에게는 두 가지 의미가 있다고 생각합니다. 당분간은 **MR-MUF의 갭 충진과 휨 제어를 더 고도화**해야 하고, 동시에 **새 접합 방식에서 생길 응력과 계면 문제**를 미리 공부해야 한다는 것입니다.\n\n[직접 채울 것: 면접 직전 1주일 안의 뉴스 한 가지를 추가하거나 교체]", "k": [["뉴스", "발표|보도|기사|뉴스"], ["내용", "하이브리드|HBM|열저항|로드맵"], ["해석", "병목|한계|주목"], ["직무 의미", "엔지니어|갭|휨|공부"]], "f": [["그 기사에서 의문이 들었던 점은 없습니까?", "발표 수치는 조건에 따라 달라질 수 있다는 점 등, 비판적으로 읽은 한 가지."]], "tip": "수치(35%)는 해외 매체의 학회 발표 보도 기준입니다. \"보도에 따르면\"을 꼭 붙이세요.", "s": ["hotchips", "hbm4"]}, {"id": "C03", "c": "company", "t": "예상", "sec": 90, "q": "SK하이닉스의 강점과 위험 요인을 하나씩 말해 보세요.", "why": ["회사를 좋게만 보는지, 균형 있게 보는지 확인합니다. 위험 요인을 말한 뒤 본인이 기여할 지점으로 닫으세요."], "p": ["강점 1개 + 근거", "위험 1개 + 근거", "내가 기여할 수 있는 지점"], "m": "강점은 **AI 메모리에서 쌓은 양산 경험과 고객 신뢰**입니다. HBM을 세대마다 먼저 양산하면서 쌓은 수율과 품질 데이터가 있고, 올해 실적 발표에서도 HBM4의 수율과 품질이 이전 세대에 가까운 수준이라고 밝혔습니다.\n\n위험 요인은 **경쟁 심화와 기술 전환기**라고 봅니다. 경쟁사들도 HBM4를 공급하기 시작했고, 접합 방식이 바뀌는 시점에는 **기존의 강점이 그대로 이어진다는 보장이 없습니다**.\n\n그래서 저는 PKG개발에서 **현재 방식의 수율을 지키는 일과 다음 방식을 준비하는 일**을 함께 해야 한다고 생각하고, 소재와 공정의 상호작용을 분석하는 제 역량으로 그 일에 기여하고 싶습니다.", "k": [["강점", "강점|경험|신뢰|수율"], ["근거", "HBM|양산|실적"], ["위험", "경쟁|전환|위험"], ["기여", "기여|준비|역량"]], "s": ["hbm4", "gen"], "f": []}, {"id": "C04", "c": "company", "t": "예상", "sec": 60, "q": "SK하이닉스에 대해 아는 대로 말해 보세요.", "why": ["기본 조사 여부를 확인합니다. 숫자를 틀리게 말하느니 확실한 사실만 말하세요."], "p": ["무엇을 만드는 회사인가", "사업장", "최근 방향"], "m": "SK하이닉스는 **D램과 낸드플래시를 만드는 메모리 반도체 회사**이고, 최근에는 HBM을 중심으로 **AI 메모리**에서 앞서 있습니다.\n\n국내 사업장은 본사가 있는 **이천**과 **청주**가 있고, **용인 반도체 클러스터**를 짓고 있습니다. 패키징 쪽으로는 이천과 청주에 더해 **미국 인디애나**에 거점을 준비하고 있고, 올해 청주에 첨단 패키징 전용 팹 **P&T7**을 착공했습니다.\n\n방향으로는 '풀 스택 AI 메모리'를 내세우고 있고, HBM4 양산과 다음 세대 준비, 그리고 로직·파운드리 업체와의 협업을 강화하고 있는 것으로 알고 있습니다.\n\n[직접 채울 것: 최근 분기 실적 등 숫자는 면접 전날 뉴스룸에서 확인한 것만 추가]", "k": [["사업", "D램|낸드|메모리|HBM"], ["사업장", "이천|청주|용인|인디애나"], ["패키징 투자", "P&T7|패키징"], ["방향", "AI 메모리|풀 스택|협업"]], "s": ["pt7", "hbm4"], "f": []}, {"id": "C05", "c": "company", "t": "기출", "sec": 60, "q": "왜 제조 기업, 그중에서도 반도체 제조업에서 일하고 싶습니까?", "why": ["과거 후기에 나온 질문입니다. 현장과 가까운 일을 좋아하는 사람인지 봅니다."], "p": ["제조업이 좋은 이유 (내 성향)", "반도체인 이유"], "m": "저는 **제 판단이 실물의 결과로 바로 돌아오는 일**을 좋아합니다. 공정 조건을 바꾸면 다음 날 제품의 치수와 수율로 답이 나오고, 그 답은 거짓말을 하지 않습니다. 현 직장의 파일럿 라인에서 그 재미를 알았습니다.\n\n그중에서도 반도체는 **허용되는 오차가 가장 작은 제조업**이라고 생각합니다. 같은 일을 하더라도 가장 정밀한 곳에서 해 보고 싶었고, 지금 패키징은 **제조 기술이 곧 제품 성능이 되는 분야**라서 엔지니어로서 가장 의미 있는 자리라고 판단했습니다.", "k": [["성향", "실물|결과|현장|라인"], ["경험", "파일럿|재미"], ["반도체", "정밀|오차|반도체"], ["의미", "성능|의미|패키징"]], "s": ["comm"], "f": []}, {"id": "C06", "c": "company", "t": "예상", "sec": 90, "q": "경쟁사들이 HBM4에서 추격하고 있습니다. PKG 엔지니어 관점에서 격차를 유지하려면 무엇이 필요합니까?", "why": ["직무 관점에서 회사 전략을 생각해 본 적이 있는지 봅니다. 정답은 없고, 논리와 근거가 평가됩니다."], "p": ["수율과 품질의 안정", "다음 기술의 선제 준비", "고객 대응 속도", "본인의 기여"], "m": "세 가지가 필요하다고 생각합니다.\n\n첫째 **수율과 품질의 안정**입니다. 적층 단수가 늘수록 접합과 갭 충진의 작은 불량이 전체 불량으로 이어지기 때문에, 불량 메커니즘을 빨리 규명해서 **조건의 여유 폭을 넓히는 일**이 기본입니다.\n\n둘째 **다음 기술의 선제 준비**입니다. 칩이 더 얇아질 때의 휨 제어, 고방열 소재, 하이브리드 본딩처럼 **한 세대 뒤의 문제를 미리 평가**해 둬야 합니다.\n\n셋째 **고객 대응 속도**입니다. 커스텀 제품이 늘수록 고객의 요구에 맞춘 평가를 얼마나 빨리 돌리느냐가 경쟁력이 됩니다.\n\n저는 이 가운데 첫째와 둘째, 즉 **소재와 공정의 상호작용에서 불량 원인을 찾는 일**에서 가장 빨리 기여할 수 있다고 생각합니다.", "k": [["수율", "수율|품질|불량"], ["선제 준비", "다음|미리|하이브리드|고방열"], ["고객", "고객|커스텀|대응"], ["기여", "기여|소재와 공정"]], "s": ["jobrep2", "hbm4"], "f": []}, {"id": "C07", "c": "company", "t": "예상", "sec": 60, "q": "HBM 이후 SK하이닉스의 다음 성장 동력은 무엇이라고 봅니까?", "why": ["산업을 넓게 보고 있는지 확인합니다. 모르는 것을 아는 척하기보다, 아는 범위에서 본인 생각을 말하세요."], "p": ["한 가지를 고르고 이유", "패키징과의 관계", "단정하지 않기"], "m": "제가 아는 범위에서는 **'메모리와 로직의 결합'**이 다음 동력이라고 생각합니다.\n\nHBM4부터 베이스 다이에 로직 공정이 들어가고 고객별 커스텀 제품이 늘어나는 것처럼, 메모리가 **표준 부품에서 고객과 함께 설계하는 제품**으로 바뀌고 있습니다. SK하이닉스도 올해 파운드리 업체 행사에서 메모리와 로직의 통합을 화두로 제시한 것으로 알고 있습니다.\n\n이 변화의 한가운데에 **패키징**이 있습니다. 서로 다른 칩을 하나로 묶는 기술이 곧 제품이 되기 때문입니다. 그래서 패키지 엔지니어의 역할은 HBM 이후에도 더 커질 것이라고 봅니다.\n\n다만 이는 공개된 기사로 본 제 생각이고, 실제 방향은 입사해서 더 배우고 싶습니다.", "k": [["선택", "로직|결합|통합|커스텀"], ["근거", "베이스 다이|고객|HBM4"], ["패키징", "패키징|패키지|묶는"], ["겸손", "제 생각|배우|아는 범위"]], "s": ["hbm4", "gen"], "f": []}, {"id": "E01", "c": "closing", "t": "기출", "sec": 45, "q": "마지막으로 하고 싶은 말이 있습니까?", "why": ["거의 모든 면접의 마지막 질문입니다. 새 이야기를 꺼내지 말고, 오늘 한 말을 한 문장으로 묶고 끝내세요."], "p": ["감사 (한 문장)", "나를 한 문장으로 다시 정의", "오늘 부족했던 답 보완 (선택)", "짧게 끝내기"], "m": "긴 시간 제 이야기를 들어 주셔서 감사합니다.\n\n저는 **'왜 그런지'를 끝까지 따져서 조건을 잡는 공정 엔지니어**입니다. 분야는 배터리에서 반도체로 바뀌지만, 소재와 공정의 상호작용에서 원인을 찾는 방식은 그대로 가져오겠습니다.\n\n오늘 **제가 모른다고 말씀드린 부분**은 입사 전까지 공부해서 채우겠습니다. SK하이닉스의 패키지 공정에서 그 방식을 증명할 기회를 주시면 감사하겠습니다.", "k": [["감사", "감사"], ["정의", "엔지니어|왜 그런지|방식"], ["보완", "모른다|공부|채우"], ["마무리", "기회|증명"]], "tip": "30~40초면 충분합니다. 길어질수록 인상이 흐려집니다.", "s": ["comm"], "f": []}, {"id": "E02", "c": "closing", "t": "기출", "sec": 45, "q": "면접관에게 궁금한 점이 있으면 질문해 보세요.", "why": ["역질문은 관심과 준비도를 보여 줄 마지막 기회입니다. 검색하면 나오는 질문, 처우 질문은 피하세요."], "p": ["직무를 조사한 사람만 할 수 있는 질문 1~2개", "답을 들은 뒤 짧게 반응"], "m": "두 가지를 여쭙고 싶습니다.\n\n첫째, 뉴스룸에서 PKG개발은 **더미 자재로 사전 평가**를 한다고 소개하셨는데, **신입이 처음 맡게 되는 평가나 업무**는 보통 어떤 것인지 궁금합니다.\n\n둘째, 저처럼 **다른 산업에서 공정 개발을 하다 온 구성원**이 빨리 자리 잡기 위해 입사 전에 꼭 공부해 오면 좋을 것 하나를 추천해 주신다면 무엇인지 여쭙고 싶습니다.\n\n[직접 채울 것: 본인이 실제로 궁금한 질문으로 바꿔도 좋습니다]", "k": [["질문 1", "신입|처음|업무|평가"], ["질문 2", "공부|추천|입사 전"], ["근거", "뉴스룸|소개"]], "tip": "\"없습니다\"는 피하세요. 반대로 3개 이상은 길어집니다.", "s": ["jobrep2"], "f": []}, {"id": "E03", "c": "closing", "t": "예상", "sec": 60, "q": "오늘 답변 중 아쉬웠던 것이 있다면 다시 답해 보세요.", "why": ["실제로 물을 수도 있고, 묻지 않아도 마지막 발언에서 스스로 보완할 수 있습니다. 연습용으로, 바로 앞 세션에서 가장 점수가 낮았던 문항을 떠올려 다시 답해 보세요."], "p": ["어떤 질문이었는지 한 문장", "무엇이 부족했는지", "보완한 답 (결론부터)"], "m": "아까 [직접 채울 것: 질문 내용]에 대한 답이 아쉬웠습니다. **결론을 먼저 말씀드리지 못하고** 배경 설명이 길었습니다.\n\n다시 말씀드리면, 결론은 [직접 채울 것: 한 문장 결론]입니다. 근거는 [직접 채울 것: 근거 두 가지]입니다.\n\n기회를 주셔서 감사합니다.", "k": [["지목", "아까|질문|아쉬"], ["원인", "결론|길었|부족"], ["보완", "다시|근거"]], "tip": "이 문항은 자유 연습에서 '직전 세션 최저점 문항 다시 하기' 용도로 쓰세요.", "s": ["gen"], "f": []}, {"id": "V1", "c": "pkg", "t": "예상", "sec": 120, "chart": "warp", "q": "그래프는 두 EMC 소재로 만든 패키지의 온도별 휨을 나타냅니다. 읽을 수 있는 내용과 원인, 대책을 설명해 보세요.", "why": ["그래프에서 사실을 먼저 읽고, 그다음 원인을 추론하는지 봅니다. 아는 지식을 그래프와 상관없이 늘어놓으면 감점입니다."], "p": ["축과 범례부터 읽기", "사실: 상온에서는 B가 작고, 고온에서는 B가 크다. 방향이 바뀐다", "원인 추론: Tg, CTE", "영향: 리플로우 시 접합 불량", "대책과 추가로 확인할 것"], "m": "먼저 **그래프에서 읽을 수 있는 사실**입니다. 가로축은 온도, 세로축은 휨입니다. 두 소재 모두 상온에서는 위쪽으로, 온도가 오르면 아래쪽으로 **휨의 방향이 바뀝니다**. 상온에서는 소재 B의 휨이 더 작지만, **고온에서는 B의 휨이 훨씬 커집니다**. 그리고 B는 A보다 **낮은 온도에서 꺾이기 시작**합니다.\n\n**원인**으로는 B의 **유리전이온도(Tg)가 더 낮을 가능성**을 먼저 생각합니다. Tg를 넘으면 EMC의 열팽창이 크게 늘기 때문에, Tg가 낮은 소재는 더 낮은 온도부터 휨이 빠르게 변합니다.\n\n**영향**은 고온 쪽이 더 큽니다. 실장할 때 리플로우 온도에서 휨이 크면 **범프나 솔더 볼의 접합 불량**으로 이어집니다. 상온 값만 보고 B가 더 좋다고 판단하면 안 됩니다.\n\n**대책**은 Tg와 필러 조성을 조정한 소재를 검토하거나, 후경화 조건으로 개선되는지 확인하는 것입니다. 추가로 **두 소재의 Tg와 CTE 데이터**를 확인하고 싶습니다.", "k": [["사실 읽기", "상온|고온|가로축|세로축|방향"], ["비교", "B|A|더 작|더 크|커집니다"], ["원인", "Tg|유리전이|열팽창|CTE"], ["영향", "리플로우|접합|범프|솔더"], ["대책", "필러|후경화|조정|확인"]], "f": []}, {"id": "V2", "c": "pkg", "t": "예상", "sec": 120, "chart": "filler", "q": "그래프는 EMC의 필러 함량에 따른 열팽창계수(CTE)와 점도의 변화입니다. 무엇을 읽을 수 있고, 최적 함량을 어떻게 정하겠습니까?", "why": ["트레이드오프를 그래프에서 읽고 판단 기준을 세우는지 봅니다. \"가운데가 좋다\"가 아니라 기준이 있어야 합니다."], "p": ["사실: 함량↑ → CTE↓(완만), 점도↑(가파르게)", "의미: 휨에는 유리, 충진에는 불리", "판단 기준: 충진 한계 안에서 가장 높은 함량", "추가 확인 데이터"], "m": "**읽을 수 있는 사실**은 두 가지입니다. 필러 함량이 늘수록 **CTE는 꾸준히 낮아지고**, **점도는 올라가는데 높은 함량에서 급격히 올라갑니다**.\n\n**의미**는 트레이드오프입니다. CTE가 낮아지면 실리콘과의 열팽창 차이가 줄어 **휨과 응력에 유리**하지만, 점도가 오르면 **좁은 갭의 충진이 어려워져 Void 위험**이 커집니다.\n\n**최적 함량**은 가운데 값이 아니라 **기준으로 정해야** 합니다. 충진성은 반드시 만족해야 하는 조건이므로, 먼저 갭을 Void 없이 채울 수 있는 **점도의 상한**을 실험으로 정하고, 그 한계 안에서 **가장 높은 함량**을 고르겠습니다. 그래프에서는 점도가 급격히 오르기 직전 구간이 후보입니다.\n\n추가로 **필러 크기 분포를 바꾸면 같은 함량에서 점도를 낮출 수 있는지**, 그리고 열전도 데이터를 함께 보고 싶습니다.", "k": [["사실 읽기", "CTE|점도|낮아|올라|급격"], ["의미", "트레이드|휨|충진|void|보이드"], ["판단 기준", "상한|기준|한계|가장 높은"], ["추가 확인", "크기 분포|열전도|추가"]], "f": []}, {"id": "V3", "c": "mfg", "t": "예상", "sec": 120, "chart": "spc", "q": "그래프는 어떤 공정의 두께 측정값 관리도입니다. 이 공정은 정상입니까? 무엇을 하겠습니까?", "why": ["2지망 양산기술을 겨냥한 문항입니다. \"한계 안이니까 정상\"이라고 답하면 틀립니다."], "p": ["사실: 모든 점이 관리 한계 안", "그러나 뒤쪽 점들이 연속으로 상승", "판단: 이상 신호, 곧 한계를 벗어날 수 있음", "조치: 원인 확인, 변화 시점에 바뀐 것"], "m": "**사실부터** 말씀드리겠습니다. 모든 점이 위아래 관리 한계 안에 있습니다. 하지만 **뒤쪽의 점들이 연속해서 올라가고 있고**, 마지막 점은 위쪽 한계에 가까워졌습니다.\n\n그래서 저는 이 공정을 **정상이라고 보지 않습니다**. 관리도는 한계를 벗어난 점뿐 아니라 **한쪽으로 이어지는 경향**도 이상 신호로 봅니다. 이대로면 몇 번 안에 한계를 벗어날 가능성이 높습니다.\n\n**조치**는 세 가지입니다. 먼저 상승이 **시작된 시점에 바뀐 것**을 찾습니다. 자재 로트 교체, 부품 마모, 점검 이후 경과 시간 같은 것입니다. 다음으로 **측정 자체의 문제는 아닌지** 확인합니다. 그리고 원인이 확인될 때까지 **측정 빈도를 높여** 한계를 벗어나기 전에 대응합니다.\n\n서서히 오르는 모양은 **소모품의 마모나 누적 오염처럼 시간에 따라 변하는 원인**을 먼저 의심하게 합니다.", "k": [["사실 읽기", "한계 안|관리 한계|모든 점"], ["경향", "연속|상승|올라|경향"], ["판단", "정상이 아니|이상|벗어날"], ["조치", "바뀐|시점|측정|빈도"], ["원인 추정", "마모|오염|로트|시간"]], "f": []}, {"id": "V4", "c": "pkg", "t": "예상", "sec": 120, "chart": "stack", "q": "그래프는 접합 1회당 수율이 다른 세 경우에 대해, 적층 단수에 따른 적층 수율을 계산한 것입니다. 무엇을 읽을 수 있습니까?", "why": ["누적 수율의 개념을 이해하는지 봅니다. HBM에서 접합 수율과 양품 칩 선별이 왜 중요한지로 연결해야 합니다."], "p": ["사실: 단수가 늘수록 수율 하락, 접합 수율이 낮을수록 가파름", "원리: 곱셈 (누적)", "의미: 작은 차이가 고단에서 크게 벌어짐", "대책: 접합 수율 향상, 양품 칩만 적층, 휨 관리"], "m": "**읽을 수 있는 사실**은 두 가지입니다. 적층 단수가 늘수록 수율이 떨어지고, **접합 1회당 수율이 조금만 낮아도 고단에서는 차이가 크게 벌어집니다**. 8단에서는 세 선의 차이가 작지만 16단 이상에서는 눈에 띄게 벌어집니다.\n\n**원리**는 곱셈입니다. 한 번의 접합이 모두 성공해야 전체가 양품이기 때문에, 적층 수율은 **1회 수율을 단수만큼 곱한 값**이 됩니다.\n\n**의미**는 적층 단수가 늘수록 **접합 한 번의 완성도가 훨씬 더 중요해진다**는 것입니다. 낮은 단수에서는 괜찮던 수율이 고단 제품에서는 받아들일 수 없는 수준이 됩니다.\n\n**대책**은 세 방향입니다. 접합 불량의 원인인 **휨과 범프 높이 편차를 줄이고**, 검사를 통과한 **양품 칩만 쌓고**, 불량이 생긴 층을 빨리 찾아내는 검사를 두는 것입니다. HBM에서 패키징 수율이 제품 원가와 공급량을 좌우하는 이유라고 생각합니다.", "k": [["사실 읽기", "단수|떨어|벌어"], ["원리", "곱|누적"], ["의미", "중요|고단|접합"], ["대책", "휨|양품|검사|범프"]], "f": []}], "PT": [{"id": "PT1", "title": "신규 고방열 EMC 적용 후 불량 3종", "job": "PKG개발", "brief": "당신은 PKG 공정개발 담당자입니다. 차세대 16단 적층 제품의 방열 성능을 높이려고 신규 고방열 EMC(소재 B)를 평가하고 있습니다. 기존 소재 A보다 열 특성은 좋아졌지만 아래 문제가 확인됐습니다. 양산 이관을 판단하는 회의까지 6주가 남았습니다.", "data": [["필러 함량", "A 88% → B 91%"], ["필러 최대 입경 (칩 사이 갭 약 25µm)", "A 5µm → B 8µm"], ["성형 온도에서의 점도 (A=100)", "B 150"], ["열전도 (A=100)", "B 180"], ["유리전이온도 Tg", "A 150℃ → B 135℃"], ["갭 Void 불량률", "A 0.3% → B 2.1% (칩 중앙부에 집중)"], ["휨: 상온 / 260℃ (A=100)", "B 85 / B 140"], ["온도 사이클 500회 후 박리", "A 0/45 → B 3/45 (칩 모서리)"]], "ask": ["문제를 한 문장으로 정의하십시오.", "불량별 원인 가설과 검증 방법을 제시하십시오.", "6주 안에 무엇부터 할지 우선순위와 일정을 정하십시오.", "회의에서 제시할 권고안과 그 전제(리스크)를 밝히십시오."], "m": "**문제 정의**: 소재 B는 방열 이득이 확인됐지만 **충진성(Void), 고온 휨, 신뢰성(박리)** 세 지표가 기준에 못 미칩니다. 6주 안에 '공정 조건으로 살릴 수 있는가, 소재 수정이 필요한가'를 판단해야 합니다.\n\n**우선순위**: ① **시험 기간이 긴 신뢰성 샘플을 1주 차에 먼저 투입**합니다. ② Void를 가장 먼저 풉니다. 갭 안의 Void는 방열 이득 자체를 지우고 신뢰성에도 영향을 주기 때문입니다. ③ 고온 휨은 Void 조건이 잡힌 뒤 같은 샘플로 봅니다.\n\n**원인 가설과 검증**\n- Void: **점도 상승**으로 중앙부까지 채우기 전에 유동이 멈췄거나, **필러 입경이 갭에 비해 커져** 걸렸을 가능성. → 중앙부 단면에서 필러 걸림을 확인하고, 더미 자재로 **온도·압력·진공 DOE**. 동시에 공급사에 입경을 줄인 시료를 요청.\n- 고온 휨: **Tg가 낮아져** 고온에서 열팽창이 큰 구간이 길어졌을 가능성. → **온도별 휨 곡선**이 Tg 부근에서 꺾이는지 확인하고, 후경화 조건으로 개선되는지 확인.\n- 박리: 모서리의 **응력 집중**과 **계면 접착력 또는 흡습**. → 박리가 난 계면 위치를 확인하고, 흡습 전처리 유무로 비교.\n\n**권고안**: 공정 조건만으로 Void가 기준 안에 들어오면 조건부 진행, 아니면 **입경 조정 시료로 재평가**. 방열 이득과 불량 위험을 같은 표에 놓고 비교해서 보고합니다.\n\n**전제와 리스크**: 6주로는 장기 신뢰성을 다 볼 수 없으므로, 중간 결과로 판단한다는 점과 남는 위험을 명시합니다.", "f": [["우선순위를 Void 먼저로 둔 근거는 무엇입니까?", "방열 이득을 지우는 불량이고, 원인 후보가 좁아 빨리 검증 가능. 박리는 시험 시간이 길어 '먼저 투입'하되 분석은 뒤."], ["Void의 원인이 점도가 아니라 진공도였다면 계획은 어떻게 바뀝니까?", "DOE에 진공 수준을 넣어 뒀기 때문에 같은 실험에서 구분된다. 소재 수정 요청은 보류."], ["6주 안에는 온도 사이클 1,000회를 못 돌립니다. 신뢰성은 어떻게 판단합니까?", "중간 회차 결과 + 박리 계면 분석으로 추세 판단. 판단의 한계를 권고안에 명시."], ["소재 B를 포기하고 A로 가자는 의견이 나오면 어떻게 답하겠습니까?", "반대하지 않고 기준 제시: 방열 요구를 A로 만족할 수 있는가. 못 하면 B의 수정안을 병행."], ["LLM이 제시한 원인 중 채택하지 않은 것은 무엇이고, 이유는 무엇입니까?", "주어진 자료와 맞지 않는 가설을 근거와 함께."], ["이 과제에 본인의 현 직장 경험을 연결한다면?", "필러 입자 유동, 계면 접착, 수분·보이드 관리. 차이(경화)는 먼저 인정."], ["고온 휨이 나빠지면 고객 공정에서 어떤 일이 생깁니까?", "실장 리플로우에서 범프 접합 불량. 그래서 상온만이 아니라 고온 휨이 중요."]], "s": ["gen", "jobrep2"]}, {"id": "PT2", "title": "16단 전환: 현 방식 고도화 vs 새 접합 방식", "job": "PKG개발", "brief": "당신은 PKG 제품 개발 담당자입니다. 12단 제품을 16단으로 전환하면서 패키지 높이는 그대로 유지해야 합니다. 시험 적층에서 아래 문제가 나왔습니다. 고객 샘플 납기는 9개월 뒤입니다. 두 가지 방안 중 무엇을 권고할지 정하십시오.", "data": [["칩 두께 (12단=100)", "16단 약 70"], ["칩 휨 (12단=100)", "16단 180"], ["범프 접합 불량", "12단 0.1% → 16단 1.4% (칩 가장자리에 집중)"], ["방안 A", "현 방식(MR-MUF) 고도화: 휨 제어 강화, 접합 조건 최적화. 기존 설비 사용"], ["방안 B", "새 접합 방식(하이브리드 본딩) 조기 도입: 칩을 덜 얇게 해도 됨. 신규 설비와 공정 검증 필요"]], "ask": ["판단 기준을 먼저 제시하십시오.", "두 방안의 장점과 위험을 비교하십시오.", "권고안과 9개월 일정, 그리고 중간 점검 시점을 정하십시오."], "m": "**판단 기준**: ① 9개월 안에 고객 샘플 품질을 만족할 가능성 ② 양산 수율과 원가 ③ 다음 세대로 이어지는가. 이번 결정에서는 **납기 내 실현 가능성**을 가장 무겁게 둡니다.\n\n**비교**\n- 방안 A: 기존 설비와 축적된 조건을 쓰기 때문에 **일정 위험이 작습니다**. 다만 불량이 가장자리에 몰린 것은 **휨이 원인**일 가능성이 높아, 칩이 더 얇아지는 다음 세대에서는 한계가 다시 옵니다.\n- 방안 B: 칩을 덜 얇게 가져갈 수 있어 **휨 문제의 원인 자체를 줄입니다**. 하지만 표면 평탄도, 파티클, 정렬 같은 새 과제와 **설비·검증 기간의 위험**이 큽니다.\n\n**권고안**: **A를 주 경로로, B를 병행 평가**로 둡니다. 9개월 납기는 A로 맞추고, B는 같은 기간에 핵심 위험(접합 수율)을 확인해 다음 세대의 판단 자료를 만듭니다.\n\n**실행**: 1~2개월 차에 가장자리 불량의 원인을 확인합니다(휨 분포와 불량 위치의 상관). 3~5개월 차에 휨 제어와 접합 조건 최적화, 6개월 차에 **중간 점검**: 접합 불량이 목표에 못 미치면 고객과 사양(두께)을 협의하는 대안을 준비합니다.\n\n**리스크**: 원인이 휨이 아닐 가능성. 그래서 첫 단계에서 원인 확인을 먼저 둡니다.", "f": [["가장자리에 불량이 몰린 것이 휨 때문이라는 근거는 무엇입니까?", "휜 칩은 가장자리에서 범프 높이 차가 가장 크다. 다만 가설이므로 휨 분포와 불량 위치의 상관으로 먼저 확인."], ["병행 평가는 자원이 두 배로 듭니다. 한쪽에 집중해야 하지 않습니까?", "B는 전체 개발이 아니라 핵심 위험 한 가지만 확인하는 최소 범위로 한정."], ["6개월 차 점검에서 A가 목표에 못 미치면 어떻게 합니까?", "미리 정해 둔 대안(고객과 사양 협의, 납기 조정 근거 자료)을 실행."], ["고객이 새 방식을 요구한다면 판단이 달라집니까?", "달라진다. 판단 기준 ①에 고객 요구가 들어간다. 그 경우 위험을 숫자로 공유."], ["본인이 방안을 정할 권한이 없는 신입이라면 무엇을 하겠습니까?", "판단에 필요한 데이터(휨-불량 상관)를 가장 빨리 만드는 일."]], "s": ["gen", "hotchips"]}, {"id": "PT3", "title": "증설 장비에서만 낮은 수율", "job": "양산기술", "brief": "당신은 양산기술 공정 엔지니어입니다. 증설로 들여온 3호기를 거친 로트만 수율이 기존 1·2호기보다 낮습니다. 생산 계획상 3호기는 다음 주부터 전량 가동해야 합니다.", "data": [["수율 (1·2호기 평균 대비)", "3호기 −2.5%p"], ["불량 위치", "웨이퍼 가장자리에 집중"], ["조건 설정값", "세 장비 동일"], ["장비 센서 기록", "3호기의 평균 온도는 같지만 가장자리 온도 편차가 큼"], ["시점", "정기 점검(PM) 직후 처음 5개 로트에서 특히 낮음"], ["자재 로트", "세 장비 공통"]], "ask": ["원인 가설을 가능성 순으로 정리하십시오.", "점검 순서와 필요한 데이터를 제시하십시오.", "다음 주 전량 가동 여부에 대한 권고와 조건을 밝히십시오."], "m": "**문제 정의**: 설정값은 같은데 **3호기의 실제 상태가 다르고**, 그 차이가 **웨이퍼 가장자리**에서 불량으로 나타납니다.\n\n**가설(가능성 순)**\n1. **가장자리 온도 불균일**: 센서 기록의 편차와 불량 위치가 일치합니다. 가열부나 웨이퍼를 받치는 부품의 설치 상태, 센서 보정을 의심합니다.\n2. **점검 직후의 상태 불안정**: PM 직후 5개 로트에서 더 나쁜 것은, 점검 뒤 장비가 안정되기 전에 제품을 투입했을 가능성을 보여 줍니다.\n3. 자재는 세 장비 공통이므로 **가능성이 낮다**고 보고 뒤로 미룹니다.\n\n**점검 순서**: ① 같은 로트를 1호기와 3호기에 나눠 진행해 장비 차이를 확정 ② 3호기 가장자리 온도를 실측해 센서값과 비교 ③ 관련 부품의 설치 상태 점검과 보정 ④ PM 직후 안정화 절차(더미 진행 횟수)를 기존 장비와 비교.\n\n**권고**: 원인이 확인되기 전 **전량 가동은 권고하지 않습니다**. 대신 가장자리 영향이 작은 제품부터 **제한 가동**하고, ①~②를 이번 주 안에 끝내 가동 범위를 다시 판단합니다. 권고에는 **전량 가동 시 예상 불량 규모와 제한 가동 시 생산 손실**을 함께 적어 결정할 수 있게 합니다.\n\n**재발 방지**: 확인된 항목을 **신규 장비 셋업 점검 기준과 PM 후 안정화 기준**에 추가합니다.", "f": [["생산 쪽에서 \"무조건 전량 가동\"을 요구하면 어떻게 하겠습니까?", "불량 예상 규모를 숫자로 제시. 결정은 근거와 함께 상위로. 가동하더라도 물량 구분과 모니터링 유지."], ["온도 편차가 원인이 아니었다면 다음은 무엇을 보겠습니까?", "가장자리에 영향을 주는 다른 변수(가스 흐름, 압력 분포, 웨이퍼 위치 정렬)로 확장."], ["자재를 가능성 낮다고 본 것은 섣부르지 않습니까?", "세 장비 공통이라 3호기만의 차이를 설명하지 못한다. 다만 장비와 자재의 상호작용 가능성은 열어 둔다."], ["본인은 반도체 장비 경험이 없는데 이 판단을 어떻게 믿습니까?", "장비 세부는 배워야 하지만, '설정값이 같아도 실제 상태가 다르다'는 문제는 현 직장 설비에서도 다뤘다."]], "s": ["comm", "job1"]}, {"id": "PT4", "title": "3주 안에 신규 소재 3종 중 1종 선정", "job": "공통", "brief": "당신은 신규 갭 충진 소재를 평가하는 담당자입니다. 후보 소재 3종 중 1종을 3주 안에 골라야 합니다. 쓸 수 있는 것은 더미 웨이퍼 24장과 설비 1대뿐입니다.", "data": [["소재 X", "점도 낮음, 열전도 보통, 가격 높음"], ["소재 Y", "점도 보통, 열전도 높음, 경화 시간 김"], ["소재 Z", "점도 높음, 열전도 가장 높음, 공급사 양산 이력 없음"], ["제약", "더미 웨이퍼 24장, 설비 1대, 3주"], ["요구", "충진성(Void)과 휨은 반드시 기준 만족, 방열은 높을수록 좋음"]], "ask": ["선정 기준과 가중치를 정하십시오.", "24장을 어떻게 나눠 쓸지 실험 계획을 세우십시오.", "3주 일정과, 결과가 애매할 때의 판단 원칙을 정하십시오."], "m": "**선정 기준**: '반드시 만족'과 '높을수록 좋음'을 나눕니다. **충진성과 휨은 합격·불합격 기준**이고, 합격한 소재 가운데 **방열, 생산성(경화 시간), 공급 안정성, 가격**을 비교합니다.\n\n**실험 계획(24장)**\n- 1단계 선별(9장): 소재별 3장을 **기준 조건**으로 진행해 충진성과 휨을 봅니다. 기준에 크게 못 미치는 소재는 여기서 제외합니다.\n- 2단계 조건 탐색(12장): 남은 소재에 대해 **온도와 압력 2수준**으로 조건을 바꿔 공정 여유를 확인합니다.\n- 예비(3장): 재현 확인과 문제 발생 시 재실험에 씁니다. **예비를 남기지 않는 계획은 위험**합니다.\n\n**일정**: 1주 차 선별과 분석, 2주 차 조건 탐색, 3주 차 재현 확인과 보고.\n\n**판단 원칙**: 결과가 비슷하면 **위험이 작은 쪽**을 고릅니다. 예를 들어 Z가 방열은 가장 좋아도 충진성이 경계선이고 양산 이력이 없다면, 이번에는 Y를 고르고 Z는 다음 평가 후보로 남깁니다.\n\n**한계**: 3주로는 장기 신뢰성을 볼 수 없으므로, 선정 후 **신뢰성 평가를 조건으로** 붙입니다.", "f": [["왜 처음부터 24장을 3종에 8장씩 나누지 않았습니까?", "탈락할 소재에 자원을 쓰지 않기 위해 선별 단계를 먼저 둠."], ["소재별 3장으로 판단하기에는 표본이 적지 않습니까?", "적다. 그래서 1단계는 '크게 미달'만 걸러내고, 경계선이면 2단계로 넘겨 더 본다."], ["방열이 가장 중요한 과제인데 왜 Z를 고르지 않습니까?", "방열은 '높을수록 좋음', 충진성은 '반드시 만족'. 기준의 종류가 다르다."], ["이 계획을 세울 때 LLM을 어떻게 썼습니까?", "계획의 빈틈(빠진 변수, 예비 수량)을 점검하는 데 사용. 기준과 배분은 직접 결정."]], "s": ["jobrep2", "gen"]}], "GD": [{"id": "G1", "topic": "AI가 내린 판단으로 문제가 생겼을 때, 책임은 누구에게 있는가?", "bg": "공장의 AI가 설비 정지 시점을 잘못 판단해 손실이 났다고 가정합니다. 만든 사람, 쓴 사람, 도입을 결정한 조직 가운데 누가 책임져야 할까요.", "pro": ["사용자·조직 책임: 최종 결정권을 가진 쪽이 책임져야 한다. AI는 도구이고, 도구를 믿기로 한 것은 사람이다.", "책임을 사람에게 두어야 검증 절차가 생긴다."], "con": ["개발자·공급자 책임: 사용자가 내부를 검증할 수 없는 도구라면 만든 쪽의 책임이 크다.", "책임을 사용자에게만 두면 아무도 AI를 쓰려 하지 않아 혁신이 늦어진다."], "opp": ["저는 생각이 다릅니다. 현장 작업자는 AI가 왜 그런 판단을 했는지 알 방법이 없습니다. 알 수 없는 것에 책임을 지라는 건 불공정합니다.", "책임을 나누자는 말은 듣기엔 좋지만, 결국 아무도 책임지지 않게 됩니다. 한 사람을 정해야 합니다."], "m": "(첫 발언) 저는 **최종 결정권을 가진 쪽이 1차 책임**을 져야 한다고 생각합니다. AI는 판단을 제안할 뿐이고, 그 제안을 따르기로 한 것은 사람이나 조직이기 때문입니다. 다만 조건이 있습니다. 사용자가 **AI의 판단 근거를 확인할 수 있어야** 한다는 것입니다.\n\n(받아서 잇기) 방금 말씀하신 **'알 수 없는 것에 책임을 지게 하는 건 불공정하다'는 점에 동의합니다**. 그래서 제 의견을 조금 고치고 싶습니다. 근거를 확인할 수 없는 AI라면 만든 쪽의 책임이 커지고, 확인할 수 있는데 확인하지 않았다면 쓴 쪽의 책임이 커진다고 보면 어떨까요.\n\n(정리) 지금까지 나온 의견을 정리하면, **'누구냐'보다 '어떤 조건에서 누구냐'**로 모이는 것 같습니다. 판단 근거의 공개 여부와 최종 결정권, 이 두 가지를 기준으로 책임을 나누자는 데 대체로 동의하신 것으로 이해했습니다."}, {"id": "G2", "topic": "효율과 공정함이 충돌할 때, 조직은 무엇을 우선해야 하는가?", "bg": "성과가 높은 사람에게 기회를 몰아주면 조직의 성과는 오르지만, 기회를 얻지 못한 사람은 성장할 수 없습니다.", "pro": ["효율 우선: 조직이 살아남아야 공정함도 지킬 수 있다. 자원은 성과가 날 곳에 써야 한다.", "성과에 따른 차등 자체가 하나의 공정함이다."], "con": ["공정 우선: 기회가 불공정하면 구성원이 최선을 다하지 않아 장기 효율이 떨어진다.", "지금의 성과 차이는 과거 기회의 차이에서 온 것일 수 있다."], "opp": ["좋은 말씀이지만 현실적이지 않습니다. 경쟁사는 기다려 주지 않습니다. 당장 성과를 내는 사람에게 맡기는 게 맞습니다.", "공정하게 기회를 나누다가 프로젝트가 실패하면 그 책임은 누가 집니까?"], "m": "(첫 발언) 저는 **단기 과제는 효율, 장기 육성은 공정함**으로 나눠서 봐야 한다고 생각합니다. 납기가 급한 일은 가장 잘하는 사람이 맡는 게 맞지만, 모든 일을 그렇게 하면 **잘하는 사람만 계속 잘하게 되는 구조**가 됩니다.\n\n(받아서 잇기) **경쟁사가 기다려 주지 않는다는 말씀은 맞습니다.** 그 점을 받아들이면, 핵심 과제는 효율을 우선하되 **그 과제에 배우는 사람을 한 명씩 붙이는 방식**은 어떨까요. 속도를 크게 잃지 않으면서 다음 사람을 키울 수 있습니다.\n\n(정리) 두 입장 모두 **조직이 오래 성과를 내야 한다**는 목표는 같았습니다. 차이는 시간 범위였고, 급한 일과 사람을 키우는 일을 구분해서 원칙을 달리하자는 쪽으로 의견이 모였다고 정리하겠습니다."}, {"id": "G3", "topic": "기술의 발전은 사람을 더 자유롭게 하는가, 더 의존적으로 만드는가?", "bg": "길 찾기, 계산, 글쓰기까지 기술에 맡기는 일이 늘고 있습니다.", "pro": ["자유: 반복적인 일에서 벗어나 더 가치 있는 일에 시간을 쓸 수 있다.", "과거에는 일부만 가질 수 있던 지식과 도구를 누구나 쓰게 됐다."], "con": ["의존: 스스로 할 수 있던 능력이 약해지고, 기술이 멈추면 아무것도 못 하게 된다.", "기술을 가진 쪽에 대한 의존이 커진다."], "opp": ["계산기를 쓴다고 수학을 못하게 된 건 아니잖아요. 의존이라는 말은 과장입니다.", "자유로워졌다고 하시지만, 사람들은 그 시간에 또 화면을 보고 있습니다. 그게 자유입니까?"], "m": "(첫 발언) 저는 **기술 자체는 중립이고, '무엇을 맡기느냐'가 자유와 의존을 가른다**고 생각합니다. 실행을 맡기면 자유로워지지만, **판단까지 맡기면 의존**하게 됩니다.\n\n(받아서 잇기) **계산기 비유에 동의합니다.** 계산이라는 실행은 맡겨도 어떤 식을 세울지는 사람이 정하니까요. 같은 기준으로 보면, AI에게 초안을 맡기는 것은 괜찮지만 **무엇이 옳은지의 판단을 맡기기 시작하면** 의존이 된다고 덧붙이고 싶습니다.\n\n(정리) 정리하면, 기술이 주는 것은 시간이고 **그 시간을 판단하는 데 쓰느냐에 따라 결과가 갈린다**는 데 의견이 모였습니다. 그래서 무엇을 기술에 맡기지 않을지를 정하는 것이 중요하다는 결론입니다."}, {"id": "G4", "topic": "실패를 용인하는 문화와 성과에 대한 책임은 함께 갈 수 있는가?", "bg": "도전을 장려하려면 실패를 용인해야 하지만, 실패를 용인하면 책임이 느슨해진다는 걱정도 있습니다.", "pro": ["양립 가능: 실패의 '종류'를 나누면 된다. 새로운 시도의 실패와 부주의의 실패는 다르다.", "실패를 숨기지 않게 해야 같은 실패가 반복되지 않는다."], "con": ["양립 어려움: 현실에서는 그 구분이 모호하고, 결국 평가에서 불이익을 받는다.", "용인이 반복되면 기준이 낮아진다."], "opp": ["말로는 구분할 수 있지만, 실제 평가에서는 실패한 사람이 손해를 봅니다. 그러면 아무도 도전하지 않습니다.", "반도체처럼 불량 하나가 큰 손실인 산업에서 실패를 용인한다는 게 가능합니까?"], "m": "(첫 발언) 저는 **함께 갈 수 있다**고 생각합니다. 다만 조건은 **실패의 종류를 나누는 것**입니다. 가설을 세우고 검증하다 틀린 실패는 자산이지만, 확인해야 할 것을 확인하지 않은 실패는 책임을 져야 합니다.\n\n(받아서 잇기) **실제 평가에서는 손해를 본다는 지적이 현실적이라고 생각합니다.** 그래서 결과만이 아니라 **과정의 기록**을 평가에 넣으면 어떨까요. 가설과 근거가 남아 있으면 틀려도 다음 사람이 쓸 수 있습니다.\n\n(정리) 의견을 모아 보면, **작게 빨리 실패하는 단계와 실패가 허용되지 않는 단계를 구분하자**는 것이 공통점이었습니다. 개발 초기에는 실패를 드러내게 하고, 양산에 가까울수록 기준을 엄격히 하자는 정리입니다."}, {"id": "G5", "topic": "전문가의 판단과 데이터(AI)의 판단이 다를 때, 무엇을 따라야 하는가?", "bg": "20년 경력 엔지니어의 직감과 데이터 분석 결과가 서로 다른 결론을 냈습니다.", "pro": ["데이터: 사람의 직감은 편향이 있고 재현되지 않는다.", "데이터는 근거를 다른 사람이 확인할 수 있다."], "con": ["전문가: 데이터에 담기지 않은 맥락을 사람은 안다. 데이터는 과거만 보여 준다.", "데이터의 품질이 나쁘면 결론도 틀린다."], "opp": ["데이터도 결국 누군가 고른 것입니다. 무엇을 측정할지 정한 순간 이미 주관이 들어갑니다.", "경험 많은 분의 직감을 무시했다가 사고가 난 사례가 많습니다."], "m": "(첫 발언) 저는 **어느 쪽을 따를지보다, 왜 다른지를 먼저 확인해야 한다**고 생각합니다. 두 판단이 다르다는 것 자체가 **데이터에 빠진 변수가 있거나, 경험에 맞지 않는 새 조건이 생겼다는 신호**이기 때문입니다.\n\n(받아서 잇기) **무엇을 측정할지 정하는 데 주관이 들어간다는 말씀에 동의합니다.** 그래서 전문가의 직감을 '반대 의견'이 아니라 **'데이터가 놓친 변수의 후보'**로 다루면 어떨까요. 그 변수를 측정해 보면 둘 중 누가 맞는지 확인할 수 있습니다.\n\n(정리) 결국 **둘을 대립시키지 말고 서로를 검증하는 데 쓰자**는 쪽으로 모였습니다. 시간이 없어 하나를 골라야 한다면 되돌리기 쉬운 쪽을 먼저 해 본다는 원칙도 나왔습니다."}, {"id": "G6", "topic": "빠른 실행과 신중한 검토 중, 지금 시대에 더 필요한 것은 무엇인가?", "bg": "시장은 속도를 요구하지만, 한 번의 실수가 큰 손실로 이어지기도 합니다.", "pro": ["빠른 실행: 완벽한 계획은 없다. 해 보고 고치는 쪽이 결국 더 빨리 배운다.", "늦은 정답보다 빠른 80점이 낫다."], "con": ["신중한 검토: 되돌릴 수 없는 결정은 속도보다 정확성이 중요하다.", "빠른 실행이 남긴 문제를 고치는 데 더 많은 시간이 든다."], "opp": ["검토만 하다가 기회를 놓친 회사가 얼마나 많습니까.", "빨리 해 보자는 건 결국 뒷사람에게 문제를 넘기는 것 아닙니까?"], "m": "(첫 발언) 저는 **결정의 종류에 따라 다르다**고 생각합니다. **되돌릴 수 있는 결정은 빠르게**, **되돌릴 수 없는 결정은 신중하게** 해야 합니다. 문제는 대부분의 조직이 이 둘을 같은 속도로 처리한다는 점입니다.\n\n(받아서 잇기) **기회를 놓친다는 말씀에 공감합니다.** 그렇다면 신중해야 하는 결정에서도 **검토 기한을 먼저 정해 두는 것**은 어떨까요. 신중함이 미루기가 되지 않도록 하는 장치입니다.\n\n(정리) 속도와 신중함은 **반대말이 아니라 결정의 성격에 따라 고르는 것**이라는 데 의견이 모였습니다. 되돌릴 수 있는지를 먼저 묻자는 것이 오늘의 결론입니다."}, {"id": "G7", "topic": "개인의 행복과 조직의 목표가 충돌할 때, 어떻게 해야 하는가?", "bg": "중요한 프로젝트의 마감과 개인의 중요한 일정이 겹쳤습니다.", "pro": ["조직 우선: 함께 정한 목표는 약속이다. 한 사람의 빈자리를 다른 사람이 메워야 한다.", "조직이 성과를 내야 개인의 행복도 지속된다."], "con": ["개인 우선: 행복하지 않은 구성원은 오래 성과를 낼 수 없다.", "매번 조직이 우선이면 결국 사람이 떠난다."], "opp": ["모두가 개인 사정을 앞세우면 조직은 돌아가지 않습니다.", "조직을 위해 참으라는 말은 결국 약한 사람에게만 요구됩니다."], "m": "(첫 발언) 저는 **둘을 맞바꾸는 문제로 보지 않았으면** 합니다. 충돌이 생긴 순간에는 누군가 양보해야 하지만, **같은 사람이 계속 양보하는 구조**가 문제라고 생각합니다.\n\n(받아서 잇기) **약한 사람에게만 요구된다는 말씀이 중요하다고 생각합니다.** 그래서 이번에 양보한 사람이 누구인지 **기록하고 다음에 돌려주는 방식**을 제안합니다. function toast(msg,ms=3200){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),ms)}

/* 예시 답변 표시: **키워드** → 굵은 빨강, [직접 채울 것: …] → 노란 칸 */
function fmt(t){
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,'<b class="kw">$1</b>').replace(/\[직접 채울 것:?\s*([^\]]*)\]/g,'<mark class="fill">✎ 직접 채우기: $1</mark>');
  let html='',inList=false;
  for(const ln of esc(t).split('\n')){
    const s=ln.trim();
    if(!s){if(inList){html+='</ul>';inList=false}continue}
    if(s.startsWith('- ')){if(!inList){html+='<ul class="clean">';inList=true}html+='<li>'+inline(s.slice(2))+'</li>'}
    else{if(inList){html+='</ul>';inList=false}html+='<p>'+inline(s)+'</p>'}
  }
  return html+(inList?'</ul>':'');
}
const plain=t=>t.replace(/\*\*/g,'');
function srcHtml(keys){
  if(!keys||!keys.length)return '';
  return '<div class="srcs">근거: '+keys.map(k=>{const s=D.SRC[k];if(!s)return '';return s[1]?`<a href="${esc(s[1])}" target="_blank" rel="noopener noreferrer">${esc(s[0])}</a>`:esc(s[0])}).filter(Boolean).join(' · ')+'</div>';
}
function tagHtml(q){return `<span class="tag t-${esc(q.t||'예상')}">${esc(q.t||'예상')}</span>`+(q.c&&CNAME[q.c]?`<span class="tag">${esc(CNAME[q.c])}</span>`:'')}

/* ---------- 자동 채점 (참고용) ---------- */
const FILLER=/(^|[\s,.])(음+|어+|그+|저기|약간|뭔가|막|이제|그러니까|뭐랄까)(?=[\s,.]|$)/g;
const ABSOL=/완벽|100\s?%|백\s?퍼센트|무조건|절대로|압도|비약적|강력한 무기/g;
function scoreAnswer(q,text,sec){
  const t=(text||'').trim(), len=nchar(t), ks=q.k||[];
  const hits=ks.map(k=>{try{return new RegExp(k[1],'i').test(t)}catch(e){return false}});
  const nHit=hits.filter(Boolean).length;
  const core=ks.length?Math.round(55*nHit/ks.length):0;
  const first=(t.split(/[.!?\n]/)[0]||'').trim();
  const tail=t.slice(-90);
  const st=[
    ['첫 문장이 짧고 분명함',first.length>=6&&nchar(first)<=60],
    ['순서를 알려 주는 말(첫째·먼저·다음으로…)',/첫째|둘째|셋째|먼저|다음으로|마지막으로|[두세네] 가지|단계/.test(t)],
    ['이유·사례(…때문, 예를 들어, 당시…)',/때문|왜냐하면|예를 들어|당시|사례|근거|데이터|경험/.test(t)],
    ['마무리 문장(…하겠습니다, …생각합니다)',/하겠습니다|생각합니다|배웠습니다|기여|감사합니다/.test(tail)]
  ];
  const struct=st.filter(x=>x[1]).length*5;
  const target=Math.round((sec||q.sec||90)*5.2), ratio=target?len/target:0;
  let lenS=ratio>=.55&&ratio<=1.25?15:ratio<.55?Math.round(15*ratio/.55):Math.max(4,Math.round(15-(ratio-1.25)*20));
  const fill=(t.match(FILLER)||[]).length, abs=[...new Set((t.match(ABSOL)||[]).map(s=>s.trim()))];
  let expr=10-Math.min(6,Math.max(0,fill-2))-Math.min(4,abs.length*2);
  let total=core+struct+lenS+expr;
  const warns=[];
  if(len<40){total=Math.min(total,20);warns.push('답이 너무 짧아요. 최소 서너 문장으로 말해 보세요.')}
  if(ratio>1.25)warns.push('권장 시간보다 길어요. 배경 설명을 줄이고 결론을 앞에 두세요.');
  if(ratio<.55&&len>=40)warns.push('권장 분량보다 짧아요. 근거나 사례를 한 가지 더 붙여 보세요.');
  if(fill>2)warns.push(`군말(음·어·약간 등)이 ${fill}번 들어갔어요.`);
  if(abs.length)warns.push(`"${abs.join('", "')}" 같은 단정 표현은 근거를 묻는 꼬리질문을 부릅니다.`);
  if((q.c==='resume1'||q.c==='resume2')&&!/\d|퍼센트|배|절반/.test(t)&&len>=40)warns.push('숫자가 하나도 없어요. 상대값(몇 % 줄었다)이라도 넣어 보세요.');
  return {total:Math.max(0,Math.min(100,total)),core,struct,lenS,expr,hits,len,target,st,warns};
}
const GD_CHECK={
  first:[['입장을 분명히 말함',/생각합니다|봅니다|입장|라고 봅/],['근거 제시',/때문|왜냐하면|예를 들어|근거/],['조건·한계를 붙임',/다만|조건|경우|하지만/]],
  bridge:[['상대 의견을 받아 줌',/동의|공감|말씀|지적|맞습니다|일리/],['내 의견을 보완·수정',/그래서|덧붙|고치|보완|더하면|그렇다면/],['제안이나 질문으로 연결',/어떨까요|제안|라면|해 보면|할까요/]],
  wrap:[['논의를 요약함',/정리하면|정리하겠|모아|요약/],['공통점을 짚음',/공통|모두|모였|동의/],['결론·다음 단계',/결론|원칙|기준|하자는|으로 정리/]]
};
function scoreGd(kind,text){
  const t=(text||'').trim();const ch=(GD_CHECK[kind]||[]).map(([l,re])=>[l,re.test(t)]);
  return {ch,len:nchar(t),total:Math.round(100*ch.filter(x=>x[1]).length/Math.max(1,ch.length))};
}

/* ---------- 음성 인식 ---------- */
const V={rec:null,on:false,ta:null,base:'',cb:null,ui:null,quick:0,last:0};
function voiceStart(ta,cb){
  if(!SR){toast('이 브라우저에서는 음성 인식이 안 돼요. 키보드의 마이크(받아쓰기) 버튼을 눌러 말하면 글자로 들어갑니다.',6000);return false}
  if(V.on)voiceStop();
  V.ta=ta;V.cb=cb;V.on=true;V.quick=0;
  const begin=()=>{
    const r=new SR();r.lang='ko-KR';r.interimResults=true;r.continuous=!isMobile;r.maxAlternatives=1;
    V.rec=r;V.base=ta.value.replace(/\s+$/,'');V.last=Date.now();
    r.onresult=e=>{
      let txt='';
      if(isMobile){txt=e.results[e.results.length-1][0].transcript}
      else{for(let i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript}
      ta.value=(V.base?V.base+' ':'')+txt.trim();cb&&cb();
    };
    r.onerror=e=>{
      if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){
        V.on=false;toast('마이크를 쓸 수 없어요. 주소창 왼쪽의 자물쇠 → 마이크 허용을 확인해 주세요. 안 되면 키보드의 마이크 버튼을 쓰면 됩니다.',7000);
      }
    };
    r.onend=()=>{
      if(!V.on){V.ui&&V.ui();return}
      V.quick=(Date.now()-V.last<500)?V.quick+1:0;
      if(V.quick>4){V.on=false;V.ui&&V.ui();toast('음성 인식이 계속 끊겨요. 키보드의 마이크 버튼을 써 보세요.',6000);return}
      try{begin()}catch(err){V.on=false;V.ui&&V.ui()}
    };
    try{r.start()}catch(err){}
  };
  begin();V.ui&&V.ui();return true;
}
function voiceStop(){V.on=false;try{V.rec&&V.rec.stop()}catch(e){}V.ui&&V.ui()}

/* ---------- 내 목소리 녹음(다시 듣기) ---------- */
const R={mr:null,chunks:[],url:null,stream:null,on:false};
async function recStart(){
  if(R.on||!navigator.mediaDevices||!window.MediaRecorder)return false;
  try{
    R.stream=await navigator.mediaDevices.getUserMedia({audio:true});R.chunks=[];
    R.mr=new MediaRecorder(R.stream);
    R.mr.ondataavailable=e=>{if(e.data&&e.data.size)R.chunks.push(e.data)};
    R.mr.onstop=()=>{const b=new Blob(R.chunks,{type:R.mr.mimeType||'audio/webm'});if(R.url)URL.revokeObjectURL(R.url);R.url=URL.createObjectURL(b);R.stream.getTracks().forEach(t=>t.stop());R.on=false;const p=$('#player');if(p){p.src=R.url;p.classList.remove('hidden')}};
    R.mr.start();R.on=true;return true;
  }catch(e){R.on=false;return false}
}
function recStop(){try{if(R.mr&&R.mr.state!=='inactive')R.mr.stop()}catch(e){}}

const T={id:null,t0:0,limit:0,mode:'up',onEnd:null,onTick:null};
function timerStart(o){
  timerStop();Object.assign(T,{t0:Date.now(),limit:o.sec||0,mode:o.mode||'up',onEnd:o.onEnd||null,onTick:o.onTick||null});
  const el=$('#timer');el.classList.remove('hidden','over','prep');if(o.prep)el.classList.add('prep');
  T.id=setInterval(timerTick,250);timerTick();
}
function timerTick(){
  const el=$('#timer'),e=(Date.now()-T.t0)/1000;
  if(T.mode==='down'){
    const left=Math.max(0,Math.ceil(T.limit-e));el.textContent=mmss(left);T.onTick&&T.onTick(left);
    if(T.limit-e<=0){const cb=T.onEnd;timerStop();cb&&cb()}
  }else{el.textContent=mmss(e)+' / '+mmss(T.limit);el.classList.toggle('over',T.limit>0&&e>T.limit)}
}
const timerElapsed=()=>T.t0?Math.round((Date.now()-T.t0)/1000):0;
function timerStop(){clearInterval(T.id);T.id=null;const el=$('#timer');if(el)el.classList.add('hidden')}

/* ---------- 연습용 그래프 (수치는 가상) ---------- */
function chartSvg(kind){
  const W=520,H=300,L=56,Rg=kind==='filler'?56:18,Tp=22,B=44,pw=W-L-Rg,ph=H-Tp-B;
  const mk=(x0,x1,y0,y1)=>({x:v=>L+(v-x0)/(x1-x0)*pw,y:v=>Tp+ph-(v-y0)/(y1-y0)*ph});
  const line=(pts,s,c,dash)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" ${dash?'stroke-dasharray="6 5"':''} points="${pts.map(p=>s.x(p[0]).toFixed(1)+','+s.y(p[1]).toFixed(1)).join(' ')}"/>`;
  const txt=(x,y,t,a='middle',c='currentColor',w=400)=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="12" fill="${c}" font-weight="${w}">${t}</text>`;
  const frame=`<rect x="${L}" y="${Tp}" width="${pw}" height="${ph}" fill="none" stroke="currentColor" stroke-opacity=".35"/>`;
  const xt=(s,vals,u='')=>vals.map(v=>txt(s.x(v),H-B+16,v+u)).join('');
  const yt=(s,vals,u='',right)=>vals.map(v=>txt(right?W-Rg+6:L-6,s.y(v)+4,v+u,right?'start':'end')).join('');
  let body='';
  if(kind==='warp'){
    const s=mk(25,260,-110,80);
    body=frame+`<line x1="${L}" x2="${L+pw}" y1="${s.y(0)}" y2="${s.y(0)}" stroke="currentColor" stroke-opacity=".5" stroke-dasharray="3 4"/>`
      +line([[25,60],[150,35],[200,-5],[260,-50]],s,'var(--acc)')+line([[25,45],[135,22],[200,-45],[260,-95]],s,'var(--kw)')
      +xt(s,[25,100,150,200,260],'℃')+yt(s,[-100,-50,0,50])
      +txt(s.x(236),s.y(-10),'소재 A','middle','var(--acc)',700)+txt(s.x(158),s.y(-62),'소재 B','middle','var(--kw)',700)
      +txt(L+pw/2,H-6,'온도')+txt(14,Tp+ph/2,'휨 (가상 단위, +는 위로 볼록)','middle','currentColor',400).replace('<text','<text transform="rotate(-90 14 '+(Tp+ph/2)+')"');
  }else if(kind==='filler'){
    const s=mk(80,92,6,15),s2=mk(80,92,0,300);
    body=frame+line([[80,14],[84,11.7],[88,9.3],[92,7]],s,'var(--acc)')
      +line([[80,40],[84,58],[86,75],[88,105],[89,130],[90,165],[91,215],[92,280]],s2,'var(--kw)')
      +xt(s,[80,84,88,92],'%')+yt(s,[7,9,11,13])+yt(s2,[0,100,200,300],'',true)
      +txt(s.x(81),s.y(14.3),'CTE','start','var(--acc)',700)+txt(s.x(87.6),s2.y(150),'점도','end','var(--kw)',700)
      +txt(L+pw/2,H-6,'필러 함량 (무게 %)')+txt(L,14,'CTE (가상 단위)','start','var(--acc)')+txt(W-Rg,14,'점도 (가상 단위)','end','var(--kw)');
  }else if(kind==='spc'){
    const s=mk(0,21,94,106),ys=[100.4,99.6,100.9,99.2,100.1,100.7,99.5,100.3,99.8,100.6,99.4,100.2,100.0,100.5,101.0,101.6,102.1,102.7,103.2,103.8];
    const hl=(v,lab,c)=>`<line x1="${L}" x2="${L+pw}" y1="${s.y(v)}" y2="${s.y(v)}" stroke="${c}" stroke-dasharray="6 5"/>`+txt(L+pw-4,s.y(v)-5,lab,'end',c,700);
    body=frame+hl(104.5,'관리 상한','var(--kw)')+hl(95.5,'관리 하한','var(--kw)')+hl(100,'중심선','currentColor')
      +line(ys.map((y,i)=>[i+1,y]),s,'var(--acc)')+ys.map((y,i)=>`<circle cx="${s.x(i+1)}" cy="${s.y(y)}" r="3.5" fill="var(--acc)"/>`).join('')
      +xt(s,[1,5,10,15,20])+yt(s,[96,98,100,102,104])+txt(L+pw/2,H-6,'측정 순서 (로트)')+txt(L,14,'두께 (가상 단위)','start');
  }else if(kind==='stack'){
    const s=mk(4,20,60,100),ns=[4,8,12,16,20],f=p=>ns.map(n=>[n,100*Math.pow(p,n)]);
    body=frame+line(f(.995),s,'var(--ok)')+line(f(.99),s,'var(--acc)')+line(f(.98),s,'var(--kw)')
      +xt(s,ns,'단')+yt(s,[60,70,80,90,100],'%')
      +[[.995,'접합 1회 수율 99.5%','var(--ok)'],[.99,'99%','var(--acc)'],[.98,'98%','var(--kw)']].map(([p,l,c])=>txt(s.x(12.2),s.y(100*Math.pow(p,12))-9,l,'start',c,700)).join('')
      +txt(L+pw/2,H-6,'적층 단수')+txt(L,14,'적층 수율 (계산값)','start');
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="연습용 그래프">${body}</svg><p class="small" style="text-align:center">연습용으로 만든 가상 그래프입니다.</p>`;
}

const MODE_NAME={deep:'심층 인터뷰',ask:'A!SK 모의',pt:'문제해결 PT',gd:'Group Discussion',free:'자유 연습'};
function exportText(sess){
  const d=new Date(sess.at),pad=n=>String(n).padStart(2,'0');
  let out=`[Half-Day 면접 연습 기록] ${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())} · ${sess.title}\n`;
  if(sess.avg!=null)out+=`자동 점수 평균 ${sess.avg}점 (참고용)\n`;
  if(sess.pt)out+=`\n[PT 준비 메모]\n${sess.pt}\n`;
  let n=0;
  for(const r of sess.items){
    out+='\n'+(r.follow?'  ↳ 꼬리질문: ':`Q${++n}. `)+r.q+'\n';
    out+=`${r.follow?'  ':''}(사용 ${mmss(r.used)} / 권장 ${mmss(r.sec)}${r.score!=null?` / 자동 점수 ${r.score}`:''})\n`;
    out+=`${r.follow?'  ':''}답변: ${r.text||'(답변 없음)'}\n`;
  }
  return out;
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('복사했어요. 메신저에 붙여넣기 하면 됩니다.')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('복사했어요.')}catch(e2){toast('복사가 안 돼요. 아래 내용을 길게 눌러 직접 복사해 주세요.')}ta.remove()}
}
async function shareText(t){if(navigator.share){try{await navigator.share({title:'면접 연습 기록',text:t});return}catch(e){if(e&&e.name==='AbortError')return}}copyText(t)}

/* ---------- 모드별 준비 화면 ---------- */
const seg=(name,opts,cur)=>`<span class="seg" data-seg="${name}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" class="${String(v)===String(cur)?'on':''}">${l}</button>`).join('')}</span>`;
function bindSeg(o){$$('[data-seg]').forEach(s=>$$('button',s).forEach(b=>b.onclick=()=>{$$('button',s).forEach(x=>x.classList.remove('on'));b.classList.add('on');o[s.dataset.seg]=b.dataset.v}))}
const backRow=`<div class="row" style="margin-top:16px"><button class="btn ghost" type="button" id="backHome">← 처음으로</button></div>`;
function renderSetup(mode){
  if(mode==='book')return renderBook(); if(mode==='notes')return renderNotes(); if(mode==='hist')return renderHist();
  const v=view(),o={};
  if(mode==='deep'){
    o.n='13';o.fb='now';
    v.innerHTML=`<section class="hero"><h1>심층 인터뷰</h1><p>자기소개부터 마지막 발언까지, 지원서를 파고드는 순서로 진행합니다. 답을 제출하면 꼬리질문을 골라 이어서 답할 수 있습니다.</p></section>
    <div class="card"><div class="h4" style="margin-top:0">문항 수</div>${seg('n',[['7','7문항 · 약 20분'],['13','13문항 · 약 40분']],o.n)}
    <div class="h4">피드백</div>${seg('fb',[['now','답할 때마다 보기'],['end','끝나고 한꺼번에 (실전처럼)']],o.fb)}
    <p class="small">심층 인터뷰의 실제 문항 수와 시간은 공개되지 않았습니다. 13문항·40분은 연습용 기준입니다.</p>
    <div class="row" style="margin-top:12px"><button class="btn pri" type="button" id="startBtn">시작하기</button></div></div>${backRow}`;
    $('#startBtn').onclick=()=>startSession('deep','심층 인터뷰',buildDeep(+o.n,o.fb==='end'),{});
  }else if(mode==='ask'){
    o.prep='20';o.scope='pkg';
    v.innerHTML=`<section class="hero"><h1>A!SK 모의</h1><p>질문이 뜨면 준비 시간 뒤에 답변 시간이 시작되고, 시간이 끝나면 다음 질문으로 자동으로 넘어갑니다. 채점과 예시 답변은 모두 끝난 뒤에 나옵니다.</p></section>
    <div class="card"><div class="h4" style="margin-top:0">문항당 준비 시간</div>${seg('prep',[['10','10초'],['20','20초'],['30','30초']],o.prep)}
    <div class="h4">직무 문항 범위</div>${seg('scope',[['pkg','PKG개발 중심'],['mfg','양산기술 포함']],o.scope)}
    <label class="row small" style="margin-top:12px"><input type="checkbox" id="autoMic" ${SR?'checked':'disabled'}> 답변 시간이 시작되면 음성 인식 자동으로 켜기</label>
    <p class="small">2026년 상반기 A!SK 후기(자기소개·지원동기 각 1분, 직무 문항, 시간이 지나면 자동 넘김, 마지막은 시각자료 해석)를 참고한 구성입니다. 실제 문항 수와 준비 시간은 다를 수 있습니다.</p>
    <div class="row" style="margin-top:12px"><button class="btn pri" type="button" id="startBtn">시작하기</button></div></div>${backRow}`;
    $('#startBtn').onclick=()=>startSession('ask','A!SK 모의',buildAsk({prep:+o.prep,mfg:o.scope==='mfg'}),{voiceAuto:$('#autoMic').checked});
  }else if(mode==='pt'){
    o.min='30';
    v.innerHTML=`<section class="hero"><h1>문제해결 PT</h1><p>시나리오를 고르면 준비 → 발표 → 면접관의 후속 질문 순서로 진행합니다. 실제 과제는 공개된 것이 없어, 직무 내용을 바탕으로 만든 예상 시나리오입니다.</p></section>
    <div class="card"><div class="h4" style="margin-top:0">준비 시간</div>${seg('min',[['15','15분'],['30','30분'],['40','40분']],o.min)}<p class="small">실제 준비 시간은 공개되지 않았습니다. 처음에는 30분, 익숙해지면 15분으로 줄여 보세요.</p></div>
    <div class="grid">${D.PT.map(p=>`<button class="mode" type="button" data-pt="${p.id}"><span class="no">${esc(p.job)}</span><h3>${esc(p.title)}</h3><p>${esc(p.brief.slice(0,74))}…</p><span class="meta">후속 질문 ${p.f.length}개${store.get('pt.'+p.id)?' · 작성 중인 메모 있음':''}</span></button>`).join('')}</div>${backRow}`;
    $$('[data-pt]').forEach(b=>b.onclick=()=>startPt(D.PT.find(p=>p.id===b.dataset.pt),+o.min));
  }else if(mode==='gd'){
    v.innerHTML=`<section class="hero"><h1>Group Discussion</h1><p>혼자서 토론의 세 장면을 연습합니다. 첫 발언, 다른 지원자의 의견을 받아 잇기, 정리 발언. 주제는 모두 예상 주제입니다.</p></section>
    <div class="row"><button class="btn pri" type="button" id="gdRand">아무 주제로 시작</button></div>
    <div class="grid">${D.GD.map(g=>`<button class="mode" type="button" data-gd="${g.id}" style="min-height:0"><h3 style="font-size:16.5px">${esc(g.topic)}</h3><p>${esc(g.bg)}</p></button>`).join('')}</div>${backRow}`;
    $('#gdRand').onclick=()=>startGd(pick(D.GD,1)[0]);
    $$('[data-gd]').forEach(b=>b.onclick=()=>startGd(D.GD.find(g=>g.id===b.dataset.gd)));
  }else if(mode==='free'){
    const st={cat:'resume1'};
    v.innerHTML=`<section class="hero"><h1>자유 연습</h1><p>분야를 고르고 문항을 누르면 바로 시작합니다. 점수는 가장 최근 연습의 자동 점수입니다.</p></section><div id="ff"></div>
    <div class="row" style="margin-bottom:8px"><button class="btn pri" type="button" id="fRand">이 분야에서 무작위 5문항</button><button class="btn" type="button" id="fWeak">점수 낮은 문항부터</button></div><div id="fl"></div>${backRow}`;
    const draw=()=>{
      $('#ff').innerHTML=catFilter(st.cat,false);$$('#ff button').forEach(b=>b.onclick=()=>{st.cat=b.dataset.cat;draw()});
      const list=D.Q.filter(q=>q.c===st.cat);
      $('#fl').innerHTML=list.map(q=>{const l=store.get('last.'+q.id);return `<button class="fq" type="button" data-q="${q.id}"><span class="tags" style="margin-bottom:4px">${tagHtml(q)}${l?`<span class="last">${l.s}점</span>`:''}</span>${esc(q.q)}</button>`}).join('');
      $$('#fl [data-q]').forEach(b=>b.onclick=()=>{const rest=list.map(q=>q.id).filter(id=>id!==b.dataset.q);startFree([b.dataset.q,...shuffle(rest)])});
    };
    $('#fRand').onclick=()=>startFree(pick(D.Q.filter(q=>q.c===st.cat).map(q=>q.id),5));
    $('#fWeak').onclick=()=>{const done=D.Q.filter(q=>store.get('last.'+q.id)).sort((a,b)=>store.get('last.'+a.id).s-store.get('last.'+b.id).s).slice(0,5).map(q=>q.id);if(!done.length){toast('아직 연습한 문항이 없어요.');return}startFree(done)};
    draw();
  }
  bindSeg(o);const bh=$('#backHome');if(bh)bh.onclick=()=>go(renderHome);
}
const qStep=(id,extra)=>Object.assign({type:'q',q:QMAP[id],sec:QMAP[id].sec},extra||{});
function buildDeep(n,defer){
  const ids=n===7
    ?['I01','I03','R102',...pick(['R105','R107'],1),...pick(['R201','R202'],1),...pick(['P03','P04','P05','P09','P10'],1),'E01']
    :['I01','I02','I03','R102',...pick(['R101','R104','R105','R106','R107'],2),'R201',...pick(['R202','R203','R204'],1),...pick(['P03','P04','P05','P09','P10','P13'],2),'I06',...pick(['F01','F02','F04','F05','F09','F11'],1),'E01'];
  return ids.map(id=>qStep(id,{defer:!!defer}));
}
function buildAsk(o){
  const p1=['I01','I02',...pick(['F01','F02','F04','F05'],1)];
  const tech=o.mfg?[...pick(['P01','P03','P04','P05','P09','P12'],2),...pick(['M01','M02','M04'],1)]:pick(['P01','P02','P03','P04','P05','P07','P09','P10','P12','P13'],3);
  const vis=pick(o.mfg?['V3','V4']:['V1','V2','V4'],1);
  const secOf=id=>(id==='I01'||id==='I02')?60:(QMAP[id].chart?120:90);
  return [...p1.map(id=>[id,'Part 1 · 인성']),...tech.map(id=>[id,'Part 2 · 직무']),...vis.map(id=>[id,'Part 2 · 직무 (시각자료 해석)'])]
    .map(([id,label])=>qStep(id,{sec:secOf(id),prep:o.prep,auto:true,defer:true,label}));
}
function startFree(ids){startSession('free','자유 연습',ids.map(id=>qStep(id)),{})}
function startPt(pt,min){
  const steps=[{type:'ptprep',pt,sec:min*60},
    {type:'q',q:{id:pt.id+'~pres',q:'준비한 내용을 3분 안에 발표해 보세요. 권고안(결론)부터 말하고, 근거 → 검증 계획 → 리스크 순서로.',ptPres:true},sec:180,defer:true,label:'발표'},
    ...pt.f.map((f,i)=>({type:'q',q:{id:pt.id+'~f'+i,q:f[0],hint:f[1],isFollow:true},sec:60,label:`면접관의 후속 질문 ${i+1} / ${pt.f.length}`}))];
  startSession('pt','문제해결 PT',steps,{pt});
}
function startGd(g){
  const opp=pick(g.opp,2),topic=`<div class="why"><b>주제</b> ${esc(g.topic)}</div>`;
  const card=t=>topic+`<div class="opp"><small>다른 지원자의 발언</small>${esc(t)}</div>`;
  const mk=(kind,n,q,sec,context,label)=>({type:'q',q:{id:g.id+'~'+n,q,gd:kind},sec,context,label});
  startSession('gd','Group Discussion',[{type:'think',g,sec:60},
    mk('first',1,'첫 발언입니다. 본인의 입장과 근거를 1분 안에 말해 보세요.',60,topic,'첫 발언'),
    mk('bridge',2,'이 의견을 받아서 이어 말해 보세요. 인정할 점을 먼저 말하고, 본인 의견을 보완하거나 제안으로 연결합니다.',60,card(opp[0]),'받아서 잇기 ①'),
    mk('bridge',3,'한 번 더, 이 의견을 받아서 이어 말해 보세요.',60,card(opp[1]||opp[0]),'받아서 잇기 ②'),
    mk('wrap',4,'토론을 마무리하는 정리 발언을 해 보세요. 나온 의견의 공통점과 결론을 40초 안에.',45,topic,'정리 발언')],{g});
}

/* ---------- 진행 ---------- */
const S={mode:'',title:'',steps:[],i:0,res:[],opts:{},saved:false,at:0};
function startSession(mode,title,steps,opts){Object.assign(S,{mode,title,steps,i:0,res:[],opts:opts||{},saved:false,at:Date.now()});go(renderStep)}
function headHtml(){const n=S.steps.length;return `<div class="row" style="margin-top:14px"><span class="qno">${esc(S.title)} · ${Math.min(S.i+1,n)} / ${n}</span><span class="sp"></span><button class="btn ghost" type="button" id="quitBtn" style="min-height:36px;padding:6px 10px">그만하고 결과 보기</button></div><div class="progress"><i style="width:${Math.round(100*S.i/n)}%"></i></div>`}
function bindHead(){const b=$('#quitBtn');if(b)b.onclick=()=>go(renderReview)}
function next(){S.i++;go(renderStep)}
function renderStep(){
  const st=S.steps[S.i];if(!st)return renderReview();
  if(st.type==='ptprep')return renderPtPrep(st);
  if(st.type==='think')return renderThink(st);
  const q=st.q,real=QMAP[q.id];
  let ctx=st.context||'';
  if(q.ptPres){const m=store.get('pt.'+S.opts.pt.id,[]);ctx=`<details class="small" open><summary>내 준비 메모 보기</summary>${PT_FIELDS.map((f,i)=>m[i]?`<p><b>${f[0]}</b><br>${esc(m[i]).replace(/\n/g,'<br>')}</p>`:'').join('')||'<p>적어 둔 메모가 없습니다.</p>'}</details>`}
  view().innerHTML=headHtml()+`<div class="run">
    <div class="card qside">
      <div class="row">${st.label?`<span class="stage">${esc(st.label)}</span>`:''}<span class="sp"></span><span class="tags">${real?tagHtml(real):q.isFollow?'<span class="tag">꼬리질문</span>':''}</span></div>
      ${ctx}
      <div class="qtext">${esc(q.q)}</div>
      ${q.chart?chartSvg(q.chart):''}
      ${real&&!st.defer&&(real.why||[]).length?`<details class="small"><summary>면접관이 보려는 것 (막히면 열어 보기)</summary>${real.why.map(w=>`<div class="why">${esc(w)}</div>`).join('')}</details>`:''}
      <p class="small">권장 답변 시간 ${mmss(st.sec)}${st.auto?' · 시간이 끝나면 자동으로 넘어갑니다':''}</p>
    </div>
    <div>
      <div class="card" id="ansCard">
        <div id="prepBox" class="prep-box hidden"><div class="small">준비 시간 — 질문을 읽고 첫 문장을 정하세요</div><div class="big" id="prepNum"></div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" type="button" id="skipPrep">바로 답하기</button></div></div>
        <div id="ansBox">
          <div class="voice-live" id="live"></div>
          <textarea id="ans" placeholder="말로 답하기를 누르고 말하거나, 직접 입력하세요." aria-label="답변"></textarea>
          <div class="meter"><span id="cnt">0자</span><span>권장 약 ${Math.round(st.sec*5.2)}자</span></div>
          <div class="row">
            <button class="btn pri" type="button" id="micBtn">🎤 말로 답하기</button>
            <button class="btn" type="button" id="clearBtn">지우기</button><span class="sp"></span>
            <button class="btn pri" type="button" id="submitBtn">${st.defer?'다음으로':'답변 제출'}</button>
          </div>
          ${st.defer?'':`<label class="small row" style="margin-top:10px"><input type="checkbox" id="recChk"> 내 목소리를 녹음해서 다시 듣기${isMobile?' (휴대폰에서는 음성 인식과 함께 쓰면 끊길 수 있어요)':''}</label>`}
        </div>
      </div>
      <div id="fb"></div>
    </div></div>`;
  bindHead();
  const ta=$('#ans'),cnt=()=>{$('#cnt').textContent=nchar(ta.value)+'자'};
  ta.value=store.get('draft.'+q.id,'');cnt();
  ta.oninput=()=>{cnt();store.set('draft.'+q.id,ta.value)};
  V.ui=()=>{const b=$('#micBtn'),l=$('#live');if(!b)return;b.textContent=V.on?'■ 말하기 멈춤':'🎤 말로 답하기';b.classList.toggle('rec',V.on);b.classList.toggle('pri',!V.on);l.innerHTML=V.on?'<span class="dot"></span>듣고 있어요. 평소 말하는 속도로 답하세요.':''};
  $('#micBtn').onclick=()=>{V.on?voiceStop():voiceStart(ta,ta.oninput)};
  $('#clearBtn').onclick=()=>{if(!ta.value||confirm('지금까지의 답변을 지울까요?')){const was=V.on;voiceStop();ta.value='';ta.oninput();if(was)voiceStart(ta,ta.oninput)}};
  $('#submitBtn').onclick=()=>submitAnswer(false);
  const rc=$('#recChk');
  if(rc){rc.checked=store.get('rec',!isMobile)&&!!window.MediaRecorder;rc.onchange=()=>{store.set('rec',rc.checked);rc.checked?recStart():recStop()}}
  const begin=()=>{
    $('#prepBox').classList.add('hidden');$('#ansBox').classList.remove('hidden');
    timerStart({sec:st.sec,mode:st.auto?'down':'up',onEnd:st.auto?()=>submitAnswer(true):null});
    if(S.opts.voiceAuto)voiceStart(ta,ta.oninput);
    if(rc&&rc.checked)recStart();
    if(!isMobile&&!S.opts.voiceAuto)ta.focus({preventScroll:true});
  };
  if(st.prep){
    $('#prepBox').classList.remove('hidden');$('#ansBox').classList.add('hidden');
    timerStart({sec:st.prep,mode:'down',prep:true,onTick:l=>{const e=$('#prepNum');if(e)e.textContent=l},onEnd:begin});
    $('#skipPrep').onclick=()=>{timerStop();begin()};
  }else begin();
}
function submitAnswer(auto){
  const st=S.steps[S.i],q=st.q,ta=$('#ans');if(!ta)return;
  const text=ta.value.trim();
  if(!auto&&!text&&!st.defer){toast('답변을 말하거나 적어 주세요.');return}
  const used=timerElapsed();voiceStop();recStop();timerStop();
  let sc=null;if(q.gd)sc=scoreGd(q.gd,text);else if(q.k&&q.k.length)sc=scoreAnswer(q,text,st.sec);
  const r={id:q.id,q:q.q,text,used,sec:st.sec,sc,gd:q.gd||null,follow:!!q.isFollow,hint:q.hint||'',parent:q.parent||null};
  S.res.push(r);store.del('draft.'+q.id);
  if(sc&&!q.gd&&QMAP[q.id])store.set('last.'+q.id,{s:sc.total,at:Date.now()});
  if(st.defer)return next();
  renderFeedback(r,st);
}
function fbHtml(r,full){
  const q=QMAP[r.id];let h='';
  if(r.sc&&!r.gd){
    const s=r.sc;
    h+=`<div class="score"><div class="num">${s.total}<small> / 100</small></div><div class="bars">${[['핵심 내용',s.core,55],['구조',s.struct,20],['분량',s.lenS,15],['표현',s.expr,10]].map(([l,v,m])=>`<div class="bar"><span>${l}</span><b><i style="width:${Math.round(100*v/m)}%"></i></b><span>${v}/${m}</span></div>`).join('')}</div></div>
    <div class="kws">${q.k.map((k,i)=>`<span class="kwchip ${s.hits[i]?'hit':'miss'}">${s.hits[i]?'✓':'–'} ${esc(k[0])}</span>`).join('')}</div>
    <div class="small">말한 분량 ${s.len}자 (권장 약 ${s.target}자) · 사용 시간 ${mmss(r.used)} / ${mmss(r.sec)}</div>`;
    const miss=s.st.filter(x=>!x[1]);
    if(miss.length)h+=`<div class="small">구조에서 빠진 것: ${miss.map(x=>esc(x[0])).join(' / ')}</div>`;
    if(s.warns.length)h+=`<ul class="clean warns">${s.warns.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`;
  }else if(r.gd){
    h+=`<div class="kws">${r.sc.ch.map(c=>`<span class="kwchip ${c[1]?'hit':'miss'}">${c[1]?'✓':'–'} ${esc(c[0])}</span>`).join('')}</div><div class="small">분량 ${r.sc.len}자 · 사용 시간 ${mmss(r.used)} / ${mmss(r.sec)}</div>`;
  }else h+=`<div class="small">분량 ${nchar(r.text)}자 · 사용 시간 ${mmss(r.used)} / ${mmss(r.sec)}</div>`;
  if(r.hint)h+=`<div class="h4">답변 방향</div><div class="model"><p>${esc(r.hint)}</p></div>`;
  if(q&&full){
    if((q.p||[]).length)h+=`<div class="h4">답변 포인트</div><ul class="clean">${q.p.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`;
    h+=`<div class="h4">예시 답변</div><div class="model">${fmt(q.m)}</div>`;
    if(q.tip)h+=`<div class="tip"><b>주의</b> ${esc(q.tip)}</div>`;
    h+=srcHtml(q.s);
  }
  return h;
}
function renderFeedback(r,st){
  const q=st.q,real=QMAP[q.id],parent=real||QMAP[q.parent];
  $('#ansCard').innerHTML=`<div class="h4" style="margin-top:0">내 답변</div><p style="white-space:pre-wrap">${esc(r.text)||'<span class="small">(답변 없음)</span>'}</p><audio id="player" controls class="hidden" style="width:100%;margin-top:6px"></audio>`;
  if(R.url&&!R.on){const p=$('#player');p.src=R.url;p.classList.remove('hidden')}
  S.usedF=S.usedF&&S.usedFor===(parent&&parent.id)?S.usedF:new Set();S.usedFor=parent&&parent.id;
  const fs=parent&&S.mode!=='pt'?(parent.f||[]):[];
  const last=S.i>=S.steps.length-1;
  $('#fb').innerHTML=`<div class="card fb">${fbHtml(r,true)}
    ${fs.length?`<div class="h4">꼬리질문 이어서 받기</div>${fs.map((f,i)=>`<button class="fq ${S.usedF.has(i)?'done':''}" type="button" data-f="${i}">${esc(f[0])}${S.usedF.has(i)?'<small>답변 완료</small>':''}</button>`).join('')}`:''}
    <div class="row" style="margin-top:14px"><button class="btn" type="button" id="retryBtn">다시 답하기</button><span class="sp"></span><button class="btn pri" type="button" id="nextBtn">${last?'결과 보기':'다음 질문 →'}</button></div></div>`;
  $$('#fb [data-f]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.f,f=fs[i];S.usedF.add(i);
    S.steps.splice(S.i+1,0,{type:'q',q:{id:parent.id+'~f'+i,q:f[0],hint:f[1],isFollow:true,parent:parent.id},sec:60,label:'꼬리질문'});next();
  });
  $('#retryBtn').onclick=()=>{S.res.pop();go(renderStep)};
  $('#nextBtn').onclick=next;
  $('#fb').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- 문제해결 PT: 준비 ---------- */
const PT_FIELDS=[['① 문제 정의','이 과제를 한 문장으로. 무엇을 언제까지 판단해야 하는가'],['② 원인 가설과 우선순위','가설마다 근거가 되는 자료를 함께'],['③ 검증 계획','가설이 맞다면 무엇이 보여야 하는가, 어떤 실험·분석으로 확인할 것인가'],['④ 권고안과 일정','결론부터. 주차별로 무엇을 할지'],['⑤ 전제와 리스크','내 판단이 틀릴 수 있는 지점, 남는 위험']];
function ptBrief(pt){return `<div class="stage">${esc(pt.job)} · 예상 시나리오</div><div class="qtext" style="font-size:19px">${esc(pt.title)}</div><p>${esc(pt.brief)}</p>
  <div class="kv">${pt.data.map(d=>`<div>${esc(d[0])}</div><div>${esc(d[1])}</div>`).join('')}</div><p class="small">표의 수치는 연습용 가상 값입니다.</p>
  <div class="h4">요구 사항</div><ul class="clean">${pt.ask.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`}
function renderPtPrep(st){
  const pt=st.pt,memo=store.get('pt.'+pt.id,[]);
  view().innerHTML=headHtml()+`<div class="run"><div class="card qside">${ptBrief(pt)}</div><div>
    <div class="card"><div class="h4" style="margin-top:0">답안 정리 — 준비 시간 ${Math.round(st.sec/60)}분</div>
    ${PT_FIELDS.map((f,i)=>`<label for="pf${i}" style="font-weight:700;display:block;margin-top:10px">${f[0]}</label><textarea class="sm" id="pf${i}" placeholder="${esc(f[1])}">${esc(memo[i]||'')}</textarea>`).join('')}
    <div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn pri" type="button" id="toPres">발표하러 가기 →</button></div></div>
    <details class="card" style="margin-top:12px" open><summary>AI(LLM)는 이렇게 쓰세요</summary><div class="body"><ul class="clean">
      <li>실제 면접에서는 면접장 PC의 전용 LLM을 씁니다. <b>이 페이지에는 AI가 들어 있지 않으니</b>, 연습할 때는 평소 쓰는 AI 도구를 옆 창에 띄워 두세요.</li>
      <li>처음 5분은 AI 없이 ①과 ②를 직접 적습니다. 문제 정의는 본인이 해야 합니다.</li>
      <li>AI에게는 답을 묻지 말고 <b>"내가 놓친 원인"과 "내 논리의 약점"</b>을 물으세요.</li>
      <li>AI의 답은 주어진 자료와 맞는 것, 본인이 설명할 수 있는 것만 남깁니다. 버린 것과 이유를 기억해 두면 후속 질문에 쓸 수 있습니다.</li>
      <li>실제 제출 형식은 공개되지 않았습니다. 어떤 형식이든 결론 → 근거 → 검증 → 리스크 순서면 됩니다.</li></ul>${srcHtml(['half1','press'])}</div></details>
  </div></div>`;
  bindHead();
  $$('textarea',view()).forEach((ta,i)=>ta.oninput=()=>{const m=store.get('pt.'+pt.id,[]);m[i]=ta.value;store.set('pt.'+pt.id,m)});
  timerStart({sec:st.sec,mode:'down',onEnd:()=>toast('준비 시간이 끝났어요. 정리되는 대로 발표로 넘어가세요.',6000)});
  $('#toPres').onclick=next;
}
/* ---------- 토론: 생각 정리 ---------- */
function renderThink(st){
  const g=st.g;
  view().innerHTML=headHtml()+`<div class="run"><div class="card qside"><div class="stage">생각 정리 1분</div><div class="qtext">${esc(g.topic)}</div><p>${esc(g.bg)}</p>
    <textarea class="sm" id="gNote" placeholder="내 입장 한 줄, 근거 두 가지를 메모해 보세요. (선택)"></textarea>
    <div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn pri" type="button" id="gGo">첫 발언 시작 →</button></div></div>
    <div><details class="card" open><summary>토론에서 보는 것과 쓸 수 있는 말</summary><div class="body"><ul class="clean">
      <li>공고 설명 기준으로, 정답을 맞히는지가 아니라 <b>다른 의견을 받아들이는 태도와 논의에 기여하는 역할</b>을 봅니다.</li>
      <li>받아 주기: "방금 말씀하신 ○○에 동의합니다. 거기에 하나 더하면…"</li>
      <li>잇기: "두 분 의견의 공통점은 ○○인 것 같습니다."</li>
      <li>질문하기: "혹시 ○○한 경우에는 어떻게 보시나요?"</li>
      <li>정리하기: "지금까지 나온 의견을 정리해 보면…"</li>
      <li>피할 것: 말 끊기, 같은 주장 반복, 혼자 길게 말하기, 이기려고 하기</li></ul>${srcHtml(['half1','press'])}</div></details></div></div>`;
  bindHead();
  timerStart({sec:st.sec,mode:'down',prep:true,onEnd:()=>toast('1분이 지났어요. 첫 발언으로 넘어가세요.')});
  $('#gGo').onclick=next;
}

/* ---------- 결과(복기) ---------- */
function saveHist(){
  if(S.saved||!S.res.length)return;S.saved=true;
  const scored=S.res.filter(r=>r.sc&&!r.gd&&r.sc.total!=null);
  const sess={at:S.at,mode:S.mode,title:S.title+(S.opts.pt?' · '+S.opts.pt.title:S.opts.g?' · '+S.opts.g.topic:''),avg:scored.length?Math.round(scored.reduce((a,r)=>a+r.sc.total,0)/scored.length):null,
    items:S.res.map(r=>({q:r.q,text:r.text,used:r.used,sec:r.sec,score:r.sc&&!r.gd?r.sc.total:null,follow:r.follow}))};
  if(S.opts.pt){const m=store.get('pt.'+S.opts.pt.id,[]);sess.pt=PT_FIELDS.map((f,i)=>f[0]+' '+(m[i]||'(비어 있음)')).join('\n')}
  const h=store.get('hist',[]);h.unshift(sess);store.set('hist',h.slice(0,20));S.sess=sess;
}
function renderReview(){
  leaveRun();saveHist();
  const scored=S.res.filter(r=>r.sc&&!r.gd),avg=scored.length?Math.round(scored.reduce((a,r)=>a+r.sc.total,0)/scored.length):null;
  const pt=S.opts.pt,g=S.opts.g;
  let extra='';
  if(pt)extra=`<div class="card" style="margin:12px 0"><div class="h4" style="margin-top:0">예시 접근 — ${esc(pt.title)}</div><div class="model">${fmt(pt.m)}</div>${srcHtml(pt.s)}
    <div class="h4">자기 점검</div><div class="chk">${['문제를 한 문장으로 정의하고 시작했다','원인 가설에 우선순위와 그 근거를 붙였다','가설마다 무엇으로 확인할지 말했다','반박에는 근거로 답했고, 모르는 것은 모른다고 했다','내 경험을 한 번 이상 연결했다','AI가 준 내용 중 버린 것과 그 이유를 설명할 수 있다'].map(c=>`<label><input type="checkbox">${c}</label>`).join('')}</div>
    <p class="small">공식 평가 기준이 아니라, 채용 설명 내용과 모의면접 평가 항목을 참고해 만든 점검표입니다.</p></div>`;
  if(g)extra=`<div class="card" style="margin:12px 0"><div class="h4" style="margin-top:0">${esc(g.topic)}</div><div class="two"><div><b>한쪽 입장</b><ul class="clean">${g.pro.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><b>다른 입장</b><ul class="clean">${g.con.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
    <div class="h4">예시 발언</div><div class="model">${fmt(g.m)}</div><p class="small">어느 입장을 골랐는지는 중요하지 않습니다. 상대의 말을 받아서 본인 의견을 고치는 장면이 있었는지 확인하세요.</p></div>`;
  view().innerHTML=`<section class="hero"><h1>${esc(S.title)} 결과</h1><p>${S.res.length?`답변 ${S.res.length}개${avg!=null?` · 자동 점수 평균 <b>${avg}점</b> (참고용)`:''}. 아래에서 문항별로 내 답변과 예시 답변을 비교해 보세요.`:'제출한 답변이 없습니다.'}</p></section>
  ${S.res.length?`<div class="row"><button class="btn pri" type="button" id="expCopy">답안 내보내기 (복사)</button><button class="btn" type="button" id="expShare">공유</button></div>`:''}
  ${extra}
  ${S.res.map((r,i)=>`<details class="qitem" ${i===0?'open':''}><summary><span class="qq">${r.follow?'↳ ':''}${esc(r.q)}</span>${r.sc?`<span class="last">${r.sc.total}점</span>`:''}</summary><div class="in"><div class="h4">내 답변</div><p style="white-space:pre-wrap">${esc(r.text)||'<span class="small">(답변 없음)</span>'}</p>${fbHtml(r,true)}</div></details>`).join('')}
  <div class="row" style="margin-top:16px"><button class="btn" type="button" id="againBtn">같은 모드 다시</button><button class="btn" type="button" id="homeBtn2">처음으로</button></div>`;
  const ec=$('#expCopy');if(ec){ec.onclick=()=>copyText(exportText(S.sess));$('#expShare').onclick=()=>shareText(exportText(S.sess))}
  $('#againBtn').onclick=()=>go(renderSetup,S.mode==='free'?'free':S.mode);
  $('#homeBtn2').onclick=()=>go(renderHome);
}

/* ---------- 시작 ---------- */
(function init(){
  const root=document.documentElement,saved=store.get('theme',null);
  root.dataset.theme=saved||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
  $('#themeBtn').onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';store.set('theme',root.dataset.theme)};
  $('#dday').textContent=ddayText();
  $('#homeBtn').onclick=()=>{if(S.res.length&&!S.saved)saveHist();go(renderHome)};
  window.addEventListener('pagehide',()=>{if(S.res.length&&!S.saved)saveHist()});
  renderHome();
})();

</script>
</body>
</html>
