<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Half-Day 면접 연습실</title>
<style>
:root{
  --bg:#f5f3ee;--card:#fff;--ink:#1b2130;--sub:#5d6577;--line:#e2ddd2;--soft:#eeebe3;
  --acc:#2b56c9;--acc-ink:#fff;--acc-soft:#e6ecfb;--kw:#d42a1c;--ok:#1a7f4b;--warn:#b25a00;
  --fill-bg:#fff1a8;--fill-ink:#5b4300;--shadow:0 1px 2px rgba(20,25,40,.06),0 6px 20px rgba(20,25,40,.06);
  --r:14px;
}
:root[data-theme="dark"]{
  --bg:#11141b;--card:#1a1f2b;--ink:#e9ebf1;--sub:#a0a8ba;--line:#2b3242;--soft:#222837;
  --acc:#7ea2ff;--acc-ink:#0d1320;--acc-soft:#22304f;--kw:#ff7466;--ok:#5fd39a;--warn:#ffb65c;
  --fill-bg:#4f4200;--fill-ink:#ffe88a;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 96px}
.hidden{display:none!important}
h1,h2,h3{line-height:1.3;margin:0}
p{margin:.5em 0}
a{color:var(--acc)}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:17px;background:none;border:0;padding:0;text-align:left}
.brand small{display:block;font-weight:500;color:var(--sub);font-size:12px;letter-spacing:0}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:13px;white-space:nowrap}
.chip.dday{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.chip.timer{font-variant-numeric:tabular-nums;font-weight:700;min-width:74px;justify-content:center}
.chip.timer.over{background:var(--kw);border-color:var(--kw);color:#fff}
.chip.timer.prep{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;width:36px;height:36px;font-size:16px;line-height:1}

/* cards / home */
.hero{padding:26px 0 8px}
.hero h1{font-size:clamp(26px,5vw,38px);letter-spacing:-.03em}
.hero p{color:var(--sub);max-width:46em}
.notice{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card));border-radius:var(--r);padding:12px 14px;margin:12px 0;font-size:14.5px}
.notice b{color:var(--warn)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin:14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-height:150px;transition:transform .12s,border-color .12s}
.mode:hover,.mode:focus-visible{transform:translateY(-2px);border-color:var(--acc);outline:none}
.mode .no{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.06em}
.mode h3{font-size:18px}
.mode p{margin:0;color:var(--sub);font-size:14px;flex:1}
.mode .meta{font-size:12.5px;color:var(--sub);border-top:1px dashed var(--line);padding-top:8px}
.sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.08em;margin:26px 0 8px}
details.card{padding:0}
details.card>summary{list-style:none;padding:14px 16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋";margin-left:auto;color:var(--sub);font-weight:400}
details.card[open]>summary::after{content:"－"}
details.card>.body{padding:0 16px 16px;border-top:1px solid var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:14.5px;margin:10px 0}
table.t th,table.t td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t th{width:30%;color:var(--sub);font-weight:600}
.small{font-size:13.5px;color:var(--sub)}
ul.clean{margin:.4em 0;padding-left:1.15em}
ul.clean li{margin:.25em 0}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent}
.btn.rec{background:var(--kw);border-color:var(--kw);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:8px 12px;font-size:14px;min-height:40px}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:6px;padding:2px 7px;background:var(--soft);color:var(--sub);font-weight:600;white-space:nowrap}
.tag.t-기출{background:#fde7e4;color:#b3261a}.tag.t-단골{background:#fdeed5;color:#96560a}.tag.t-지원서{background:var(--acc-soft);color:var(--acc)}.tag.t-예상{background:var(--soft)}
:root[data-theme="dark"] .tag.t-기출{background:#4a1f1b;color:#ffb0a8}:root[data-theme="dark"] .tag.t-단골{background:#47330f;color:#ffd18a}
.filter{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px}
.filter button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}

/* run */
.run{display:grid;gap:14px;grid-template-columns:1fr;margin-top:14px}
@media(min-width:920px){.run{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}.run .qside{position:sticky;top:70px}}
.progress{height:4px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.qno{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.04em}
.qtext{font-size:clamp(19px,3.4vw,23px);font-weight:700;letter-spacing:-.01em;margin:8px 0 10px;line-height:1.45}
.why{font-size:14px;color:var(--sub);border-left:3px solid var(--line);padding-left:10px;margin:8px 0}
.stage{font-size:13px;font-weight:700;color:var(--acc)}
textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;min-height:180px;resize:vertical;line-height:1.7}
textarea:focus,input:focus{outline:2px solid var(--acc);outline-offset:1px}
textarea.sm{min-height:84px}
.meter{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin:4px 2px 8px}
.voice-live{font-size:13px;color:var(--kw);font-weight:700;min-height:1.4em}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--kw);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}.mode{transition:none}}
.prep-box{text-align:center;padding:26px 12px}
.prep-box .big{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

/* feedback */
.fb{margin-top:14px}
.score{display:flex;align-items:center;gap:14px}
.score .num{font-size:42px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.score .num small{font-size:15px;color:var(--sub);font-weight:600}
.bars{flex:1;display:grid;gap:5px}
.bar{display:grid;grid-template-columns:5.2em 1fr 3.2em;gap:8px;align-items:center;font-size:12.5px;color:var(--sub)}
.bar b{display:block;height:7px;border-radius:7px;background:var(--soft);overflow:hidden}
.bar b i{display:block;height:100%;background:var(--acc)}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.kwchip{font-size:13px;border-radius:999px;padding:3px 10px;border:1px solid var(--line)}
.kwchip.hit{border-color:var(--ok);color:var(--ok);font-weight:700}
.kwchip.miss{border-style:dashed;color:var(--sub)}
.model{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--acc-soft) 35%,var(--card));margin-top:8px}
.model p{margin:.55em 0}
b.kw{color:var(--kw);font-weight:800}
mark.fill{background:var(--fill-bg);color:var(--fill-ink);border-radius:4px;padding:0 3px;font-weight:600}
.h4{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--sub);margin:16px 0 6px}
.fq{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:15px}
.fq small{display:block;color:var(--sub);font-weight:400;margin-top:4px}
.fq.done{opacity:.6}
.tip{font-size:14px;border:1px dashed var(--warn);border-radius:10px;padding:8px 12px;margin-top:10px;color:var(--ink)}
.tip b{color:var(--warn)}
.srcs{font-size:12.5px;color:var(--sub);margin-top:10px}
.srcs a{color:var(--sub)}
.warns li{color:var(--warn)}

/* book */
.qitem{border:1px solid var(--line);background:var(--card);border-radius:12px;margin:8px 0}
.qitem>summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.qitem>summary::-webkit-details-marker{display:none}
.qitem>summary .qq{flex:1;font-weight:600}
.qitem .in{padding:2px 14px 14px;border-top:1px solid var(--line)}
.last{font-size:12px;color:var(--ok);font-weight:700;white-space:nowrap}
input.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px}

/* pt / gd */
.kv{display:grid;grid-template-columns:minmax(8em,40%) 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14.5px;margin:10px 0}
.kv div{padding:7px 10px;border-bottom:1px solid var(--line)}
.kv div:nth-child(odd){background:var(--soft);font-weight:600}
.kv div:nth-last-child(-n+2){border-bottom:0}
.opp{border-left:4px solid var(--kw);background:var(--card);border-radius:0 10px 10px 0;padding:10px 12px;margin:10px 0;font-size:15.5px}
.opp small{display:block;color:var(--sub);font-weight:700;margin-bottom:2px}
.two{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:700px){.two{grid-template-columns:1fr 1fr}}
.chk label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:15px}
.chk input{width:20px;height:20px;margin-top:3px;flex:none}
svg.chart{width:100%;height:auto;max-width:520px;display:block;margin:8px auto;color:var(--ink)}
.foot{margin-top:36px;color:var(--sub);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-size:14px;z-index:50;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bottom-bar .row{max-width:1080px;margin:0 auto}
.bottom-bar .btn{flex:1}

</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button class="brand" id="homeBtn" type="button">Half-Day 면접 연습실<small>SK하이닉스 · PKG개발 / 양산기술</small></button>
  <span class="sp"></span>
  <span class="chip timer hidden" id="timer" aria-live="off">00:00</span>
  <span class="chip dday" id="dday"></span>
  <button class="icon-btn" id="themeBtn" type="button" aria-label="밝은 화면과 어두운 화면 바꾸기">◐</button>
</div></header>
<main class="wrap" id="view"></main>
<div class="toast hidden" id="toast" role="status"></div>
<noscript><p style="padding:20px">이 페이지는 자바스크립트가 켜져 있어야 동작합니다.</p></noscript>

<script>
const D = {"Q": [{"id": "I01", "c": "intro", "t": "기출", "sec": 60, "q": "1분 자기소개를 해 주세요.", "why": ["첫 60초에 \"무슨 일을 한 사람이고, 왜 이 직무에 맞는지\"를 한 줄로 듣고 싶어 합니다.", "여기서 말한 단어가 다음 질문이 됩니다. 꼬리질문을 받고 싶은 단어만 넣으세요."], "p": ["한 줄 정의로 시작 (소재-공정 메커니즘으로 문제를 푸는 공정 개발 엔지니어)", "전공 + 현 직장에서 맡은 공정", "대표 경험 1개를 한 문장으로", "패키지 몰딩과의 연결 → 지원 이유"], "m": "안녕하십니까. **소재와 공정의 상호작용**에서 원인을 찾아 문제를 푸는 공정 개발 엔지니어, 지원자 OOO입니다.\n\n저는 화학을 전공하고 화학공학·고분자공학을 복수전공한 뒤, 현 직장에서 [직접 채울 것: 면접일 기준 재직 기간] 동안 차세대 배터리의 **가압·압연 공정 개발**을 담당했습니다. 같은 가압 조건에서도 소재에 따라 치수 불량이 달라지는 문제를 **입자 유동, 계면 접착력, 탄성 복원** 관점에서 분석해 가압 프로파일 가이드라인을 만들었고, 그 과정에서 생긴 정렬 불량도 제어 로직을 조정해 함께 해결했습니다.\n\n패키지 몰딩 역시 필러가 든 수지를 가압·가열하면서 **Void와 Warpage**를 제어해야 하는 공정이라고 이해하고 있습니다. 제가 익힌 **메커니즘 기반 문제 해결 방식**으로 PKG 공정 개발에 기여하고 싶어 지원했습니다.", "k": [["한 줄 정의", "메커니즘|상호작용|엔지니어"], ["전공", "화학|고분자|화공"], ["담당 공정", "가압|압연|롤프레스|공정 개발|배터리"], ["직무 연결", "패키지|PKG|몰딩|EMC|보이드|void|휨|warpage"], ["지원 의지", "기여|지원했|하겠습니다"]], "f": [["방금 말한 '메커니즘 기반'이 구체적으로 무엇입니까? 사례 하나로 설명해 보세요.", "연신율 오차 사례를 현상 → 가설 3개 → 검증 → 조치 순서로 60초 안에."], ["화학 전공인데 공정 개발을 하게 된 계기는 무엇입니까?", "사실대로. 전공 지식이 공정 문제에 쓰인 순간 하나를 붙이면 좋습니다."], ["2년 넘게 다닌 회사를 두고 왜 신입으로 지원했습니까?", "'도메인이 바뀌기 때문'으로 시작. 아래 문항에서 따로 연습하세요."]], "tip": "'완벽히', '100%', '강력한 무기' 같은 표현은 자기소개에서 빼세요. 근거를 묻는 꼬리질문이 바로 옵니다.", "s": ["app", "comm"]}, {"id": "I02", "c": "intro", "t": "기출", "sec": 90, "q": "SK하이닉스, 그중에서도 PKG개발 직무에 지원한 이유는 무엇입니까?", "why": ["회사 선택 이유와 직무 선택 이유를 둘 다 듣고 싶어 합니다. 한쪽만 말하면 반쪽 답입니다.", "\"닮았다\"는 주장에는 반드시 \"다르지 않느냐\"는 반박이 옵니다."], "p": ["이유를 2~3개로 번호 매겨 말하기", "산업 관점: 패키징이 성능·수율을 가르는 시대", "경험 관점: 필러 든 복합 소재의 가압 문제", "역할 관점: 통합 엔지니어"], "m": "세 가지 이유입니다.\n\n첫째, AI 메모리에서 **성능과 수율을 가르는 지점이 패키징**으로 옮겨 오고 있다고 봤습니다. HBM은 칩을 수직으로 쌓기 때문에 적층, 갭 충진, 방열 같은 후공정 기술이 제품 경쟁력을 좌우하고, SK하이닉스는 **MR-MUF**로 이 분야를 이끌어 왔습니다.\n\n둘째, 제 경험과 문제의 구조가 닮았습니다. 저는 필러 입자가 든 복합 소재를 가압하면서 **입자 유동, 계면 접착, 잔류 응력**을 다뤘는데, 몰딩에서 다루는 Void, Warpage, 계면 박리도 같은 물리에서 나온다고 이해하고 있습니다.\n\n셋째, 뉴스룸에서 PKG개발 엔지니어를 여러 부서를 잇는 **'통합 엔지니어'**라고 소개한 점에 끌렸습니다. 저도 앞뒤 공정의 트레이드오프를 조율하며 일해 왔기 때문에, 이 역할에서 가장 빨리 기여할 수 있다고 생각합니다.", "k": [["패키징 중요성", "패키징|후공정|HBM|적층"], ["회사 강점", "MR-MUF|엠알|리더|선도|이끌"], ["경험 연결", "필러|입자|계면|응력|가압"], ["직무 이해", "통합|협업|조율|트레이드오프"], ["기여", "기여|하겠습니다|생각합니다"]], "f": [["삼성전자나 마이크론도 패키징을 합니다. 왜 SK하이닉스입니까?", "타사 비하 금지. MR-MUF를 일찍 양산에 적용해 고도화한 점, 구성원 인터뷰에서 본 협업 방식처럼 '확인한 사실'로 답하세요."], ["배터리 압연과 반도체 몰딩은 결국 다른 공정입니다. 닮았다는 근거가 약하지 않습니까?", "차이를 먼저 인정(선 접촉·연속 vs 면 가압·열경화) → 그래도 가져올 수 있는 것(분석 방식)."], ["PKG개발 안에서 구체적으로 어떤 업무를 하고 싶습니까?", "지원서의 관심 세부 직무는 'PKG 후공정 개발'. 몰딩·갭 충진 쪽 공정 개발이라고 구체적으로."]], "s": ["jobrep2", "app"]}, {"id": "I03", "c": "intro", "t": "기출", "sec": 90, "q": "2년 넘게 재직 중인데, 왜 경력이 아니라 신입으로 지원했습니까?", "why": ["과거 후기에도 경력 보유 신입 지원자에게 이직 이유를 묻는 질문이 있었습니다. 불만 때문에 나오는 사람인지, 금방 또 나갈 사람인지를 봅니다."], "p": ["첫 문장: 도메인이 바뀌기 때문", "신입의 자세 + 그래도 가져오는 것 2~3개", "처우가 아니라 장기 성장 기준으로 결정했다는 점"], "m": "**도메인이 바뀌기 때문**입니다. 제 경력은 배터리 공정 개발이고, 반도체 패키징은 설비와 소재, 평가 기준을 처음부터 배워야 하는 분야입니다. 그래서 경력을 인정받는 것보다 **신입의 자세로 기본부터 정확히 배우는 것**이 맞다고 판단했습니다.\n\n다만 빈손으로 오는 것은 아닙니다. 문제를 현상이 아니라 **메커니즘으로 정의하는 습관**, 파일럿 라인에서 **수율과 신뢰성을 함께 본 경험**, 앞뒤 공정과 조율하던 방식은 그대로 가져올 수 있습니다.\n\n처우나 직급보다 **10년 뒤 어떤 엔지니어가 되어 있을지**를 기준으로 결정했고, 그 답이 패키징이었습니다.", "k": [["도메인 전환", "도메인|분야|바뀌|다른 분야"], ["신입 자세", "신입|기본|배우"], ["가져올 것", "메커니즘|수율|신뢰성|조율|습관"], ["장기 관점", "10년|장기|성장|엔지니어"]], "f": [["신입 처우와 직급으로 다시 시작해도 정말 괜찮습니까?", "한 문장으로 \"네\" → 이유(분야 선택이 우선). 길게 변명하지 않기."], ["우리 회사에서도 2~3년 뒤에 또 옮기는 것 아닙니까?", "이번 이동은 '회사 불만'이 아니라 '분야 선택'. 패키징에서 이루고 싶은 5년·10년 목표로 마무리."], ["합격하면 언제 입사할 수 있습니까?", "[직접 채울 것: 입사 가능 시기]를 사실대로. 인수인계를 책임 있게 마치겠다는 말을 붙이세요."]], "tip": "현 직장에 대한 불만은 한 마디도 넣지 마세요.", "s": ["comm", "app"]}, {"id": "I04", "c": "intro", "t": "기출", "sec": 60, "q": "현 직장도 좋은 회사인데 왜 떠나려고 합니까?", "why": ["실제 후기에 \"지금 회사도 좋은 회사인데 왜 옮기려 하느냐\"는 질문이 있었습니다. 현 직장을 어떻게 말하는지가 곧 미래의 우리 회사를 어떻게 말할지입니다."], "p": ["현 직장에서 얻은 것 먼저 (감사)", "떠나는 이유는 '밀려서'가 아니라 '끌려서'", "왜 지금인지"], "m": "현 직장에 불만이 있어서가 아닙니다. 차세대 공정을 설계하고 파일럿 라인에서 검증해 볼 기회를 얻었고, 많이 배웠습니다.\n\n다만 일을 하면서 제가 가장 몰입한 순간이 **가압 공정에서 소재가 왜 그렇게 변형되는지 파고들 때**였습니다. 이 강점이 가장 크게 쓰일 곳을 찾다 보니 **반도체 패키징**이었습니다.\n\n지금은 AI 메모리 수요로 패키징 기술이 빠르게 바뀌는 시기입니다. **기술 변화의 중심에서 엔지니어로 성장하고 싶다**는 생각으로 지원했습니다.", "k": [["현 직장 존중", "배웠|기회|불만이 있어서가|감사"], ["끌린 이유", "몰입|강점|파고|변형"], ["방향", "패키징|반도체"], ["시기", "AI|변화|성장"]], "f": [["현 직장에서 반도체 관련 부서로 옮기는 방법은 없었습니까?", "사실대로. 없었다면 \"제가 하고 싶은 패키지 공정 개발 직무가 없다\"는 정도로 짧게."], ["현 직장 동료들은 본인의 이직을 어떻게 볼 것 같습니까?", "마지막까지 맡은 일을 마무리하겠다는 책임감으로 답하기."]], "tip": "회사 이름과 내부 사정은 말하지 않아도 됩니다. '현 직장'이라고만 해도 충분합니다.", "s": ["comm"]}, {"id": "I05", "c": "intro", "t": "예상", "sec": 90, "q": "배터리에서 반도체로 분야를 바꾸는데, 부족한 지식을 채우기 위해 무엇을 했습니까?", "why": ["공고의 '변화 적응력'을 확인하는 질문입니다. \"열심히 공부했다\"가 아니라 무엇을, 어떻게, 어디까지 했는지를 듣고 싶어 합니다."], "p": ["푸는 문제의 종류는 같다는 한 줄", "실제로 한 공부 2~3개 (자료 이름까지)", "아직 모르는 것을 스스로 말하기"], "m": "분야는 바뀌지만 **제가 푸는 문제의 종류는 같다**고 생각합니다. 필러가 든 복합 소재에 열과 압력을 가할 때 생기는 유동, 접착, 응력 문제입니다.\n\n부족한 반도체 지식은 이렇게 채우고 있습니다. 학부 때 **반도체화학공정** 과목으로 전공정의 기본을 배웠고, 지원을 준비하면서 [직접 채울 것: 실제로 공부한 자료 — 예: SK하이닉스 뉴스룸 후공정 칼럼 시리즈, 읽은 책·강의 이름]으로 **패키지 공정 순서와 EMC, MUF, TSV**를 정리했습니다. 또 [직접 채울 것: 실제로 했다면 — 제 경험과 몰딩 공정의 같은 점·다른 점을 표로 정리한 일 등].\n\n아직 **패키지 설비와 양산 데이터를 직접 다뤄 보지 못한 것**이 한계입니다. 입사 후에는 [직접 채울 것: 가장 먼저 배우고 싶은 것]부터 빠르게 익히겠습니다.", "k": [["문제 유형", "같은 문제|종류|유동|접착|응력"], ["학습 근거", "반도체화학공정|뉴스룸|칼럼|책|강의|정리"], ["패키지 지식", "EMC|MUF|TSV|패키지 공정"], ["한계 인정", "한계|부족|아직|다뤄 보지"], ["계획", "입사 후|익히|배우"]], "f": [["공부한 것 중 가장 이해하기 어려웠던 개념은 무엇이고 어떻게 이해했습니까?", "실제로 막혔던 개념 하나(예: MR-MUF와 TC-NCF 차이)를 사실대로."], ["그 정도 공부는 누구나 합니다. 다른 지원자와의 차이는 무엇입니까?", "책으로만 배운 사람과 달리 가압 공정의 불량을 직접 풀어 본 경험."]], "tip": "하지 않은 공부를 했다고 말하면 다음 질문에서 바로 드러납니다. 실제로 한 것만 넣으세요.", "s": ["app", "half1"]}, {"id": "I06", "c": "intro", "t": "예상", "sec": 90, "q": "1지망 PKG개발과 2지망 양산기술의 차이를 설명하고, 2지망으로 배치되면 어떻게 하겠습니까?", "why": ["2지망을 '보험'으로 썼는지, 직무를 이해하고 썼는지 봅니다. \"어디든 괜찮다\"는 답은 약합니다."], "p": ["두 직무의 차이를 한 문장으로", "2지망에서도 쓸 수 있는 본인 경험", "어디서든 같은 '일하는 방식'"], "m": "제가 이해한 차이는 **'새 공정을 만드는 일'과 '만든 공정을 안정적으로 키우는 일'**입니다. PKG개발은 새로운 구조와 소재에 맞는 공정을 설계하고 검증해 양산으로 넘기는 역할이고, 양산기술은 양산 라인에서 **수율, 품질, 효율**을 높이는 공정·장비 솔루션을 만드는 역할이라고 알고 있습니다.\n\n2지망으로 배치되더라도 잘할 수 있다고 생각합니다. 저는 개발 직무였지만 **파일럿 라인에서 초기 수율을 올리고 공정 변수를 최적화**하는 일을 했고, 뉴스룸에서 양산기술의 핵심 역량으로 꼽은 **데이터 분석과 소통**은 지금도 매일 쓰는 역량입니다.\n\n어느 쪽이든 '원인을 메커니즘으로 규명해 조건을 잡는다'는 제 일하는 방식은 같습니다. 배치된 자리에서 먼저 성과를 내겠습니다.", "k": [["개발 정의", "설계|검증|새 공정|새로운"], ["양산 정의", "수율|품질|효율|안정"], ["본인 경험", "파일럿|초기 수율|최적화"], ["역량", "데이터|소통|분석"], ["태도", "배치|성과|어느 쪽"]], "f": [["솔직히 2지망은 붙으려고 쓴 것 아닙니까?", "파일럿 라인 수율 개선 경험이 있어서 쓴 것이라고 근거로 답하기."], ["양산기술은 교대 근무나 긴급 대응이 있을 수 있습니다. 괜찮습니까?", "사실대로. 파일럿 라인에서의 대응 경험이 있다면 연결."], ["양산기술에서 일하다가 나중에 개발로 옮기고 싶다고 하면 어떻게 하겠습니까?", "먼저 맡은 자리에서 성과 → 이후 회사 제도 안에서 기회를 찾겠다."]], "s": ["job1", "jobrep2", "app"]}, {"id": "I07", "c": "intro", "t": "기출", "sec": 60, "q": "희망 근무지와 다른 사업장(예: 청주)에 배치되어도 괜찮습니까?", "why": ["과거 후기에 \"원치 않는 부서·근무지 배치 시\" 질문이 반복됩니다. 채용 안내에서도 근무지는 통합 선발 후 배정한다고 했습니다."], "p": ["\"네\"로 시작", "지원서에서 이미 동의한 사실", "근무지보다 중요한 기준", "현실적인 준비 계획"], "m": "네, 괜찮습니다. 지원서에서도 **근무지 배치와 변경에 동의**했습니다.\n\n희망 순서는 현재 생활권을 기준으로 적은 것이고, 제게 더 중요한 기준은 **패키지 공정을 제대로 배울 수 있는 자리인가**입니다. 청주는 올해 **첨단 패키징 전용 팹인 P&T7**이 착공한 사업장으로 알고 있어, 오히려 배울 기회가 많을 것이라고 생각합니다.\n\n배치가 정해지면 [직접 채울 것: 이사·통근 계획을 사실대로] 준비하겠습니다.", "k": [["수용", "괜찮|동의|네"], ["기준", "배울|기준|공정"], ["사업장 이해", "청주|P&T|패키징 팹|이천|용인"], ["계획", "이사|통근|준비"]], "f": [["가족이나 생활 기반은 어떻게 할 계획입니까?", "사생활을 길게 말할 필요 없음. \"문제없이 준비하겠다\" 수준으로."]], "s": ["pt7", "app"]}, {"id": "I08", "c": "intro", "t": "기출", "sec": 60, "q": "입사 후 목표는 무엇입니까? 5년, 10년 뒤의 모습을 말해 보세요.", "why": ["오래 다닐 사람인지, 직무를 구체적으로 그려 봤는지를 봅니다."], "p": ["1~2년 / 5년 / 10년으로 끊어서", "직함이 아니라 '할 수 있게 되는 일'로 말하기"], "m": "단계별로 말씀드리겠습니다.\n\n**입사 1~2년**에는 담당 공정의 설비와 소재, 평가 방법을 정확히 익혀서, 불량이 났을 때 혼자 원인 가설을 세우고 검증 계획을 짤 수 있는 엔지니어가 되겠습니다.\n\n**5년 차**에는 몰딩과 갭 충진처럼 소재와 공정이 맞물리는 영역에서 **\"이 문제는 이 사람에게 물어보면 된다\"**는 말을 듣는 담당자가 되고 싶습니다.\n\n**10년 뒤**에는 신규 소재나 구조를 도입할 때 **소재, 공정, 신뢰성을 함께 보고 판단하는 통합 엔지니어**로서 차세대 패키지의 공정 플랫폼을 만드는 데 기여하겠습니다.", "k": [["단기", "1~2년|1년|2년|익혀|익히"], ["중기", "5년|담당자|전문"], ["장기", "10년|통합|플랫폼"], ["구체 영역", "몰딩|갭|소재|신뢰성"]], "f": [["그 목표를 위해 입사 첫 6개월에 무엇부터 하겠습니까?", "설비 조작·평가 방법·과거 불량 이력 학습처럼 구체적으로."]], "s": ["jobrep2"]}, {"id": "R101", "c": "resume1", "t": "기출", "sec": 90, "q": "현 직장에서 맡은 공정을, 처음 듣는 사람도 이해할 수 있게 설명해 보세요.", "why": ["과거 후기에 \"경력에서 다룬 공정 전체를 설명하라\"는 질문이 있습니다. 면접관은 배터리 전문가가 아닙니다. 쉬운 말로 설명하는 능력 자체가 평가 대상입니다."], "p": ["한 문장 정의: 무엇을 왜 누르는가", "왜 어려운 공정인가 (누르면 길이 방향으로도 늘어남)", "본인 역할과 파일럿 라인 업무"], "m": "저는 차세대 배터리의 극판을 만드는 공정 가운데 **롤프레스**, 즉 압연 공정을 담당했습니다. 얇은 기재 위에 입자와 바인더가 섞인 층을 입힌 뒤, 두 개의 롤 사이로 통과시켜 **눌러서 밀도를 높이고 두께를 맞추는** 공정입니다.\n\n이 공정이 어려운 이유는, 누르는 순간 소재가 **두께 방향으로만 줄지 않고 길이 방향으로도 늘어나기** 때문입니다. 늘어난 양이 설계와 다르면 치수 불량이나 말림이 생기고, 뒤 공정의 정렬까지 틀어집니다.\n\n제 역할은 [직접 채울 것: 본인 담당 범위 — 조건 설정, 평가, 설비 협의 등]이었고, 파일럿 라인에서 시제품을 만들며 **공정 변수 최적화, 초기 수율 향상, 신뢰성 평가**를 수행했습니다.", "k": [["공정 정의", "롤프레스|압연|누르|가압"], ["목적", "밀도|두께"], ["난점", "늘어|연신|치수|말림|curl"], ["역할", "파일럿|최적화|수율|신뢰성"]], "f": [["그 공정의 주요 변수는 무엇이고, 무엇을 측정해서 양품과 불량을 판정했습니까?", "[직접 채울 것] 가압력·롤 간격·속도·온도·장력 / 두께·밀도·연신율·Curl 중 실제로 본 것만."], ["본인이 직접 결정한 것과 선배나 설비 담당이 결정한 것을 구분해 주세요.", "\"제가 한 일\"을 동사로. 역할을 부풀리지 않기."], ["파일럿 라인과 양산 라인의 차이는 무엇이라고 느꼈습니까?", "조건 변경의 자유도 vs 재현성·속도. 양산기술(2지망) 질문으로 이어질 수 있음."]], "tip": "본인 공정과 다른 부분이 있으면 설명을 고치세요. 사내 용어 대신 쉬운 말로.", "s": ["app", "comm"]}, {"id": "R102", "c": "resume1", "t": "지원서", "sec": 120, "q": "경험기술서의 '연신율 오차' 문제를 어떻게 해결했는지 구체적으로 설명해 보세요.", "why": ["지원서의 핵심 경험입니다. 현상 → 가설 → 검증 → 조치 → 결과가 끊기지 않는지, 그리고 '본인이 한 것'이 무엇인지 봅니다."], "p": ["현상을 한 문장으로", "가설 3개: 입자 거동 / 계면 접착력 / 탄성 복원", "어떻게 검증했는가 ← 지원서에 없음. 반드시 준비", "조치: 가압 프로파일·레시피 가이드라인", "결과: 상대값이라도 숫자로"], "m": "**현상**은 같은 가압 조건인데 소재 종류와 슬러리 조성에 따라 길이 방향 연신율이 달라져 치수 불량이 난 것이었습니다. 저는 설비 값을 조금씩 바꿔 보는 대신 **'소재 물성이 가압 에너지가 전달되는 방향을 바꾼다'**는 가설에서 출발했습니다.\n\n원인을 세 가지로 나눠 봤습니다. 첫째 **입자 거동**입니다. 입자의 경도와 형상에 따라 수직 압력이 입자 파쇄로 흡수되는지, 옆으로 밀어내는 힘이 되는지를 봤습니다. 둘째 **계면 접착력**입니다. 기재와 합제층의 접착이 강하면 미끄러짐은 줄지만, 기재를 함께 끌고 늘어나는 전단 응력이 됩니다. 셋째 **탄성 복원**입니다. 롤을 빠져나올 때의 스프링백이 실제 소성 변형량을 얼마나 바꾸는지 계산했습니다.\n\n이 가설들을 [직접 채울 것: 검증 방법 — 어떤 측정과 실험으로 확인했는지]으로 확인한 뒤, 소재 특성별 **가압 프로파일과 레시피 가이드라인**을 만들었습니다. 그 결과 치수 변형률 오차를 목표 스펙 안으로 줄였고, 수치로는 [직접 채울 것: 개선 전→후를 상대값(%)으로]입니다.", "k": [["현상", "연신|치수|불량"], ["입자 거동", "입자|경도|파쇄|유동|밀림"], ["계면", "계면|접착|전단"], ["탄성 복원", "탄성|스프링백|복원|잔류"], ["검증", "검증|측정|실험|확인"], ["조치·결과", "프로파일|레시피|가이드라인|스펙|%|퍼센트"]], "f": [["'목표 스펙 이내'라고만 썼습니다. 개선 폭이 어느 정도였습니까?", "절대값은 보안상 불가 → 상대 개선율과 판정 기준(샘플 수·기간)을 준비."], ["세 요인 중 기여도가 가장 큰 것은 무엇이었고, 어떻게 분리해서 확인했습니까?", "한 번에 한 변수만 바꾼 비교 실험이 있었는지. 없었다면 없다고 말하고 그때의 판단 근거를 설명."], ["'계산했다'고 했는데 어떤 식이나 모델로 계산했습니까?", "실제로 한 방법만. 예: 롤 간격과 최종 두께 차이로 복원량 산출. 모르는 식을 꾸미지 않기."], ["그 가이드라인은 지금도 현장에서 쓰이고 있습니까?", "사실대로. 후속 적용 여부·한계."]], "tip": "'슬러지'가 아니라 '슬러리'입니다. 말할 때 정확히 발음하세요.", "s": ["app"]}, {"id": "R103", "c": "resume1", "t": "지원서", "sec": 40, "q": "지원서에 '슬러지 조성'이라고 쓰셨는데, 무슨 뜻입니까?", "why": ["지원서의 오타를 짚는 질문입니다. 당황하는지, 변명하는지, 바로 인정하고 내용으로 넘어가는지를 봅니다."], "p": ["바로 인정 (한 문장)", "올바른 용어와 뜻", "원래 하려던 말로 복귀"], "m": "죄송합니다. **'슬러리(slurry) 조성'을 잘못 적었습니다.** 코팅에 쓰는 원료 혼합물의 배합비를 뜻합니다. 제출 전에 더 꼼꼼히 확인했어야 했습니다.\n\n내용상으로는, 같은 가압 조건에서도 **슬러리 조성에 따라 합제층의 입자 충진 상태와 접착력이 달라져서** 연신율이 달라졌다는 의미로 적었습니다.", "k": [["인정", "죄송|잘못|오타|오기"], ["정정", "슬러리|slurry"], ["뜻", "배합|혼합|원료"], ["내용 복귀", "충진|접착|연신"]], "f": [["꼼꼼함이 중요한 직무인데, 평소에도 이런 실수가 있습니까?", "실수 인정 + 현재 쓰는 확인 습관(체크리스트, 교차 검토)을 사실대로."]], "tip": "길게 사과하지 마세요. 인정 한 문장, 정정 한 문장, 내용 한 문장이면 충분합니다.", "s": ["app"]}, {"id": "R104", "c": "resume1", "t": "지원서", "sec": 90, "q": "장력을 낮췄더니 정렬이 틀어졌고, EPC 게인으로 해결했다고 썼습니다. 자세히 설명해 보세요.", "why": ["'트레이드오프 극복'이 지원서 제목에 있습니다. 한쪽을 고치면 다른 쪽이 나빠지는 상황을 어떻게 풀었는지가 PKG개발의 '통합 엔지니어' 역할과 직접 맞닿습니다."], "p": ["무엇을 고치려다 무엇이 나빠졌는가", "왜 원복하지 않았는가", "무엇을 연동했는가 (장력 조건 ↔ EPC 게인)", "배운 점: 한 공정의 최적 ≠ 전체의 최적"], "m": "연신 오차를 줄이려고 **이송 장력을 낮췄더니**, 소재가 팽팽하게 잡히지 않아 뒤 공정의 **정렬(Alignment)이 틀어지는 부작용**이 생겼습니다. 한쪽 품질을 올리자 다른 쪽이 나빠진 **트레이드오프**였습니다.\n\n장력을 다시 올리면 원래 문제로 돌아가기 때문에, 장력은 낮게 유지하고 소재의 좌우 위치를 잡아 주는 **EPC(Edge Position Control)의 제어 게인**을 조정했습니다. 장력이 낮은 상태에서는 기존 게인으로 위치 보정이 충분하지 않았기 때문에 [직접 채울 것: 본인이 이해한 이유를 한 문장으로], **장력 조건에 연동해 게인 민감도를 높이는 피드백 로직**을 적용했습니다.\n\n그 결과 치수 오차와 정렬 품질을 함께 만족시켰습니다 [직접 채울 것: 정렬 편차 개선을 상대값으로]. 이 경험으로 **한 공정의 최적이 전체의 최적은 아니다**는 것을 배웠습니다.", "k": [["문제", "장력|흐느적|정렬|alignment|얼라인"], ["트레이드오프", "트레이드오프|부작용|다른 쪽"], ["해결", "EPC|게인|피드백|연동"], ["결과", "동시|함께|만족"], ["배운 점", "전체|최적|앞뒤|후속"]], "f": [["게인을 올리면 과보정이나 진동이 생길 수 있습니다. 어떻게 확인했습니까?", "단계적으로 올리며 모니터링했는지 등 실제로 한 것만."], ["제어 로직은 본인이 직접 수정했습니까, 담당 부서와 협업했습니까?", "역할 구분. 협업이었다면 본인이 제안·검증한 부분을 분명히."], ["패키지 공정에서 비슷한 트레이드오프를 예로 들어 보세요.", "필러 함량↑ → CTE↓·방열↑ / 점도↑·충진성↓. 칩 박형화 → 적층↑ / 휨↑."]], "s": ["app", "jobrep2"]}, {"id": "R105", "c": "resume1", "t": "지원서", "sec": 120, "q": "롤프레스는 선 접촉 연속 공정이고 Compression Molding은 면 가압 열경화 공정입니다. 무엇이 같고 무엇이 다릅니까?", "why": ["지원서 전체가 \"내 경험 = Compression Molding에 통한다\"는 주장 위에 서 있습니다. 가장 강하게 반박이 들어올 지점입니다."], "p": ["다른 점을 먼저, 분명하게 인정", "경화 거동은 새로 배워야 한다고 스스로 말하기", "같은 점: 필러 든 복합 소재, 계면, 잔류 응력", "가져올 것은 '설비 노하우'가 아니라 '분석 방식'"], "m": "먼저 **다른 점을 분명히** 말씀드리겠습니다. 롤프레스는 두 롤 사이를 지나가는 **선 접촉의 연속 공정**이고, 이미 건조된 고체 층을 눌러 밀도를 높입니다. 컴프레션 몰딩은 금형 안에서 **면 전체를 가압하는 공정**이고, 녹은 EMC가 칩 주위를 채운 뒤 **열경화 반응으로 굳는다**는 점이 근본적으로 다릅니다. 시간과 온도에 따라 점도가 변하는 **경화 거동**, 금형과 진공 조건은 제가 새로 배워야 할 부분입니다.\n\n**같은 점**은 문제의 물리입니다. 둘 다 **필러 입자가 든 복합 소재**에 열과 압력을 가하고, 입자 유동이 고르지 않으면 결함이 생기며, **서로 다른 재료 사이 계면의 접착력**과 **가압 후 남는 잔류 응력**이 치수 변형, 즉 휨으로 나타납니다.\n\n그래서 제가 가져올 수 있는 것은 설비 노하우가 아니라 **'소재 물성 → 응력과 유동 → 불량'으로 원인을 좁혀 가는 분석 방식**이라고 생각합니다.", "k": [["차이 인정", "선 접촉|연속|면 가압|다른 점|다릅니다"], ["경화", "경화|열경화|점도|굳"], ["공통 물리", "필러|입자|복합|유동"], ["계면·응력", "계면|접착|잔류|응력|휨"], ["한정", "분석 방식|노하우가 아니라|새로 배워"]], "f": [["그렇다면 지원서의 '강력한 무기'라는 표현은 과장 아닙니까?", "인정 + 한정. \"표현이 과했습니다. 설비 경험이 아니라 분석 방식이라는 뜻이었습니다.\""], ["EMC는 굳으면서 수축합니다. 배터리 소재에는 없는 현상인데 어떻게 다루겠습니까?", "모른다고 인정 + 아는 만큼(경화 수축과 CTE 차이가 휨을 만든다) + 배울 계획."], ["트랜스퍼 몰딩과 컴프레션 몰딩은 유동 면에서 어떻게 다릅니까?", "흐르는 거리. PKG 지식 문항에서 따로 연습."]], "s": ["app", "col6"]}, {"id": "R106", "c": "resume1", "t": "지원서", "sec": 90, "q": "지원서에서 계속 Compression Molding을 말했는데, HBM은 MR-MUF 공정을 씁니다. 둘의 관계를 어떻게 이해하고 있습니까?", "why": ["지원 직무의 대표 제품(HBM)과 지원서의 키워드(Compression Molding)가 정확히 맞물리는지 확인하는 질문입니다. 아는 것과 모르는 것의 경계를 정직하게 말하는지 봅니다."], "p": ["MR과 MUF를 나눠서 설명", "MUF = 언더필과 몰딩을 한 번에", "공개 자료에서 확인한 것만 근거로", "확인 못 한 것은 못 했다고 말하기"], "m": "제가 이해한 범위에서 말씀드리겠습니다. **MR-MUF**는 칩을 쌓은 뒤 리플로우로 범프를 한 번에 접합하고(MR), 칩 사이 틈과 주변을 **액상 EMC로 채워 굳히는(MUF)** 방식입니다. MUF 단계 자체가 **언더필과 몰딩을 한 번에 하는 몰딩 공정**입니다.\n\n뉴스룸 기사에서는 12단 HBM3에 적용한 어드밴스드 MR-MUF를 **진공 상태에서 EMC를 밀어 넣고 높은 압력을 가해 좁은 틈을 채우는** 방식으로 설명했고, 후공정 칼럼에서는 HBM 같은 적층 칩의 **웨이퍼 몰딩에서 EMC를 가압·가열해 성형**한다고 설명합니다. 그래서 저는 좁은 갭을 **Void 없이 채우고 휨을 제어한다**는 과제가 제가 지원서에 쓴 가압 몰딩의 과제와 같은 선상에 있다고 봤습니다.\n\n다만 실제 HBM 라인에서 어떤 설비와 조건을 쓰는지는 **공개 자료로 확인하지 못했습니다**. 그 부분은 입사해서 정확히 배우겠습니다.", "k": [["MR 설명", "리플로우|범프|접합"], ["MUF 설명", "MUF|언더필|액상|채워|충진"], ["근거", "뉴스룸|칼럼|기사"], ["공통 과제", "void|보이드|휨|warpage|갭"], ["정직", "확인하지 못|이해한 범위|배우겠"]], "f": [["그러면 Compression Molding은 주로 어떤 제품에 쓰입니까?", "얇은 패키지·고적층·대형 기판과 웨이퍼 몰딩(팬아웃, 적층 칩). 칼럼에서 확인한 범위까지만."], ["MR-MUF에서 휨이 왜 더 문제가 됩니까?", "열압착처럼 칩을 강하게 누르지 않아서 얇은 칩의 휨을 힘으로 펴기 어렵다 → 12단에서 휨 제어 기술 추가."]], "tip": "모르는 설비·조건을 아는 것처럼 말하지 마세요. \"공개 자료 기준으로는\"이라고 한정하면 됩니다.", "s": ["hbm3", "col8"]}, {"id": "R107", "c": "resume1", "t": "기출", "sec": 90, "q": "지원서에 성과 수치가 없습니다. '목표 스펙 이내', '완벽히 달성'의 근거를 말해 보세요.", "why": ["과거 후기에 \"성과를 어떻게 산출했는지 근거를 대라\"는 질문이 있습니다. 지원서에 수치가 하나도 없어서 반드시 나올 질문입니다."], "p": ["수치를 못 쓴 이유 (보안) 한 문장", "말할 수 있는 범위: 지표 이름, 상대 개선율, 판정 기준", "'완벽히'는 과했다고 인정"], "m": "지적하신 대로 **수치를 적지 못했습니다**. 현 직장에서 개발 중인 공정이라 **절대값과 스펙은 보안상 밝히기 어렵기 때문**입니다. 말씀드릴 수 있는 범위에서 설명드리겠습니다.\n\n평가 지표는 [직접 채울 것: 지표 이름 — 예: 길이 방향 연신율 편차, Curl 높이, 합제 밀도]였고, 개선 전과 비교해 [직접 채울 것: 상대 개선율 — 예: 편차 약 ○○% 감소]였습니다. 판정은 [직접 채울 것: 샘플 수, 반복 횟수, 기간] 기준으로 했습니다.\n\n그리고 '완벽히'라는 표현은 **과했습니다**. 정확히는 '목표 합제 밀도 범위를 만족했다'는 뜻이고, [직접 채울 것: 남아 있던 편차나 한계 한 가지]는 과제로 남아 있었습니다.", "k": [["이유", "보안|밝히기 어렵|현 직장"], ["지표", "지표|연신|curl|밀도|편차"], ["상대값", "%|퍼센트|감소|개선|대비"], ["판정 기준", "샘플|반복|기간|기준"], ["과장 인정", "과했|정확히는|한계"]], "f": [["보안이라 말할 수 없다면, 우리가 그 성과를 어떻게 믿습니까?", "과정으로 증명: 가설-검증의 순서와 판단 근거를 구체적으로 설명할 수 있다는 점."], ["우리 회사 기술도 다른 회사 면접에서 그렇게 말하겠습니까?", "\"아니요. 같은 기준으로 지키겠습니다.\""]], "tip": "면접 전에 '상대값으로 말할 수 있는 숫자' 3개를 꼭 정해 두세요. 이 페이지의 '내 숫자 노트'에 적어 둘 수 있습니다.", "s": ["comm", "app"]}, {"id": "R108", "c": "resume1", "t": "지원서", "sec": 90, "q": "수분·이물 제어 가이드라인을 수립했다고 했습니다. 무엇을 했고, 패키지 공정과는 어떻게 연결됩니까?", "why": ["지원서에 한 줄로만 쓴 경험입니다. 실제로 한 일의 깊이를 확인하고, 패키지 신뢰성(흡습)과 연결할 수 있는지 봅니다."], "p": ["왜 수분이 치명적인가 (본인 분야)", "실제로 한 일 ← 준비 필요", "패키지에서 수분이 일으키는 문제: 흡습 → 리플로우 → 박리·크랙", "공통점: 유입 경로 추적"], "m": "배터리 소재에서 **수분과 미세 보이드**는 전해질을 열화시키고 덴드라이트 성장을 유발해 단락으로 이어지는 치명적인 요인입니다. 그래서 **공정별로 수분이 들어오는 경로**를 정리하고 [직접 채울 것: 실제로 한 일 — 예: 공정별 수분 측정, 건조 조건과 보관 시간 기준 수립], 이를 관리 기준으로 만들었습니다.\n\n패키지에서도 수분은 중요한 변수라고 알고 있습니다. EMC나 기판이 **흡습한 상태에서 리플로우 같은 고온을 만나면 계면 박리나 크랙**으로 이어질 수 있어서, 신뢰성 평가에서는 흡습 후 리플로우를 거치는 **프리컨디셔닝**을 전처리로 둔다고 이해하고 있습니다.\n\n'수분이 어디서 들어와 어떤 불량으로 이어지는지 **경로를 추적한다**'는 접근은 그대로 쓸 수 있다고 생각합니다.", "k": [["본인 분야", "수분|보이드|단락|덴드라이트|전해질"], ["한 일", "경로|기준|건조|측정|가이드라인"], ["패키지 연결", "흡습|리플로우|박리|크랙"], ["평가", "프리컨디셔닝|신뢰성|전처리"]], "f": [["가이드라인 수립 전과 후에 무엇이 달라졌습니까?", "[직접 채울 것] 불량률·재작업 등 상대값."], ["패키지 몰딩 공정에서 수분은 어떤 불량을 만듭니까?", "고온에서 기화 → Void, 계면 접착 저하 → 박리. 자재 사전 건조와 보관 관리."]], "s": ["app", "col11"]}, {"id": "R109", "c": "resume1", "t": "지원서", "sec": 60, "q": "지금까지 말한 성과에서, 팀이 아니라 '본인만의 기여'는 무엇입니까?", "why": ["2년 차 사원이 '규명했다, 확립했다, 구축했다'고 쓴 것에 대한 검증입니다. 부풀리면 꼬리질문에서 무너집니다."], "p": ["본인이 바꾼 것 한 가지", "직접 만든 산출물", "협업한 부분은 협업이라고 말하기"], "m": "가장 분명한 제 기여는 **문제를 정의하는 방식**을 바꾼 것입니다. 이전에는 [직접 채울 것: 기존 방식 — 예: 불량이 나면 가압력과 속도를 바꿔 보는 방식]이 일반적이었는데, 저는 소재별 차이를 **입자 유동, 계면 접착, 탄성 복원** 세 축으로 정리해서 [직접 채울 것: 본인이 만든 산출물 — 예: 소재별 가압 프로파일 가이드라인 문서]를 만들었습니다.\n\n설비 조건 변경과 제어 로직 수정은 [직접 채울 것: 협업한 부서·담당자]와 함께 했고, 그중 저는 [직접 채울 것: 본인이 직접 한 부분 — 가설 수립, 실험 설계, 데이터 분석 등]을 맡았습니다.", "k": [["본인 기여", "제 기여|제가|직접"], ["방식 변화", "정의|방식|세 축|정리"], ["산출물", "가이드라인|문서|프로파일"], ["협업 구분", "함께|협업|담당"]], "f": [["선배가 방향을 잡아 주고 본인은 실행만 한 것 아닙니까?", "사실대로. 도움받은 부분을 인정하고, 그 안에서 스스로 판단한 지점을 말하기."]], "tip": "\"팀이 했다\"와 \"내가 했다\"를 섞으면 신뢰를 잃습니다. 주어를 분명히 하세요.", "s": ["app"]}, {"id": "R110", "c": "resume1", "t": "지원서", "sec": 90, "q": "파일럿 라인에서 초기 수율을 어떻게 올렸습니까?", "why": ["담당 업무에 '초기 수율 향상, 결함 제어'가 적혀 있습니다. 2지망 양산기술과도 직결되는 질문입니다."], "p": ["불량을 유형별로 나눔", "비중이 큰 불량부터", "원인 가설 → 좁힌 실험 → 조건 확정", "뒤 공정 영향 확인"], "m": "파일럿 라인에서는 **불량을 유형별로 나누는 것**부터 했습니다. [직접 채울 것: 주요 불량 유형 2~3개] 가운데 비중이 가장 큰 [직접 채울 것: 1순위 불량]부터 잡았습니다.\n\n원인은 설비 조건만이 아니라 **소재 물성과의 상호작용**에서 찾았고, 가설을 세운 뒤 **변수를 좁힌 실험**으로 조건을 최적화했습니다. 그 결과 초기 수율이 [직접 채울 것: 상대 개선 폭]만큼 개선됐습니다.\n\n이 과정에서 두 가지를 배웠습니다. **가장 큰 불량부터 잡아야 한다**는 것, 그리고 한 공정의 조건을 바꾸면 **뒤 공정에 미치는 영향까지 확인해야 한다**는 것입니다.", "k": [["분류", "유형|분류|비중|파레토"], ["우선순위", "가장 큰|1순위|우선"], ["원인·실험", "가설|실험|최적화|변수"], ["결과", "수율|개선"], ["교훈", "뒤 공정|영향|배웠"]], "f": [["수율을 어떻게 정의하고 계산했습니까?", "투입 대비 양품 비율. 실제 기준을 사실대로."], ["불량 원인이 본인 공정이 아니라 앞 공정에 있었다면 어떻게 했습니까?", "데이터로 근거를 만들어 공유 → 함께 실험."]], "s": ["app"]}, {"id": "R111", "c": "resume1", "t": "지원서", "sec": 90, "q": "신뢰성 평가는 어떤 항목을 어떻게 했습니까? 반도체 패키지 신뢰성 평가와 비교해 보세요.", "why": ["담당 업무의 '신뢰성 평가'를 실제로 했는지, 그리고 패키지 신뢰성 시험을 공부했는지를 한 번에 확인합니다."], "p": ["실제 수행 항목 ← 준비 필요", "신뢰성의 뜻: 시간이 지나도 유지되는가", "패키지 시험 2~3개와 검출 불량", "공통 논리: 스트레스 ↔ 고장 메커니즘"], "m": "현 직장에서는 [직접 채울 것: 실제로 수행한 평가 항목]을 수행했습니다. 평가의 목적은 출하 시점의 품질이 아니라 **시간이 지난 뒤에도 기능이 유지되는지**를 가속 조건에서 확인하는 것이었습니다.\n\n반도체 패키지도 같은 논리라고 이해하고 있습니다. 온도를 반복해서 올리고 내리는 **TC(Thermal Cycle)**는 재료 간 열팽창 차이로 생기는 **계면 박리와 크랙**을 보고, **THB와 HAST**는 고온·고습에서의 내습성을, **프리컨디셔닝**은 흡습 후 리플로우를 견디는지를 봅니다.\n\n제품이 달라도 **'어떤 스트레스가 어떤 고장 메커니즘을 가속하는가'**를 먼저 정의한다는 점은 같습니다. 그래서 제 평가 경험을 빠르게 옮겨 올 수 있다고 생각합니다.", "k": [["본인 평가", "평가|항목|수행"], ["신뢰성 정의", "시간|유지|가속|수명"], ["패키지 시험", "TC|thermal|THB|HAST|프리컨디셔닝"], ["고장", "박리|크랙|내습"], ["공통 논리", "스트레스|메커니즘|고장"]], "f": [["품질과 신뢰성의 차이는 무엇입니까?", "품질 = 출하 시점에 기준 충족. 신뢰성 = 그 품질이 보증 기간 동안 유지되는 정도."], ["가속 시험 결과로 실제 수명을 어떻게 추정합니까?", "가속 인자(온도·전압 등)와 통계 기법을 쓴다는 수준까지. 깊은 수식은 모르면 모른다고."]], "s": ["app", "col11"]}, {"id": "R112", "c": "resume1", "t": "기출", "sec": 90, "q": "시도했다가 기대만큼 결과가 나오지 않은 경험과, 그때 어떻게 대응했는지 말해 보세요.", "why": ["과거 후기의 \"결과가 기대 이하였을 때 어떻게 했나\" 질문입니다. 실패를 숨기지 않고 원인을 자기 쪽에서 찾는지를 봅니다."], "p": ["무엇을 시도했고 무엇이 나빠졌는가", "원인을 '내 판단'에서 찾기", "대응 과정 (공유 → 대안 → 검증)", "이후 바뀐 습관"], "m": "연신 오차를 줄이려고 **이송 장력을 낮춘 시도**가 그랬습니다. 연신 오차는 줄었지만 소재가 흐느적거리면서 **뒤 공정의 정렬이 틀어지는** 새 문제가 생겼습니다. 제 공정의 지표만 보고 **후속 공정 영향을 미리 확인하지 않은 것**이 원인이었습니다.\n\n바로 원래대로 되돌리지 않고, 먼저 [직접 채울 것: 후속 공정 담당자와 어떻게 공유하고 협의했는지]. 그리고 장력은 유지한 채 **EPC 제어 게인을 장력 조건에 연동**하는 방법으로 두 지표를 함께 만족시켰습니다.\n\n이후로는 조건을 바꾸기 전에 **'이 변경이 앞뒤 공정의 어떤 지표를 건드리는가'**를 먼저 적어 보는 습관을 들였습니다.", "k": [["시도", "장력|낮춘|시도"], ["문제", "정렬|틀어|부작용|새 문제"], ["자기 원인", "확인하지 않|제 공정|원인"], ["대응", "공유|협의|EPC|게인|연동"], ["습관", "습관|먼저 적|앞뒤"]], "f": [["그때 가장 먼저 누구에게 무엇을 보고했습니까?", "[직접 채울 것] 사실대로. 문제를 숨기지 않고 빨리 알렸다는 점."]], "s": ["comm", "app"]}, {"id": "R113", "c": "resume1", "t": "예상", "sec": 45, "q": "현 직장의 기술 내용 중 보안상 말할 수 없는 부분이 있을 텐데, 어디까지 말할 수 있습니까?", "why": ["기술 유출에 민감한 업계입니다. 여기서 선을 분명히 긋는 지원자가 오히려 신뢰를 얻습니다."], "p": ["말하지 않는 것 3가지", "말할 수 있는 것 2가지", "입사 후에도 같은 기준"], "m": "**구체적인 소재명, 설비 조건값, 스펙 수치**는 현 직장의 자산이라 말씀드리지 않겠습니다.\n\n대신 **문제를 어떻게 정의하고 어떤 순서로 풀었는지**, 그리고 **상대적인 개선 폭**은 설명드릴 수 있습니다.\n\nSK하이닉스에 입사한 뒤에도 같은 기준으로 **회사의 기술 정보를 지키겠습니다**.", "k": [["말 안 함", "소재명|조건값|스펙|수치"], ["말함", "정의|순서|상대|과정"], ["원칙", "지키|같은 기준|보안"]], "f": [["그래도 조금만 더 구체적으로 말해 줄 수 없습니까?", "정중히 한 번 더 선 긋기. 대신 과정 설명을 더 자세히 하겠다고 제안."]], "tip": "면접 전체에서 이 선을 지키세요. 한 번이라도 수치를 말하면 이 답이 무너집니다.", "s": ["app"]}, {"id": "R114", "c": "resume1", "t": "지원서", "sec": 60, "q": "학부에서 배운 과목 중 PKG개발에 가장 도움이 될 과목과 이유를 말해 보세요.", "why": ["성적표의 과목(화학·화학공학·고분자 복수전공)이 직무와 어떻게 이어지는지 스스로 설명할 수 있는지 봅니다."], "p": ["과목 2~3개만", "각 과목 → 패키지의 어떤 문제에 쓰이는지 한 문장씩"], "m": "세 과목을 꼽겠습니다.\n\n**고분자공학입문**입니다. 열경화성 수지의 가교와 유리전이온도를 다루는 과목이라, EMC의 경화와 Tg 전후 물성 변화를 이해하는 바탕이 됩니다.\n\n**화공유체역학과 열 및 물질전달**입니다. 좁은 틈을 흐르는 점성 유체와 열의 이동을 다루기 때문에 **갭 충진과 방열** 문제에 직접 연결됩니다.\n\n**반응공학**입니다. 온도와 시간에 따른 반응 속도를 다루므로 **경화 프로파일**을 이해하는 데 쓰입니다.\n\n여기에 **반도체화학공정** 과목으로 전공정의 기본 흐름을 익혔습니다. [직접 채울 것: 각 과목에서 실제로 기억나는 내용 한 가지씩으로 다듬기]", "k": [["고분자", "고분자|가교|유리전이|Tg"], ["유체·열", "유체|열|물질전달|점성|충진|방열"], ["반응", "반응공학|반응 속도|경화"], ["반도체", "반도체화학공정|전공정"]], "f": [["유리전이온도(Tg)가 무엇인지 설명해 보세요.", "고분자가 단단한 유리 상태에서 고무 상태로 바뀌는 온도. Tg를 넘으면 열팽창이 커지고 탄성률이 떨어짐."], ["학점이 학년이 갈수록 올랐는데 이유가 있습니까?", "사실대로. (지원서 기준 4학년 평점이 가장 높음)"]], "tip": "수업에서 실제로 배운 내용과 다르면 과목을 바꾸세요. 성적표에 있는 과목만 말하세요.", "s": ["app"]}, {"id": "R201", "c": "resume2", "t": "지원서", "sec": 120, "q": "AI를 활용해 Curl 문제를 해결한 과정을 처음부터 끝까지 설명해 보세요.", "why": ["AI 활용 역량 문항의 핵심 경험입니다. \"AI가 답을 줬다\"가 아니라 \"내가 문제를 정의하고, AI로 가설을 넓히고, 내가 검증했다\"가 들려야 합니다."], "p": ["상황: 무엇이 바뀌었고 무엇이 나빠졌는가", "내가 한 문제 정의", "AI에게 시킨 일 (가설 여러 개)", "내가 고른 가설과 검증 방법 ← 지원서에 없음. 반드시 준비", "조치: 다단 압축 / 결과"], "m": "**상황**은 신규 소재 적용과 극판 폭 축소를 함께 진행하던 중, 같은 가압 조건인데 Curl이 크게 늘어난 것이었습니다. 가압력만 조절해서는 **연신율과 합제 밀도**를 동시에 맞출 수 없었습니다.\n\n저는 먼저 **문제를 제가 정의**했습니다. '수직 압력이 어떤 경로로 길이 방향 연신으로 바뀌는가'로 질문을 좁힌 뒤, AI에 입자 경도, 바인더 탄성계수, 기재 두께 같은 조건과 폭 축소 상황을 주고 **가능한 메커니즘을 여러 개 제시하게** 했습니다.\n\n그중 **'폭이 줄면 폭 방향으로 분산되던 변형이 길이 방향으로 몰린다'**는 가설과 **'경도가 높은 입자는 부서지지 않고 밀어내는 힘으로 작용한다'**는 가설을 골라, [직접 채울 것: 실제 데이터나 실험으로 검증한 방법]으로 확인했습니다.\n\n조치로 **단일 가압을 다단 압축으로 바꾸고** 단계별 두께 감소율을 조절해서, 목표 합제 밀도를 만족하면서 Curl을 스펙 안으로 줄였습니다. AI는 **가설의 폭을 넓히는 데** 썼고, **채택과 검증은 제가** 했습니다.", "k": [["상황", "curl|컬|말림|폭 축소|신규 소재"], ["문제 정의", "정의|질문|좁힌|경로"], ["AI 역할", "가설|메커니즘|제시|여러"], ["원인", "길이 방향|MD|집중|몰린|경도|밀"], ["검증", "검증|확인|실험|데이터"], ["조치·결과", "다단|두께 감소|밀도|스펙"]], "f": [["AI가 제시한 가설 중 틀린 것은 무엇이었고, 어떻게 걸러 냈습니까?", "실제 사례 하나. 없으면 \"우리 조건과 맞지 않아 제외한 가설\"이라도."], ["그 정도는 선배나 논문에서도 얻을 수 있습니다. AI가 아니면 안 됐던 이유가 있습니까?", "\"안 됐던 것은 아니다\"라고 인정 → 짧은 시간에 여러 분야(재료역학·제어)의 가설을 한꺼번에 펼쳐 볼 수 있었다는 장점."], ["'전방 밀림력으로 100% 전환'이라고 썼습니다. 100%의 근거는 무엇입니까?", "\"표현이 과했습니다. 대부분이 밀림력으로 작용한다고 판단했다는 뜻입니다\" + 판단 근거."], ["다단 압축은 이미 알려진 방법입니다. 본인의 기여는 무엇입니까?", "방법 자체가 아니라 '왜 이 조건에서 필요한지'를 메커니즘으로 설명하고 단계별 감소율을 정한 것."]], "s": ["app"]}, {"id": "R202", "c": "resume2", "t": "지원서", "sec": 60, "q": "회사의 소재 물성 데이터를 생성형 AI에 입력했다고 썼습니다. 보안 문제는 없었습니까?", "why": ["지원서에서 가장 위험한 문장입니다. 반도체 회사는 보안에 매우 민감합니다. 사실과 다르게 답하면 안 되고, 사실이 불리하면 배운 점까지 말해야 합니다."], "p": ["실제로 어떤 환경에서 어떻게 썼는지 (사실대로)", "지원서 표현이 오해를 살 수 있었다는 인정", "입사 후 원칙"], "m": "중요한 지적입니다. [직접 채울 것: 아래 (가)·(나) 중 사실에 맞는 쪽만 남기세요]\n\n(가) **회사에서 허용한 AI 환경**을 사용했습니다. 보안 규정에 따라 승인된 도구 안에서만 데이터를 다뤘습니다.\n\n(나) 외부 AI에는 **실제 수치나 소재명을 넣지 않았습니다**. '경도가 높다', '폭이 줄었다'처럼 **일반화한 조건**으로만 넣어서 회사 고유 정보가 드러나지 않게 했습니다.\n\n지원서에 '물성 데이터를 입력했다'고 쓴 표현은 **오해를 살 수 있었다**고 생각합니다. SK하이닉스에서도 **보안 정책이 허용하는 도구와 범위 안에서만** AI를 쓰겠습니다.", "k": [["사용 환경", "허용|승인|사내|일반화|넣지 않"], ["표현 인정", "오해|표현"], ["원칙", "보안|정책|범위"]], "f": [["일반화해서 넣었다면 AI의 답도 일반론이었을 텐데, 그게 실제 문제 해결에 도움이 됐습니까?", "일반 원리(변형이 한 방향으로 몰림)를 얻고, 구체 조건 적용과 검증은 사내 데이터로 직접 했다."], ["동료가 회사 데이터를 외부 AI에 넣는 것을 본다면 어떻게 하겠습니까?", "먼저 직접 알려 주고, 반복되면 규정에 따라 보고."]], "tip": "이 문항은 본인이 실제로 어떻게 썼는지에 따라 답이 완전히 달라집니다. 사실 확인 후 한쪽만 남기세요. 사실이 (가)도 (나)도 아니라면, 숨기지 말고 \"당시 판단이 부족했고 지금은 이렇게 한다\"로 답하는 편이 안전합니다.", "s": ["app"]}, {"id": "R203", "c": "resume2", "t": "예상", "sec": 90, "q": "AI의 답이 틀렸던 적이 있습니까? AI의 답을 어떻게 검증합니까?", "why": ["새 면접에서 AI 문항으로 가장 유력한 질문입니다. AI를 맹신하지 않는지, 자기만의 검증 절차가 있는지를 봅니다."], "p": ["틀렸던 실제 사례 하나", "검증 3단계: 이론 → 1차 자료 → 데이터·실험", "원칙 한 줄"], "m": "있습니다. [직접 채울 것: 실제 사례 한 가지 — 예: 그럴듯하지만 우리 조건과 맞지 않는 메커니즘을 제시한 경우]. 생성형 AI는 **그럴듯한 설명을 만들어 내기 때문에** 검증 없이 믿지 않습니다.\n\n저는 세 단계로 확인합니다. 첫째, **물리 법칙과 단위**에 맞는지 제가 아는 이론으로 따져 봅니다. 둘째, 근거를 요구해서 **교과서나 논문 같은 1차 자료**와 대조합니다. 셋째, 가장 중요한 단계로 **현장 데이터나 작은 실험**으로 확인합니다. 가설이 맞다면 어떤 결과가 나와야 하는지를 먼저 적고, 실제 결과와 비교합니다.\n\nAI의 답은 **가설 후보**이고, **결론은 데이터가 정한다**는 원칙으로 씁니다.", "k": [["사례", "틀린|틀렸|맞지 않|오류"], ["이론 확인", "물리|단위|이론"], ["자료 대조", "논문|교과서|1차|근거"], ["실험 확인", "데이터|실험|비교"], ["원칙", "가설|후보|결론"]], "f": [["검증할 시간이 없을 만큼 급한 상황이라면 어떻게 하겠습니까?", "검증 안 된 내용은 '미검증 가설'이라고 표시해서 공유. 조건 변경은 하지 않는다."]], "s": ["half1", "app"]}, {"id": "R204", "c": "resume2", "t": "예상", "sec": 60, "q": "지원서 작성 안내에서 단순 질의응답형 AI 활용은 지양한다고 했습니다. 본인 경험은 질의응답에 가깝지 않습니까?", "why": ["지원서의 AI 경험이 '대화·토론'형이라 나올 수 있는 반박입니다. 방어만 하지 말고 한계를 인정해야 합니다."], "p": ["형식은 대화였지만 한 일은 세 가지", "결과가 공정 변경으로 이어졌다는 점", "한계 인정 + 넓힐 방향"], "m": "형식은 대화였지만, **검색하듯 답을 받아 쓴 것은 아닙니다**. 제가 한 일은 세 가지입니다. 문제를 **제가 먼저 정의**했고, AI에게 **서로 다른 가설을 여러 개 내게 한 뒤** 조건을 바꿔 가며 반박했고, 남은 가설을 **실험 계획으로 바꿔 검증**했습니다. 그 결과가 **다단 압축이라는 공정 변경**으로 이어졌습니다.\n\n다만 한계도 인정합니다. **데이터 분석 자동화나 모델링**처럼 AI를 도구로 구현해 본 경험은 부족합니다. [직접 채울 것: 데이터 분석에 AI나 코드를 써 본 경험이 있다면 추가] 입사 후에는 공정 데이터 분석에 AI를 적용하는 쪽으로 넓혀 가겠습니다.", "k": [["차별점", "정의|가설|반박|검증"], ["결과", "다단|공정 변경|실험"], ["한계", "한계|부족|인정"], ["확장", "데이터 분석|넓혀|적용"]], "f": [["그러면 코딩이나 데이터 분석 도구는 어느 정도 다룹니까?", "사실대로. 컴퓨터활용능력 1급(엑셀)은 지원서에 있음. 그 외는 실제 수준만."]], "s": ["half1", "app"]}, {"id": "R205", "c": "resume2", "t": "예상", "sec": 60, "q": "AI에게 질문하기 전에 문제를 어떻게 정의합니까?", "why": ["채용 설명회에서 LLM 활용 능숙도가 아니라 \"과제를 어떻게 정의하고 해결하는지\"를 본다고 했습니다. 문제해결 PT의 평가 포인트와 같습니다."], "p": ["현상 / 바뀐 것 / 제약 세 가지를 먼저 적는다", "Curl 사례에 대입", "문제 정의가 질문을 바꾼다"], "m": "세 가지를 먼저 적습니다. **현상**을 숫자와 조건으로 적고, **바뀐 것**을 적고, 동시에 만족해야 하는 **제약**을 적습니다.\n\nCurl 문제에서는 '신규 소재 적용과 폭 축소 이후, 같은 가압 조건에서 Curl 증가, 단 합제 밀도는 유지해야 함'이 문제 정의였습니다.\n\n이렇게 적고 나면 AI에게 던질 질문이 '왜 Curl이 생기나요'가 아니라 **'이 조건 변화가 변형 에너지의 방향을 어떻게 바꾸는가'**로 구체화됩니다. **문제 정의가 흐리면 AI의 답도 일반론에 그친다**는 것을 경험으로 배웠습니다.", "k": [["현상", "현상|숫자|조건"], ["변화점", "바뀐|변화|변경"], ["제약", "제약|동시에|유지"], ["사례", "curl|컬|폭|밀도"], ["교훈", "일반론|구체화|문제 정의"]], "f": [["문제 정의가 틀렸다는 것은 어떻게 알아챕니까?", "검증 결과가 가설과 계속 어긋날 때 → 정의 단계로 돌아간다."]], "s": ["half1"]}, {"id": "R206", "c": "resume2", "t": "예상", "sec": 45, "q": "어떤 AI 도구를 썼고, 왜 그것을 골랐습니까?", "why": ["도구 이름 자체보다 선택 기준과 한계 인식을 봅니다."], "p": ["도구 이름과 사내/외부 구분 (사실대로)", "고른 이유", "한 도구만 믿지 않았다는 점"], "m": "[직접 채울 것: 실제로 사용한 도구 이름과 사내·외부 구분]을 사용했습니다. 고른 이유는 [직접 채울 것: 실제 이유 — 예: 회사에서 허용한 도구였다, 긴 조건을 주고 추론시키기에 적합했다]입니다.\n\n도구 자체보다 중요한 것은 **질문의 조건을 구체화하는 것**과 **답을 검증하는 절차**였습니다. 그래서 한 도구의 답만 믿지 않고 [직접 채울 것: 교차 확인 방법 — 다른 도구, 문헌, 선배 의견 등]으로 대조했습니다.", "k": [["도구", "도구|사용|모델"], ["이유", "이유|허용|적합"], ["검증", "검증|대조|교차|확인"]], "f": [["그 도구의 약점은 무엇이라고 느꼈습니까?", "최신·사내 고유 조건을 모른다, 근거 없이 단정한다 등 실제 체감."]], "tip": "답이 전부 본인 사실로 채워져야 하는 문항입니다. 미리 두 문장으로 써 두세요.", "s": ["app"]}, {"id": "R207", "c": "resume2", "t": "지원서", "sec": 60, "q": "매주 AI와 공정 고찰을 했다고 했습니다. 그것이 실제 성과로 이어졌다는 근거가 있습니까?", "why": ["'지속적 활용'이라는 주장에 대한 검증입니다. 활동이 아니라 결과를 묻습니다."], "p": ["달라진 것: 문제 접근 순서", "실제 조건 변경으로 이어진 사례 하나 ← 준비 필요", "정량화하지 못한 부분은 인정"], "m": "가장 분명한 변화는 **문제에 접근하는 순서**입니다. 이전에는 조건을 바꿔 가며 결과를 보는 시행착오가 많았는데, 지금은 **가설 설정 → 메커니즘 검증 → 범위를 좁힌 실험 설계 → 최적화** 순서로 진행합니다. 그 결과 [직접 채울 것: 실험 횟수나 기간이 줄어든 사례를 상대값으로]였습니다.\n\n다룬 주제는 반송 장력, EPC 정렬 민감도, 유도가열 열처리, 수분과 보이드에 의한 단락 메커니즘 등이었고, 그중 [직접 채울 것: 실제 공정 조건 변경으로 이어진 것 한 가지]로 이어졌습니다.\n\n다만 **'실험 비용 절감'을 금액으로 산정하지는 못했습니다**. 그 점은 지원서 표현이 정량적이지 못했다고 생각합니다.", "k": [["변화", "순서|가설|검증|최적화"], ["사례", "장력|EPC|열처리|수분|보이드"], ["결과", "줄|단축|이어졌"], ["인정", "산정하지 못|정량|표현"]], "f": [["매주 했다는 기록이 남아 있습니까?", "사실대로. 노트나 정리 문서가 있으면 있다고."]], "s": ["app"]}, {"id": "R208", "c": "resume2", "t": "예상", "sec": 90, "q": "입사 후 PKG개발 업무에서 AI를 어떻게 쓰겠습니까? 쓰면 안 되는 경우는 언제입니까?", "why": ["지원서 마지막 단락(입사 후 AI 활용 계획)에 대한 질문입니다. 계획과 함께 '선'을 아는지 봅니다."], "p": ["쓰는 곳 3가지: 가설 확장 / 데이터 정리·분석 / 학습", "쓰면 안 되는 경우 2가지", "최종 근거는 데이터"], "m": "세 가지로 쓰겠습니다. 첫째 **가설 확장**입니다. Void나 Warpage 같은 불량에서 소재, 구조, 공정 요인을 빠짐없이 펼쳐 보는 데 씁니다. 둘째 **데이터 정리와 분석**입니다. 채용 설명회에서 현직자분들도 AI를 데이터 정리와 분석에 많이 쓴다고 소개한 것으로 알고 있습니다. 셋째 **학습 속도**입니다. 처음 접하는 설비, 소재, 규격을 빠르게 파악하는 데 쓰겠습니다.\n\n쓰면 안 되는 경우도 분명합니다. **보안 정책이 허용하지 않는 도구에 회사 데이터를 넣는 것**, 그리고 **검증하지 않은 AI의 답을 근거로 공정 조건을 바꾸는 것**입니다.\n\n최종 판단의 근거는 항상 **데이터와 실험**이어야 한다고 생각합니다.", "k": [["가설 확장", "가설|펼쳐|요인"], ["데이터", "데이터|분석|정리"], ["학습", "학습|파악|배우"], ["금지선", "보안|검증하지 않|안 되는"], ["원칙", "실험|근거|판단"]], "f": [["지원서에 \"개발 속도를 비약적으로 높일 것\"이라고 썼습니다. 근거가 있습니까?", "\"표현이 과했습니다\" + 현 직장에서 줄어든 시행착오 사례로 한정해서 답하기."]], "s": ["half1", "app"]}, {"id": "R209", "c": "resume2", "t": "예상", "sec": 60, "q": "면접장에서 LLM을 써서 과제를 푼다면, 어떤 순서로 쓰겠습니까?", "why": ["문제해결 PT 직후 심층 인터뷰에서 \"AI를 어떻게 썼느냐\"를 물을 수 있습니다. 과정 설명을 미리 준비해 두면 PT 발표에도 그대로 쓸 수 있습니다."], "p": ["먼저 혼자 생각을 적는다", "AI에게는 빠진 가설과 논리의 약점을 묻는다", "주어진 자료와 대조해 설명 가능한 것만 남긴다", "결론 → 근거 → 검증 계획 → 리스크로 정리"], "m": "먼저 **AI 없이 제 생각을 적겠습니다**. 문제를 한 문장으로 정의하고, 제가 아는 범위에서 원인 가설과 우선순위를 씁니다.\n\n그다음 AI에게는 **제가 놓친 가설이 있는지, 제 논리의 약점이 무엇인지**를 묻겠습니다. 받은 답은 과제에 주어진 자료와 맞는지 확인하고, **제가 근거를 설명할 수 있는 것만** 남기겠습니다.\n\n마지막으로 **결론, 근거, 검증 계획, 리스크** 순서로 정리하겠습니다. 채용 설명회에서도 LLM을 얼마나 능숙하게 쓰는지가 아니라 **과제를 어떻게 정의하고 해결하는지**를 본다고 한 것으로 알고 있어서, 제 판단이 드러나게 쓰는 데 집중하겠습니다.", "k": [["선 사고", "AI 없이|먼저|제 생각"], ["AI 활용", "놓친|약점|가설"], ["검증", "자료|확인|근거|설명할 수"], ["구조", "결론|검증 계획|리스크"], ["평가 이해", "정의|해결|판단"]], "f": [["AI가 준 답과 본인 생각이 다르면 어느 쪽을 따르겠습니까?", "주어진 자료로 판단. 판단할 근거가 없으면 두 안을 모두 제시하고 검증 방법을 붙인다."]], "s": ["half1", "press"]}, {"id": "P01", "c": "pkg", "t": "단골", "sec": 60, "q": "반도체 패키지의 역할은 무엇입니까?", "why": ["현직자가 꼽은 PKG 단골 질문입니다. A!SK에서도 \"직무기술서 수준의 개념\"을 묻는다는 후기가 있습니다."], "p": ["네 가지: 기계적 보호 / 전기적 연결 / 기계적 연결 / 열 방출", "최근에는 성능 자체를 결정"], "m": "패키지의 역할은 네 가지로 정리할 수 있습니다.\n\n첫째 **기계적 보호**입니다. 깨지기 쉬운 실리콘 칩을 EMC 같은 재료로 감싸 외부 충격과 습기, 오염에서 지킵니다. 둘째 **전기적 연결**입니다. 칩의 미세한 패드를 범프나 와이어, 기판 배선을 통해 시스템에 연결하고 전원을 공급합니다. 셋째 **기계적 연결**로, 칩을 기판이나 보드에 안정적으로 고정합니다. 넷째 **열 방출**입니다. 동작 중 생기는 열을 밖으로 빼 줍니다.\n\n최근에는 여기에 더해 패키지가 **성능 자체를 결정하는 역할**로 커졌다고 생각합니다. HBM처럼 칩을 수직으로 쌓아 TSV로 연결하면 미세화 없이도 용량과 대역폭을 높일 수 있기 때문입니다.", "k": [["보호", "보호|충격|습기"], ["전기적 연결", "전기|연결|범프|와이어|전원"], ["기계적 연결", "고정|기계적 연결|지지"], ["열 방출", "열|방열|방출"], ["최근 역할", "성능|HBM|TSV|적층"]], "f": [["네 가지 중 HBM에서 가장 어려워진 것은 무엇입니까?", "열 방출. 적층으로 열이 빠져나갈 길이 길어짐."]], "s": ["col", "comm"]}, {"id": "P02", "c": "pkg", "t": "단골", "sec": 90, "q": "패키지 공정의 순서를 설명해 보세요.", "why": ["\"패키징 공정이란?\"은 현직자가 꼽은 단골 질문입니다. 순서를 외우는 것보다 각 단계가 왜 있는지를 한마디씩 붙일 수 있어야 합니다."], "p": ["컨벤셔널: 백 그라인딩 → 절단 → 다이 어태치 → 인터커넥션 → 몰딩 → 마킹 → 솔더 볼 → 싱귤레이션", "TSV 제품은 흐름이 다름", "본인 관심 공정으로 마무리"], "m": "서브스트레이트 타입의 컨벤셔널 패키지를 기준으로 말씀드리겠습니다.\n\n먼저 웨이퍼 뒷면을 갈아 두께를 맞추는 **백 그라인딩**, 칩 단위로 자르는 **웨이퍼 절단**, 양품 칩을 기판에 붙이는 **다이 어태치**를 합니다. 다음으로 칩과 기판을 전기적으로 잇는 **인터커넥션**, 즉 와이어 본딩이나 플립 칩 본딩을 하고, EMC로 감싸는 **몰딩**을 합니다. 이후 **마킹**, **솔더 볼 마운팅**, 개별 패키지로 자르는 **싱귤레이션**을 거쳐 패키지 테스트로 넘어갑니다.\n\nHBM 같은 TSV 제품은 흐름이 다릅니다. 웨이퍼 상태에서 TSV와 범프를 만들고, 캐리어에 임시로 붙인 뒤 뒷면을 갈아 TSV를 노출시키고, **칩을 쌓은 다음 몰딩**합니다.\n\n제가 관심 있는 것은 이 가운데 **적층 이후 갭을 채우는 몰딩 공정**입니다.", "k": [["앞 단계", "백 그라인딩|그라인딩|절단|다이싱|소우"], ["접합", "다이 어태치|와이어|플립|인터커넥션|본딩"], ["몰딩", "몰딩|EMC"], ["뒤 단계", "마킹|솔더 볼|싱귤레이션"], ["TSV 흐름", "TSV|적층|캐리어|쌓"]], "f": [["백 그라인딩을 하면 왜 웨이퍼가 휩니까?", "연마 후 잔류 응력. 얇을수록 심해져서 테이프와 링 프레임으로 잡아 준다."], ["컨벤셔널 패키지와 웨이퍼 레벨 패키지의 차이는 무엇입니까?", "칩으로 먼저 자른 뒤 패키징 vs 웨이퍼 상태에서 공정을 진행한 뒤 절단."]], "s": ["col6", "col8"]}, {"id": "P03", "c": "pkg", "t": "단골", "sec": 120, "q": "EMC는 무엇으로 이루어져 있고, 조성에 따라 특성이 어떻게 달라집니까?", "why": ["현직자가 꼽은 단골 질문이면서, 화학·고분자 전공과 지원서 내용에 가장 가까운 질문입니다. 여기서 강점을 보여 줘야 합니다."], "p": ["구성: 열경화성 에폭시 수지 + 실리카 필러 + 경화제·첨가제", "필러 함량↑ → CTE↓, 흡습↓, 방열↑ / 점도↑, 충진성↓", "필러 크기·형상", "수지·경화제 → Tg, 탄성률, 경화 속도, 접착력", "결론: 균형 잡기"], "m": "EMC는 **열경화성 에폭시 수지**에 **무기 필러인 실리카**를 섞고 경화제와 첨가제를 더한 복합 재료입니다. 열을 받으면 수지가 3차원 그물 구조로 가교되어 굳습니다.\n\n조성에서 가장 큰 변수는 **필러**입니다. 실리카는 열팽창계수가 낮아서 **필러 함량을 높이면 EMC의 CTE가 실리콘 칩에 가까워져 휨과 응력이 줄고**, 흡습도 줄어듭니다. 열전도가 높은 필러를 쓰면 방열도 좋아집니다. 반대로 **점도가 올라가 유동성이 떨어지기 때문에** 좁은 틈을 채우기 어려워지고 Void 위험이 커집니다. 그래서 **필러의 함량, 크기 분포, 형상**을 함께 설계합니다.\n\n수지와 경화제는 **유리전이온도(Tg), 탄성률, 경화 속도, 접착력**을 좌우합니다. Tg를 넘으면 열팽창이 크게 늘기 때문에 Tg 설계도 휨에 직접 영향을 줍니다.\n\n결국 EMC 설계는 **충진성, 휨, 방열, 신뢰성 사이의 균형 잡기**라고 이해하고 있습니다.", "k": [["구성", "에폭시|수지|레진"], ["필러", "필러|실리카|filler"], ["경화", "경화|가교|열경화"], ["CTE·휨", "CTE|열팽창|휨|warpage"], ["유동성", "점도|유동|충진"], ["Tg·탄성률", "Tg|유리전이|탄성률|모듈러스"]], "f": [["그러면 필러 함량을 계속 올리면 되지 않습니까? 왜 한계가 있습니까?", "점도 급상승 → 충진 불량·Void, 탄성률 상승 → 응력 증가 가능."], ["큰 입자와 작은 입자를 섞어 쓰는 이유는 무엇입니까?", "큰 입자 사이를 작은 입자가 메워 충진 밀도를 높이면서 점도 상승을 억제. 좁은 갭에는 최대 입경 제한이 필요."], ["배터리 합제의 입자와 EMC의 필러는 어떻게 다릅니까?", "본인 경험과 연결. 차이(EMC는 수지가 녹아 흐르고 굳는다)를 먼저 말하기."]], "s": ["col9", "gen"]}, {"id": "P04", "c": "pkg", "t": "단골", "sec": 90, "q": "트랜스퍼 몰딩과 컴프레션 몰딩의 차이는 무엇입니까? 왜 컴프레션 방식이 늘고 있습니까?", "why": ["지원서에 Compression Molding을 여러 번 썼기 때문에 거의 확실히 나옵니다. 지원서에서는 '면 전체 수직 가압'으로만 설명했는데, 핵심 차이는 'EMC가 흐르는 거리'입니다."], "p": ["트랜스퍼: 녹여서 금형으로 흘려보냄", "컴프레션: 금형에 미리 넣고 그 자리에서 눌러 성형", "차이의 핵심: 흐르는 거리", "추세: 얇게, 높게 쌓고, 크게"], "m": "**트랜스퍼 몰딩**은 EMC 태블릿을 가열·가압해 녹인 뒤, 통로를 따라 금형 안으로 **흘려보내 채우는** 방식입니다. 오래 써 온 방식이지만 EMC가 먼 거리를 흐르기 때문에, 칩과 패키지 윗면 사이 간격이 좁아지거나 기판이 커지면 **충진이 어려워집니다**.\n\n**컴프레션 몰딩**은 금형에 가루나 과립, 액상 EMC를 **미리 넣어 녹인 뒤 그 자리에서 눌러 성형**합니다. **EMC가 흐르는 거리가 짧아서** 얇은 패키지, 고적층, 대형 기판이나 웨이퍼 몰딩에서도 충진이 안정적이고, 유동 때문에 생기는 와이어 쓸림이나 Void가 줄어듭니다.\n\n적층 수는 늘고 패키지는 얇아지며 기판은 커지는 추세라서 컴프레션 방식의 비중이 커지고 있다고 이해하고 있습니다. 대신 **EMC 투입량과 두께 균일도, 진공 조건**의 관리가 중요해진다고 생각합니다.", "k": [["트랜스퍼", "트랜스퍼|태블릿|흘려|통로"], ["컴프레션", "컴프레션|압축|미리|눌러"], ["핵심 차이", "거리|유동|흐르"], ["적용", "얇|적층|대형|웨이퍼"], ["관리 항목", "투입량|두께|균일|진공"]], "f": [["컴프레션 몰딩의 단점이나 어려운 점은 무엇입니까?", "투입량 편차가 곧 두께 편차, 진공·이형 필름 관리 등. 공개 자료에서 확인한 범위까지만, 나머지는 \"배우겠다\"."], ["EMC의 형태(태블릿·과립·액상·필름)는 어떻게 구분해 씁니까?", "태블릿 = 트랜스퍼, 가루·과립 = 압축·대형 웨이퍼 몰딩, 액상 = 성형이 어려운 웨이퍼 몰딩, 필름 = 팬아웃·대면적."]], "s": ["col6", "col9", "seal"]}, {"id": "P05", "c": "pkg", "t": "단골", "sec": 120, "q": "MR-MUF와 TC-NCF를 비교해서 설명해 보세요.", "why": ["SK하이닉스 HBM 경쟁력의 핵심 공정입니다. PKG개발 지원자라면 반드시 준비해야 하고, 현직자도 단골로 꼽았습니다."], "p": ["TC-NCF: 필름 + 한 장씩 열압착", "MR-MUF: 한 번에 리플로우 + 액상 EMC 충진", "장단점: 생산성·방열 / 휨·갭 충진", "어드밴스드 MR-MUF"], "m": "둘 다 TSV로 쌓은 칩 사이를 접합하고 채우는 방식입니다.\n\n**TC-NCF**는 칩 사이에 비전도성 필름을 미리 붙이고, 칩을 한 장씩 **열과 압력으로 눌러** 범프 접합과 갭 충진을 동시에 합니다. 휜 칩도 눌러서 붙일 수 있지만, 한 장씩 가압하기 때문에 **생산성이 낮고** 필름 재료의 열전도가 상대적으로 낮습니다.\n\n**MR-MUF**는 칩을 쌓은 뒤 **매스 리플로우로 범프를 한 번에 접합**하고, 칩 사이에 **액상 EMC를 넣어 굳힙니다**. 한 번에 처리해서 **생산성이 높고**, **방열에 유리**합니다. 대신 누르는 힘이 약해서 **얇은 칩의 휨 제어**가 어렵고, 좁은 갭을 **Void 없이 채우는 것**이 과제입니다.\n\nSK하이닉스는 12단 HBM3에서 휨 제어 기술과 신규 EMC를 적용한 **어드밴스드 MR-MUF**로 이 한계를 넘었고, 당시 뉴스룸에서 생산성 약 3배, 열 방출 약 2.5배 향상을 밝힌 것으로 알고 있습니다.", "k": [["TC-NCF", "NCF|필름|열압착|TC"], ["MR-MUF", "MR-MUF|리플로우|액상|MUF"], ["생산성", "생산성|한 번에|한 장씩"], ["방열", "방열|열전도|열 방출"], ["과제", "휨|갭|void|보이드"], ["어드밴스드", "어드밴스드|advanced|12단|신규 EMC"]], "f": [["경쟁사는 왜 TC-NCF를 씁니까?", "얇은 칩을 눌러 휨을 잡기 쉽고 미세 피치에 유리하다는 장점. 타사 비하 금지, 장단점으로만."], ["MR-MUF에서 Void가 생기면 어떤 문제가 됩니까?", "방열 경로 차단, 범프 주변 지지 부족 → 신뢰성(TC) 불량, 흡습 경로."], ["16단, 20단으로 가면 MR-MUF로 계속 갈 수 있습니까?", "칩이 더 얇아져 휨·갭 충진이 더 어려워짐 → 고도화와 하이브리드 본딩 병행. 단정하지 말고 \"공개 발표 기준으로는\"."]], "s": ["hbm3", "col10", "col8"]}, {"id": "P06", "c": "pkg", "t": "단골", "sec": 90, "q": "하이브리드 본딩은 무엇이고, 왜 필요하며, 무엇이 어렵습니까?", "why": ["최근 트렌드 질문의 단골 소재입니다. 장점만 말하지 말고 어려운 점과 도입 시점에 대한 균형 잡힌 시각을 보여 주세요."], "p": ["정의: 범프 없이 구리-구리 직접 접합", "장점: 두께, 피치, 열저항", "어려움: 평탄도, 파티클, 정렬, 수율", "전망: 단계적 도입"], "m": "하이브리드 본딩은 **범프 없이 구리와 구리, 절연막과 절연막을 직접 붙이는** 접합 방식입니다. 범프와 그 사이를 채우는 재료가 없어지기 때문에 **같은 높이에 더 많이 쌓거나 칩을 더 두껍게 가져갈 수 있고**, 연결 간격을 더 좁힐 수 있으며, **열저항도 줄어듭니다**.\n\n어려운 점은 **표면 품질**입니다. 접합면이 매우 평탄해야 해서 CMP를 정밀하게 제어해야 하고, **미세 파티클 하나가 접합 Void**가 되기 때문에 전공정 수준의 청정도가 필요합니다. 정렬 정밀도와 수율, 장비 투자 부담도 큽니다.\n\n그래서 MR-MUF를 한 번에 대체하기보다 **적층 단수와 두께 요구가 한계에 이르는 세대부터 단계적으로 도입**될 것으로 이해하고 있습니다. SK하이닉스도 올해 학회에서 MR-MUF 대비 **열저항을 약 35% 낮출 수 있다**고 발표한 것으로 알고 있습니다.", "k": [["정의", "범프 없이|직접|구리|Cu"], ["장점", "두께|간격|피치|열저항|적층"], ["어려움", "평탄|CMP|파티클|청정|정렬"], ["수율·비용", "수율|투자|장비"], ["전망", "단계적|도입|병행"]], "f": [["하이브리드 본딩이 도입되면 몰딩 공정은 없어집니까?", "칩 사이 갭 충진은 줄어도 적층체 보호와 휨 제어를 위한 몰딩·봉지 과제는 남는다고 본다. 단정 금지."], ["그러면 본인이 지원한 몰딩 쪽 역량은 쓸모가 줄어드는 것 아닙니까?", "소재-공정 상호작용을 보는 역량은 접합 방식이 바뀌어도 필요. 새 방식의 응력·휨 문제로 옮겨 간다."]], "s": ["hotchips", "gen"]}, {"id": "P07", "c": "pkg", "t": "단골", "sec": 60, "q": "TSV에 구리(Cu)를 쓰는 이유는 무엇입니까?", "why": ["현직자가 꼽은 단골 질문입니다. 장점 세 가지와 주의할 점까지 말하면 좋은 답입니다."], "p": ["낮은 저항 / 성숙한 도금 공정 / 높은 열전도", "주의: 확산 방지막, 열팽창 차이"], "m": "세 가지 이유로 이해하고 있습니다. 첫째 **전기 저항이 낮아서** 고속 신호와 전력 전달에 유리합니다. 둘째 **전해 도금으로 깊고 좁은 구멍을 채우는 공정**이 배선 공정에서 이미 성숙해 있습니다. 셋째 **열전도가 높아서** 적층 구조에서 열을 수직으로 빼는 통로 역할도 합니다.\n\n대신 주의할 점이 있습니다. 구리가 실리콘으로 퍼지면 소자를 오염시키기 때문에 **절연막과 배리어 금속**을 먼저 깔아야 합니다. 또 구리와 실리콘의 **열팽창 차이** 때문에 열을 받으면 주변 실리콘에 응력이 생길 수 있습니다.", "k": [["저항", "저항|전도"], ["도금", "도금|채우|성숙"], ["열전도", "열전도|열을"], ["확산 방지", "절연막|배리어|확산|오염"], ["응력", "열팽창|응력"]], "f": [["TSV를 만드는 순서를 간단히 말해 보세요.", "식각 → 절연막 → 배리어·시드 → 구리 도금 → CMP."]], "s": ["col8", "comm"]}, {"id": "P08", "c": "pkg", "t": "단골", "sec": 90, "q": "TSV 적층 공정의 전체 흐름을 설명해 보세요.", "why": ["HBM 제조의 뼈대입니다. 어느 단계에서 어떤 불량이 생기는지까지 연결하면 '통합 엔지니어' 관점을 보여 줄 수 있습니다."], "p": ["비아 형성 → 도금 → 앞면 범프 → 임시 본딩 → 뒷면 연마·TSV 노출 → 뒷면 범프 → 디본딩 → 적층 → 몰딩", "단계별 과제: 휨, 핸들링, 접합, 갭 충진", "KGSD"], "m": "비아 미들 방식을 기준으로 말씀드리겠습니다.\n\n전공정에서 트랜지스터를 만든 뒤 실리콘에 **깊은 구멍을 식각**하고, **절연막과 배리어·시드층**을 입힌 다음 **구리를 도금**해 채우고 CMP로 평탄화합니다. 배선 공정을 마친 웨이퍼 앞면에 **범프**를 만들고, 웨이퍼를 **캐리어에 임시로 붙인** 뒤 뒷면을 갈아 **TSV를 노출**시킵니다. 뒷면에도 범프를 만들고 캐리어를 떼어 낸 다음, 칩을 **적층·접합**하고 마지막으로 **몰딩**합니다.\n\n이 가운데 얇아진 웨이퍼의 **휨과 핸들링**, 캐리어를 떼어 낼 때의 손상, 적층할 때의 **범프 접합 불량**, 몰딩할 때의 **갭 충진**이 주요 과제라고 이해하고 있습니다.\n\n이렇게 쌓아서 테스트까지 마친 양품 적층 칩을 **KGSD**라고 부르고, HBM이 대표적인 예입니다.", "k": [["비아 형성", "식각|구멍|비아"], ["도금", "구리|도금|CMP"], ["임시 본딩", "캐리어|임시|디본딩"], ["TSV 노출", "뒷면|노출|연마|그라인딩"], ["적층·몰딩", "적층|접합|몰딩"], ["과제", "휨|핸들링|충진|KGSD"]], "f": [["왜 캐리어에 붙여서 공정을 진행합니까?", "얇아진 웨이퍼가 휘거나 깨지는 것을 막고, 웨이퍼용 장비를 그대로 쓰기 위해."], ["칩-칩, 칩-웨이퍼, 웨이퍼-웨이퍼 적층의 차이는 무엇입니까?", "웨이퍼-웨이퍼는 생산성이 높지만 같은 위치에 불량 칩이 하나라도 있으면 전체가 불량."]], "s": ["col8"]}, {"id": "P09", "c": "pkg", "t": "단골", "sec": 120, "q": "Warpage(휨)는 왜 생기고, 어떻게 줄입니까?", "why": ["지원서에 Warpage를 여러 번 썼습니다. 현직자도 \"기계적 응력 저감 방법\"을 단골로 꼽았습니다. 원인 → 대책을 소재·구조·공정으로 나눠 말하면 구조가 잡힙니다."], "p": ["원인 1: 재료 간 CTE 차이 (고온 성형 후 냉각)", "원인 2: EMC 경화 수축", "얇고 넓을수록 심해짐", "대책: 소재 / 구조 / 공정", "온도에 따라 방향이 바뀜 → 온도별 측정"], "m": "휨의 근본 원인은 **재료 간 열팽창계수(CTE) 차이**입니다. 실리콘은 열팽창이 작고 EMC와 기판은 그보다 큽니다. 몰딩은 고온에서 이뤄지기 때문에 상온으로 식는 동안 재료마다 줄어드는 양이 달라서 한쪽으로 휩니다. 여기에 EMC가 굳으면서 부피가 줄어드는 **경화 수축**이 더해집니다. 칩이 얇아지고 면적이 커질수록 휨은 커집니다.\n\n줄이는 방법은 세 갈래입니다. **소재**에서는 필러 함량과 Tg, 탄성률을 조절해 CTE 차이와 수축을 줄입니다. **구조**에서는 칩, 몰드, 기판의 두께 비율과 구리 분포를 조정해 위아래 균형을 맞춥니다. **공정**에서는 몰딩 온도와 경화 프로파일, 후경화 조건, 냉각 속도를 최적화합니다.\n\n중요한 점은 휨이 **온도에 따라 방향까지 바뀔 수 있다**는 것입니다. 그래서 상온뿐 아니라 리플로우 온도에서의 휨도 함께 봐야 하고, 시뮬레이션으로 예측한 뒤 실측으로 맞춰 가는 방식이 필요하다고 생각합니다.", "k": [["CTE 차이", "CTE|열팽창"], ["경화 수축", "수축|경화"], ["소재 대책", "필러|Tg|탄성률|소재"], ["구조 대책", "두께|구조|균형|구리"], ["공정 대책", "온도|프로파일|후경화|PMC|냉각"], ["온도 의존", "리플로우|온도에 따라|방향|시뮬레이션"]], "f": [["본인 경험의 Curl과 패키지의 Warpage는 메커니즘이 같습니까?", "닮은 점: 층 사이 변형량이 달라서 휜다. 다른 점: Curl은 가압으로 생긴 소성 변형, Warpage는 열 수축과 경화 수축의 차이."], ["휨이 크면 어떤 불량으로 이어집니까?", "범프 접합 불량, 진공 흡착·이송 문제, 칩 크랙, 솔더 볼 접합 불량."], ["소재를 바꿀 수 없다면 공정만으로 무엇을 해 보겠습니까?", "경화 온도·시간, 냉각 속도, 후경화 조건, 지그 사용. 효과와 한계를 함께."]], "s": ["gen", "col6", "app"]}, {"id": "P10", "c": "pkg", "t": "단골", "sec": 90, "q": "몰딩 공정에서 Void는 왜 생기고, 어떻게 줄입니까?", "why": ["지원서에서 입사 후 해결하겠다고 쓴 첫 번째 문제(EMC Void)입니다. 원인을 경로별로 나누고, 원인마다 대책을 짝지어 말하세요."], "p": ["원인 3경로: 공기 포집 / 충진 미완 / 가스 발생", "대책: 진공 / 프로파일 / 소재 선택 / 건조", "검출: 초음파·X-ray·단면", "본인 경험 연결"], "m": "Void가 생기는 경로는 크게 세 가지로 이해하고 있습니다. 첫째 **공기 포집**입니다. EMC가 흐르는 앞부분이 여러 방향에서 만나거나, 넓은 곳과 좁은 틈의 속도 차이로 좁은 쪽에 공기가 갇힙니다. 둘째 **충진 미완**입니다. 점도가 높거나, 다 채우기 전에 경화가 진행되거나, 필러 입자가 갭에 비해 크면 틈이 남습니다. 셋째 **가스 발생**입니다. 재료가 머금은 수분이나 휘발 성분이 고온에서 기화합니다.\n\n대책은 원인별로 다릅니다. **진공도를 높여** 공기를 미리 빼고, **온도·압력·속도 프로파일**을 조정해 경화 전에 충진이 끝나게 하고, **필러 크기와 점도**가 갭에 맞는 EMC를 고르고, 자재를 **미리 건조**합니다. 검출은 **초음파 검사나 X-ray** 같은 비파괴 검사와 단면 분석으로 한다고 알고 있습니다.\n\n현 직장에서 다룬 **미세 보이드와 수분 관리** 경험이 원인 경로를 추적하는 데 도움이 될 것이라고 생각합니다.", "k": [["공기 포집", "공기|갇|포집|속도 차이"], ["충진 미완", "점도|충진|경화|필러"], ["가스", "수분|휘발|기화|가스"], ["대책", "진공|프로파일|건조"], ["검출", "초음파|SAT|X-ray|엑스레이|단면"], ["경험 연결", "보이드|수분 관리|경험"]], "f": [["Void가 칩 사이 갭에 있을 때와 패키지 바깥쪽에 있을 때, 무엇이 더 위험합니까?", "갭 내부: 방열 경로 차단과 범프 지지 부족으로 신뢰성 문제. 근거와 함께 본인 판단을 말하기."], ["Void 불량률이 갑자기 올랐다면 무엇부터 확인하겠습니까?", "바뀐 것부터: 자재 로트, 보관·건조 이력, 진공도, 금형 온도."]], "s": ["gen", "app"]}, {"id": "P11", "c": "pkg", "t": "단골", "sec": 90, "q": "패키지에서 열 관리는 왜 중요하고, 어떤 방법이 있습니까?", "why": ["현직자가 꼽은 단골(열저항 저감, 패키지 열관리)입니다. HBM은 적층 구조라 방열이 곧 제품 경쟁력입니다."], "p": ["왜: 성능·수명·신뢰성, 적층이라 열이 빠져나갈 길이 김", "방법: 열이 지나가는 길의 저항을 줄인다", "재료 열전도 / 수직 통로 / 두께 / 패키지 밖", "방열·충진성·휨이 얽혀 있음"], "m": "칩 온도가 오르면 **성능과 수명, 신뢰성**이 모두 나빠집니다. 특히 HBM은 칩을 여러 장 쌓기 때문에 **가운데 층의 열이 빠져나갈 길이 길고**, 바로 옆 GPU의 열도 받습니다. 적층 수가 늘수록 방열이 제품 경쟁력을 결정합니다.\n\n방법은 **열이 지나가는 길의 저항을 줄이는 것**입니다. 칩 사이를 채우는 재료의 **열전도를 높이고**, 열이 수직으로 지나갈 **금속 통로를 늘리고**, 칩 사이 간격과 접합층 두께를 줄입니다. 패키지 밖으로는 **히트 스프레더**로 열을 넓게 퍼뜨려 냉각 장치로 넘깁니다.\n\n다만 방열을 위해 필러를 늘리면 점도가 올라 충진이 어려워지는 것처럼, **방열과 충진성과 휨이 서로 얽혀 있어서** 하나만 최적화할 수 없다는 점이 핵심이라고 생각합니다.", "k": [["중요성", "성능|수명|신뢰성|온도"], ["적층 구조", "적층|가운데|쌓"], ["재료", "열전도|필러|재료"], ["경로", "통로|범프|간격|두께|저항"], ["패키지 밖", "히트 스프레더|냉각|TIM"], ["트레이드오프", "얽혀|점도|충진|트레이드"]], "f": [["MR-MUF가 방열에 유리하다고 하는 이유는 무엇입니까?", "칩 사이를 채우는 EMC의 열전도가 필름 재료보다 높다고 알려져 있음. 12단 HBM3 기사에서는 방열성이 높은 신규 EMC 적용."], ["열전도가 높은 필러를 쓰면 생기는 부작용은 무엇입니까?", "점도 상승, 충진성 저하. 아는 범위까지만."]], "s": ["hbm3", "comm", "gen"]}, {"id": "P12", "c": "pkg", "t": "단골", "sec": 90, "q": "패키지 신뢰성 평가에는 어떤 것이 있습니까?", "why": ["현직자가 꼽은 단골(열순환·충격 등 신뢰성 테스트)입니다. 이름 나열보다 \"이 시험은 어떤 고장을 보려는 것인가\"를 붙여야 합니다."], "p": ["품질 vs 신뢰성", "가속 시험, JEDEC 기준", "환경: 프리컨디셔닝, TC, THB, HAST", "수명: HTOL / 기계: 낙하·진동·굽힘", "엔지니어의 일: 고장과 공정 요인을 연결"], "m": "먼저 **품질과 신뢰성을 구분**하겠습니다. 품질은 출하 시점에 기준을 만족하는지이고, 신뢰성은 그 품질이 **보증 기간 동안 유지되는지**입니다. 몇 년을 기다릴 수 없기 때문에 **가속 시험**으로 확인하고, JEDEC 규격을 기준으로 삼습니다.\n\n패키지와 관련된 환경 시험으로는, 실장 과정의 흡습과 리플로우 열을 모사하는 **프리컨디셔닝**을 전처리로 하고, 온도를 반복해서 올리고 내려 재료 간 열팽창 차이로 생기는 **박리와 크랙, 솔더 접합부 불량**을 보는 **TC**, 고온·고습에 전압까지 걸어 부식과 내습성을 보는 **THB와 HAST**가 있습니다. 수명 쪽으로는 고온에서 동작시키는 **HTOL**이 있고, 기계적으로는 **낙하, 진동, 굽힘** 시험이 있습니다.\n\n개발 엔지니어에게 중요한 것은 시험 이름보다 **'어떤 시험에서 어떤 고장이 났고, 그것이 어떤 공정·소재 요인과 연결되는가'**를 추적하는 것이라고 생각합니다.", "k": [["구분", "품질|신뢰성|유지"], ["가속·기준", "가속|JEDEC"], ["전처리", "프리컨디셔닝|흡습|리플로우"], ["온도 시험", "TC|thermal|열 사이클|온도 사이클"], ["습도 시험", "THB|HAST|고습|내습"], ["기타", "HTOL|낙하|진동|굽힘"]], "f": [["TC 시험에서 박리가 나왔다면 어떤 공정 요인을 의심하겠습니까?", "계면 접착(표면 오염·세정), EMC의 CTE·탄성률, 흡습 관리, 경화 조건."], ["HAST와 UHAST의 차이는 무엇입니까?", "전압(바이어스)을 거는지 여부. UHAST는 전압 없이 고온·고습."]], "s": ["col11"]}, {"id": "P13", "c": "pkg", "t": "단골", "sec": 90, "q": "최근 패키징 기술 트렌드를 설명해 보세요.", "why": ["현직자가 꼽은 단골입니다. 뉴스 나열이 아니라 \"그래서 PKG 엔지니어에게 어떤 과제가 생기는가\"로 끝나야 합니다."], "p": ["한 문장 요약", "수직 적층 고도화 (HBM4, 하이브리드 본딩)", "이종 집적 (2.5D, 커스텀 HBM)", "열·휨 한계 대응", "본인 강점과 연결"], "m": "한 문장으로 **'패키지가 성능을 만드는 시대'**라고 정리하겠습니다. 세 가지 흐름이 있습니다.\n\n첫째 **수직 적층의 고도화**입니다. HBM은 적층 단수가 계속 늘고 있고, HBM4에서는 입출력 수가 크게 늘면서 **베이스 다이에 로직 공정**이 적용됩니다. 접합은 MR-MUF를 고도화하면서 **하이브리드 본딩**을 준비하는 방향입니다.\n\n둘째 **이종 집적**입니다. 로직과 HBM을 인터포저 위에 나란히 올리는 **2.5D 패키지**가 AI 가속기의 표준이 됐고, 고객별로 설계를 달리하는 **커스텀 HBM**도 같은 흐름입니다.\n\n셋째 **열과 휨의 한계 대응**입니다. 칩은 얇아지고 발열은 늘어서 **고방열 소재, 휨 제어, 새로운 갭 충진 공정**이 핵심 과제가 됐습니다.\n\n세 가지 모두 **소재와 공정을 함께 봐야 풀리는 문제**라서, 제 경험을 살릴 수 있는 영역이라고 생각합니다.", "k": [["요약", "성능|시대"], ["적층", "HBM4|적층|하이브리드|베이스 다이"], ["이종 집적", "2.5D|인터포저|커스텀|이종"], ["열·휨", "방열|휨|갭"], ["연결", "소재와 공정|경험|영역"]], "f": [["그중 SK하이닉스에 가장 큰 위험이 될 변화는 무엇이라고 봅니까?", "본인 판단 + 근거. 예: 접합 방식 전환기에 기존 강점(MR-MUF)이 약해질 수 있음 → 두 방식을 함께 준비."], ["커스텀 HBM이 늘면 PKG개발의 일은 어떻게 달라집니까?", "고객별 요구(높이·열·범프 배치)에 맞춘 평가와 고객 대응이 늘어난다."]], "s": ["jobrep2", "hotchips", "col8"]}, {"id": "P14", "c": "pkg", "t": "기출", "sec": 90, "q": "HBM이 무엇인지 설명하고, SK하이닉스가 앞서 있다고 평가받는 이유를 말해 보세요.", "why": ["과거 후기에 \"HBM의 의미\"를 묻는 질문이 있습니다. 정의 → 왜 필요한가 → 왜 SK하이닉스인가 순서로."], "p": ["정의: TSV로 수직 연결해 대역폭을 높인 메모리", "AI에서 왜 필요한가", "앞선 이유 3가지", "남은 과제"], "m": "HBM은 High Bandwidth Memory, 즉 여러 장의 D램을 TSV로 수직 연결해서 **데이터가 오가는 통로 수를 크게 늘린 메모리**입니다. AI 가속기는 한 번에 많은 데이터를 주고받아야 해서 **대역폭과 전력 효율**이 중요하고, 그래서 GPU 바로 옆에 HBM을 붙여 씁니다.\n\nSK하이닉스가 앞선 이유로는 세 가지를 꼽겠습니다. 첫째 **MR-MUF**라는 패키징 선택입니다. 방열과 생산성에 유리한 방식을 일찍 양산에 적용하고 계속 고도화했습니다. 둘째 **주요 고객과 쌓은 양산 경험**입니다. 셋째 **전공정, 후공정, 설계가 맞물리는 협업**입니다. 12단 HBM3 개발 인터뷰에서도 소자, 설계, 패키지 기술이 함께 맞물린 결과라고 설명했습니다.\n\n다만 올해 경쟁사도 HBM4 양산 출하를 시작한 만큼, **HBM4 이후의 수율과 차세대 접합 기술**에서 격차를 유지하는 것이 과제라고 생각합니다.", "k": [["정의", "TSV|수직|대역폭|통로"], ["필요성", "AI|GPU|전력"], ["패키징 강점", "MR-MUF|방열|생산성"], ["경험·협업", "고객|양산|협업"], ["과제", "경쟁|HBM4|수율|격차"]], "f": [["HBM의 세대(HBM3E, HBM4)가 바뀌면 패키지에서 무엇이 달라집니까?", "입출력 수와 TSV 수 증가, 적층 단수 증가, 베이스 다이 변화 → 범프 미세화·휨·열 과제."], ["일반 D램과 비교해 HBM의 수율 관리가 어려운 이유는 무엇입니까?", "여러 장을 쌓기 때문에 한 장 또는 한 접합의 불량이 전체 불량이 된다(누적 수율)."]], "s": ["hbm3", "hbm4", "col8"]}, {"id": "P15", "c": "pkg", "t": "예상", "sec": 60, "q": "칩이 얇아지면 패키지 공정에서 어떤 문제가 생깁니까?", "why": ["적층 단수 증가의 직접적인 결과입니다. 휨 → 핸들링 → 접합으로 이어지는 연쇄를 말할 수 있어야 합니다."], "p": ["휨 / 깨짐·핸들링 / 접합 불량", "대응: 캐리어, 휨 제어", "12단 HBM3 사례"], "m": "세 가지 문제가 커집니다. 첫째 **휨**입니다. 얇을수록 연마 후 잔류 응력만으로도 웨이퍼와 칩이 휩니다. 둘째 **핸들링과 깨짐**입니다. 절단, 픽업, 적층 과정에서 가장자리가 깨지거나 크랙이 생기기 쉽습니다. 그래서 TSV 공정에서는 캐리어에 임시로 붙여 평탄하게 잡아 줍니다. 셋째 **접합 불량**입니다. 휜 칩을 쌓으면 범프 높이가 맞지 않아 접합이 안 될 수 있습니다.\n\n12단 HBM3에서 칩을 약 40% 얇게 만들면서 **휨 제어 기술**을 새로 적용했다는 뉴스룸 기사가 이 문제를 잘 보여 준다고 생각합니다.", "k": [["휨", "휨|warpage|잔류 응력"], ["깨짐", "깨|크랙|치핑|핸들링"], ["접합", "접합|범프"], ["대응", "캐리어|제어"], ["사례", "12단|40%|HBM3"]], "s": ["hbm3", "col6", "col8"], "f": []}, {"id": "P16", "c": "pkg", "t": "예상", "sec": 90, "q": "계면 박리(Delamination)는 왜 생기고, 어떻게 막습니까?", "why": ["지원서에서 입사 후 해결하겠다고 쓴 문제 중 하나이고, 본인 경험(계면 접착력 분석)과 가장 잘 이어지는 질문입니다."], "p": ["원리: 계면 응력 > 접착 강도", "응력 쪽 원인: CTE 차이", "접착 쪽 원인: 오염, 흡습", "대책 두 방향 + 검증", "본인 경험"], "m": "박리는 **계면에 걸리는 응력이 접착 강도를 넘을 때** 생깁니다.\n\n응력 쪽 원인은 재료 간 **CTE 차이**입니다. 온도가 오르내릴 때마다 계면에 응력이 반복됩니다. 접착 쪽 원인은 **표면 오염**과 **흡습**입니다. 수분이 계면에 모인 상태에서 리플로우 같은 고온을 만나면 계면이 벌어질 수 있습니다.\n\n대책도 두 방향입니다. **응력을 줄이려면** CTE와 탄성률이 맞는 소재를 고르고 구조에서 응력이 몰리는 곳을 줄입니다. **접착을 높이려면** 표면을 세정하고, 접착 특성이 맞는 소재를 쓰고, 자재를 건조·관리합니다. 검증은 프리컨디셔닝과 TC 이후 **초음파 검사**로 합니다.\n\n현 직장에서 **기재와 합제층의 계면 접착력이 변형에 미치는 영향**을 분석한 경험이 있어서, 계면 문제를 응력과 접착 두 축으로 보는 데 익숙합니다.", "k": [["원리", "응력|접착 강도|넘"], ["응력 원인", "CTE|열팽창|반복"], ["접착 원인", "오염|흡습|수분"], ["대책", "소재|세정|건조|표면"], ["검증", "초음파|TC|프리컨디셔닝"], ["경험", "계면 접착력|경험|합제"]], "f": [["계면 접착력은 어떻게 측정합니까?", "본인이 현 직장에서 쓴 방법을 사실대로. 패키지 쪽 방법은 모르면 \"입사 후 배우겠다\"."]], "s": ["col11", "app", "gen"]}, {"id": "P17", "c": "pkg", "t": "단골", "sec": 90, "q": "언더필의 종류(CUF, MUF, NCP, NCF)를 설명해 보세요.", "why": ["MR-MUF와 TC-NCF의 이름이 어디서 왔는지 이해하고 있는지 확인하는 질문입니다."], "p": ["언더필의 역할", "본딩 후 채움: CUF, MUF", "본딩 전 도포: NCP, NCF", "HBM의 두 방식과 연결"], "m": "언더필은 범프로 연결한 칩과 기판, 또는 칩과 칩 사이를 채워서 **접합부의 신뢰성을 높이는** 재료입니다. 플립 칩에서는 칩과 기판의 열팽창 차이 때문에 꼭 필요합니다.\n\n넣는 시점으로 나누면, **본딩 후에 채우는 방식**으로 모세관 현상을 이용해 옆에서 흘려 넣는 **CUF**와, 몰딩용 EMC가 언더필 기능까지 겸하는 **MUF**가 있습니다. **본딩 전에 미리 바르는 방식**으로는 페이스트 형태의 **NCP**와 필름 형태의 **NCF**가 있습니다.\n\nMUF는 언더필과 몰딩을 한 번에 해서 **공정이 단순**하지만 좁은 갭을 채우는 것이 과제이고, NCF는 접합과 충진을 동시에 하지만 **칩마다 열압착**이 필요합니다. HBM에서 MR-MUF와 TC-NCF가 갈리는 지점도 여기라고 이해하고 있습니다.", "k": [["역할", "접합부|신뢰성|열팽창|채워"], ["본딩 후", "CUF|모세관|MUF"], ["본딩 전", "NCP|NCF|필름|페이스트"], ["비교", "단순|열압착|갭"], ["연결", "MR-MUF|TC-NCF|HBM"]], "s": ["col10", "col6"], "f": []}, {"id": "P18", "c": "pkg", "t": "예상", "sec": 60, "q": "2.5D 패키지와 HBM의 관계를 설명해 보세요.", "why": ["PKG개발의 세 파트 중 하나가 고객 대응입니다. HBM이 고객 공정에 어떻게 들어가는지 알아야 합니다."], "p": ["2.5D: 인터포저 위에 로직과 HBM을 나란히", "HBM은 KGSD로 공급, 베이스 다이·미세 범프", "HBM 품질이 고객 수율에 영향"], "m": "2.5D 패키지는 **인터포저 위에 로직 칩과 HBM을 나란히 올리는** 구조입니다. 인터포저의 미세 배선이 GPU와 HBM을 짧고 촘촘하게 연결합니다.\n\n메모리 회사는 HBM을 **KGSD**, 즉 검증을 마친 적층 칩 상태로 공급합니다. 그래서 HBM은 일반 솔더 볼이 아니라 **미세 범프**를 갖고, 맨 아래 **베이스 다이가 인터포저의 범프 배치에 맞게 설계**됩니다.\n\n이 구조 때문에 HBM의 **휨, 높이, 범프 품질**은 고객 공정의 수율에 직접 영향을 줍니다. PKG개발이 고객 대응까지 맡는 이유라고 이해하고 있습니다.", "k": [["구조", "2.5D|인터포저|나란히"], ["공급 형태", "KGSD|적층 칩|검증"], ["설계", "베이스 다이|미세 범프"], ["고객 영향", "고객|수율|휨|높이"]], "s": ["col8", "jobrep2"], "f": []}, {"id": "P19", "c": "pkg", "t": "예상", "sec": 120, "q": "신규 EMC 소재를 평가해야 한다면, 어떤 순서로 무엇을 보겠습니까?", "why": ["문제해결 PT에 나올 법한 '평가 계획' 유형입니다. PKG소재·공정개발 업무의 축소판이라, 순서와 합격 기준이 들리는지를 봅니다."], "p": ["물성 확인 → 가설", "공정성 평가 (더미 자재, DOE)", "신뢰성 평가", "양산성 검토", "단계별 합격 기준을 미리 정함"], "m": "네 단계로 진행하겠습니다.\n\n첫째 **물성 확인**입니다. 점도와 경화 속도, 필러 함량과 최대 입경, CTE, Tg, 탄성률, 경화 수축률, 열전도, 흡습률을 기존 소재와 비교해서 **무엇이 좋아지고 무엇이 위험해지는지** 가설을 세웁니다.\n\n둘째 **공정성 평가**입니다. 뉴스룸에서 소개한 것처럼 **더미 자재로 먼저 평가**해서 충진성과 Void, 두께 균일도, 휨을 봅니다. 온도, 압력, 시간을 몇 수준으로 나눈 **실험 계획**으로 공정 여유를 확인합니다.\n\n셋째 **신뢰성 평가**입니다. 프리컨디셔닝 후 TC와 고온·고습 시험을 거쳐 박리와 크랙을 확인합니다.\n\n넷째 **양산성 검토**입니다. 작업 시간, 설비 오염, 로트 간 편차, 원가를 확인합니다.\n\n단계마다 **합격 기준을 미리 정해 두고**, 기준에 못 미치면 다음 단계로 넘기지 않겠습니다. 실제 평가 항목과 기준은 입사 후 정확히 배우겠습니다.", "k": [["물성", "점도|CTE|Tg|탄성률|수축|열전도"], ["공정성", "충진|void|보이드|휨|더미"], ["실험 계획", "DOE|실험 계획|수준|여유|윈도우"], ["신뢰성", "신뢰성|TC|프리컨디셔닝|박리"], ["양산성", "양산|편차|원가|로트"], ["기준", "합격 기준|기준을 미리"]], "f": [["일정이 3주밖에 없다면 무엇을 줄이겠습니까?", "줄일 수 없는 것(충진성·휨 같은 치명 항목)과 뒤로 미룰 것(장기 신뢰성)을 구분하고, 미룬 항목의 위험을 명시."], ["공급사 데이터를 그대로 믿어도 됩니까?", "핵심 물성은 직접 측정해 확인. 로트 간 편차도 확인."]], "s": ["jobrep2", "gen"]}, {"id": "P20", "c": "pkg", "t": "예상", "sec": 90, "q": "불량이 발생했을 때 원인을 찾는 본인만의 순서를 말해 보세요.", "why": ["뉴스룸에서 PKG개발의 첫 번째 역량으로 '시스템 관점의 문제 해결'을 꼽았습니다. 문제해결 PT의 뼈대로도 그대로 쓸 수 있는 답입니다."], "p": ["현상 정의 → 바뀐 것 → 가설 → 검증 → 조치·재발 방지", "한 가지 원인에 일찍 확신하지 않기"], "m": "다섯 단계로 합니다.\n\n첫째 **현상을 정확히 정의**합니다. 어떤 불량이, 어느 위치에, 언제부터, 어떤 로트와 설비와 자재에서 나오는지 데이터로 좁힙니다. 둘째 **바뀐 것을 찾습니다**. 사람, 설비, 자재, 방법 가운데 불량 시작 시점과 맞물려 변한 것을 확인합니다. 셋째 **메커니즘 가설**을 세웁니다. 소재, 구조, 공정 요인으로 나눠서 '이 요인이 맞다면 이런 흔적이 보여야 한다'를 적습니다. 넷째 **검증**입니다. 비파괴 검사와 단면 분석으로 흔적을 확인하고, 변수를 좁힌 실험으로 재현합니다. 다섯째 **조치와 재발 방지**입니다. 조건을 바꾼 뒤 앞뒤 공정 영향까지 확인하고 관리 기준에 반영합니다.\n\n뉴스룸에서 PKG개발 현직자분이 원인이 하나로 설명되는 경우는 드물다고 한 것처럼, **한 가지 원인에 일찍 확신하지 않는 것**을 원칙으로 삼고 있습니다.", "k": [["현상 정의", "현상|정의|위치|언제"], ["변화점", "바뀐|변한|4M|자재|설비"], ["가설", "가설|메커니즘|요인"], ["검증", "검증|비파괴|단면|재현|실험"], ["재발 방지", "재발|관리 기준|앞뒤"], ["원칙", "확신하지|하나로|여러"]], "f": [["가설이 다섯 개인데 시간은 두 개만 검증할 수 있습니다. 어떻게 고릅니까?", "가능성(데이터와의 일치) × 영향 크기 × 검증 비용으로 우선순위. 근거를 말로 설명."]], "s": ["jobrep2"]}, {"id": "P21", "c": "pkg", "t": "단골", "sec": 60, "q": "패키지에서 신호 간섭(노이즈)을 줄이는 방법을 아는 대로 말해 보세요.", "why": ["현직자가 꼽은 단골 목록에 있지만, 화학·소재 전공자에게는 약한 영역입니다. 아는 만큼 정확히 말하고 선을 긋는 태도를 봅니다."], "p": ["연결 길이를 줄인다", "전원·접지를 안정시킨다", "신호선 사이 간격과 차폐", "재료(유전 특성)", "전공 밖 영역임을 인정"], "m": "설계 영역이라 기본 원리 수준에서 말씀드리겠습니다.\n\n첫째 **연결 길이를 줄입니다**. TSV와 미세 범프로 칩을 수직으로 잇는 것 자체가 배선을 짧게 해서 지연과 손실을 줄입니다. 둘째 **전원과 접지를 안정**시킵니다. 전원·접지용 연결을 충분히 두면 전압 흔들림이 줄어듭니다. 셋째 **신호선 사이 간격을 확보하고 접지로 차폐**해 서로 간섭하는 것을 줄입니다. 넷째 **재료**입니다. 절연 재료의 유전 특성이 신호 손실에 영향을 줍니다.\n\n제 전공은 소재와 공정이어서 이 가운데 **재료 쪽에서 기여할 수 있다**고 생각하고, 설계 쪽 지식은 입사 후 배워 가겠습니다.", "k": [["길이", "길이|짧|TSV|범프"], ["전원·접지", "전원|접지|그라운드"], ["차폐", "간격|차폐|간섭"], ["재료", "유전|절연|재료"], ["선 긋기", "기본|배워|전공"]], "tip": "모르는 용어를 지어내지 마세요. 이 정도 길이로 답하고 \"더 깊은 내용은 배우겠다\"로 닫는 것이 안전합니다.", "s": ["comm", "gen"], "f": []}, {"id": "M01", "c": "mfg", "t": "기출", "sec": 120, "q": "반도체 8대 공정을 설명해 보세요.", "why": ["과거 후기에 반복해서 나온 기본 질문입니다. 2지망이 양산기술(전공정 팹)이라 더 중요합니다. 순서와 각 공정의 목적을 한 문장씩."], "p": ["웨이퍼 제조 → 산화 → 포토 → 식각 → 증착·이온 주입 → 금속 배선 → EDS → 패키징", "포토·식각·증착이 층마다 반복된다는 점", "본인이 지원한 패키징의 위치"], "m": "순서대로 말씀드리겠습니다.\n\n**웨이퍼 제조**는 실리콘 잉곳을 얇게 잘라 기판을 만드는 단계입니다. **산화**는 표면에 절연막인 산화막을 키웁니다. **포토**는 감광액을 바르고 마스크의 회로 패턴을 빛으로 옮깁니다. **식각**은 패턴대로 필요 없는 부분을 깎아 냅니다. **증착과 이온 주입**은 얇은 막을 입히고, 불순물을 넣어 전기적 특성을 만듭니다. **금속 배선**은 소자들을 금속으로 연결합니다. **EDS**는 웨이퍼 상태에서 칩의 전기적 특성을 검사해 양품과 불량을 가립니다. 마지막 **패키징**은 칩을 잘라 외부와 연결하고 보호합니다.\n\n실제로는 포토, 식각, 증착이 **층마다 수십 번 반복**되고, 그 사이에 세정과 평탄화, 계측이 들어갑니다. 제가 지원한 직무는 이 가운데 마지막 단계인 **패키징**이고, HBM에서는 이 단계가 성능을 좌우한다고 이해하고 있습니다.", "k": [["앞 공정", "웨이퍼|산화"], ["패턴", "포토|노광|식각"], ["막·불순물", "증착|이온 주입"], ["배선·검사", "배선|EDS|검사"], ["패키징", "패키징|패키지"], ["반복", "반복|층마다|세정|평탄화"]], "f": [["그중 수율에 가장 큰 영향을 주는 공정은 무엇이라고 생각합니까?", "정답은 없음. 하나를 고르고 이유를 말하기(예: 패턴을 결정하는 포토·식각)."], ["전공정과 후공정의 경계는 어디입니까?", "웨이퍼 가공이 끝나고 EDS·패키징으로 넘어가는 지점. TSV·하이브리드 본딩으로 경계가 흐려지고 있다는 점까지."]], "s": ["comm", "gen"]}, {"id": "M02", "c": "mfg", "t": "기출", "sec": 60, "q": "CVD와 ALD의 차이를 설명해 보세요.", "why": ["과거 후기에 나온 질문입니다. 화학 전공자에게 유리한 질문이니 반응 메커니즘으로 설명하세요."], "p": ["CVD: 기체가 동시에 반응해 막 형성, 빠름", "ALD: 원료를 번갈아 넣는 자기 제한 반응, 원자층 단위", "장단점과 쓰임"], "m": "둘 다 기체 원료의 화학 반응으로 막을 만드는 공정입니다.\n\n**CVD**는 원료 기체들을 **함께 넣어** 표면과 그 근처에서 반응시켜 막을 쌓습니다. **속도가 빠르지만** 깊고 좁은 구조에서는 입구와 바닥의 두께가 달라지기 쉽습니다.\n\n**ALD**는 원료를 **한 종류씩 번갈아** 넣습니다. 첫 번째 원료가 표면에 한 층만 붙으면 더 붙지 않는 **자기 제한 반응**을 이용하기 때문에, 한 사이클에 **원자층 한 층씩** 쌓입니다. 그래서 **두께 제어가 정밀하고**, 깊은 구멍 안쪽까지 **고르게 덮습니다**. 대신 속도가 느립니다.\n\n그래서 미세하고 깊은 구조의 얇은 막에는 ALD를, 두껍고 빠르게 쌓아야 하는 막에는 CVD를 쓴다고 이해하고 있습니다.", "k": [["CVD", "CVD|함께|동시에|빠르"], ["ALD", "ALD|번갈아|한 층|원자층"], ["자기 제한", "자기 제한|self|더 붙지"], ["피복성", "고르게|단차|덮|균일"], ["쓰임", "얇은 막|깊은|두껍"]], "f": [["TSV 공정에서 이런 증착이 쓰이는 곳은 어디입니까?", "구멍 안쪽 벽의 절연막. 칼럼에서는 CVD로 절연막을 입힌다고 설명."]], "s": ["comm", "gen"]}, {"id": "M03", "c": "mfg", "t": "기출", "sec": 120, "q": "새로 들여온 장비에서만 수율이 낮게 나옵니다. 무엇을 어떤 순서로 점검하겠습니까?", "why": ["양산기술 면접 후기에 나온 상황형 질문입니다. 문제해결 PT의 소재로도 유력합니다. 정답보다 순서와 근거가 평가됩니다."], "p": ["먼저 \"정말 장비 차이인가\"부터 확인", "기존 장비와의 차이를 좁힘", "하드웨어 → 조건 → 자재·환경 순", "조치와 재발 방지 (셋업 기준)"], "m": "네 단계로 점검하겠습니다.\n\n첫째 **현상 확인**입니다. 정말 그 장비 때문인지부터 봅니다. 같은 로트를 기존 장비와 나눠 진행한 데이터가 있는지, 불량이 **웨이퍼의 특정 위치나 특정 시간대**에 몰리는지를 확인합니다.\n\n둘째 **기존 장비와의 차이 좁히기**입니다. 같은 조건값을 넣어도 실제 온도, 압력, 유량이 같은지 **장비 센서 데이터**를 기존 장비와 비교합니다.\n\n셋째 **원인 후보 점검**입니다. 설치 상태와 부품, 센서 보정 같은 **하드웨어**, 조건값이 제대로 옮겨졌는지와 장비 간 보정 같은 **공정 조건**, 그리고 **자재와 환경** 순서로 봅니다.\n\n넷째 **조치와 재발 방지**입니다. 원인을 고친 뒤 기존 장비와 결과가 맞는지 확인하고, 이번에 놓친 항목을 **셋업 점검 기준에 추가**합니다.\n\n원인이 확인될 때까지는 해당 장비의 투입을 제한해서 **불량 확산을 먼저 막겠습니다**.", "k": [["현상 확인", "정말|로트|위치|시간대|확인"], ["차이 비교", "기존 장비|비교|센서|데이터"], ["하드웨어", "하드웨어|부품|설치|보정"], ["조건", "조건|레시피|조건값"], ["재발 방지", "재발|셋업|기준|추가"], ["확산 방지", "투입|제한|확산"]], "f": [["생산 일정이 급해서 그 장비를 세울 수 없다고 합니다. 어떻게 하겠습니까?", "위험을 숫자로 보고(불량 예상량 vs 생산 손실), 위험이 낮은 제품만 투입하는 등 대안 제시. 결정은 근거와 함께 상위에 요청."], ["장비 제조사와 의견이 다르면 어떻게 하겠습니까?", "데이터로 대화. 뉴스룸에서도 장비사·현장과의 소통을 강조."]], "s": ["comm", "job1"]}, {"id": "M04", "c": "mfg", "t": "예상", "sec": 90, "q": "수율이란 무엇이고, 수율을 높이려면 무엇을 관리해야 합니까?", "why": ["양산기술의 존재 이유입니다. 정의 → 떨어뜨리는 원인 → 관리 방법의 순서로."], "p": ["정의: 투입 대비 양품 비율, 단계별 수율", "원인: 결함(파티클), 공정 산포, 설비 차이", "관리: 결함 저감, 산포 관리, 조기 감지", "본인 경험"], "m": "수율은 **투입한 수량 대비 양품의 비율**입니다. 웨이퍼 가공, 웨이퍼 검사, 패키지, 최종 검사 단계마다 수율이 있고, 전체 수율은 이들의 곱이라서 **한 단계의 손실이 전체에 그대로 반영**됩니다.\n\n수율을 떨어뜨리는 것은 크게 세 가지입니다. 파티클 같은 **결함**, 두께나 선폭이 목표에서 벗어나는 **공정 산포**, 그리고 **설비 간 차이**입니다.\n\n그래서 관리도 세 방향입니다. 결함의 발생원을 찾아 줄이고, 공정 조건의 **여유를 넓히고 산포를 줄이며**, 이상을 **빨리 감지**해서 불량이 퍼지기 전에 막습니다.\n\n저는 파일럿 라인에서 **불량을 유형별로 나눠 큰 것부터 줄이는 방식**으로 초기 수율을 올린 경험이 있어서, 이 접근을 그대로 적용할 수 있다고 생각합니다.", "k": [["정의", "양품|비율|투입"], ["단계", "단계|곱|전체"], ["원인", "결함|파티클|산포|설비"], ["관리", "여유|감지|줄이"], ["경험", "파일럿|유형|초기 수율"]], "f": [["HBM처럼 여러 장을 쌓는 제품의 수율은 왜 더 어렵습니까?", "접합 한 번의 수율이 99%라도 여러 번 곱해지면 크게 떨어진다. 그래서 양품 칩만 쌓고, 접합 수율을 극단적으로 높여야 한다."]], "s": ["job1", "app", "gen"]}, {"id": "M05", "c": "mfg", "t": "예상", "sec": 90, "q": "SPC와 공정능력지수(Cpk)를 설명해 보세요.", "why": ["뉴스룸에서 양산기술의 가장 중요한 역량으로 데이터 분석력을 꼽았습니다. 통계적 공정 관리의 기본 개념은 알고 가야 합니다."], "p": ["SPC: 관리도로 이상을 조기 감지", "관리 한계 vs 규격 한계", "Cpk: 규격 대비 산포와 치우침", "실제 사용 경험 (있다면)"], "m": "**SPC**는 통계적 공정 관리입니다. 공정의 측정값을 시간 순서대로 **관리도**에 찍어서, 평소의 흔들림을 벗어나는 **이상 신호를 빨리 찾아내는** 방법입니다. 점이 관리 한계를 벗어나는 경우뿐 아니라, 한계 안이라도 **한쪽으로 계속 치우치거나 연속으로 오르내리는 경향**이 보이면 원인을 찾습니다.\n\n여기서 **관리 한계**는 공정 데이터 자체에서 계산한 값이고, **규격 한계**는 제품이 만족해야 하는 값이라서 서로 다릅니다.\n\n**Cpk**는 공정이 규격을 얼마나 여유 있게 만족하는지를 나타내는 지수입니다. 규격 폭에 비해 **산포가 작을수록, 평균이 규격 중심에 가까울수록** 커집니다. 산포만 보는 Cp와 달리 **평균의 치우침까지 반영**합니다.\n\n[직접 채울 것: 현 직장에서 관리도나 공정능력지수를 실제로 써 본 경험이 있으면 한 문장]", "k": [["SPC", "SPC|통계적|관리도"], ["이상 감지", "이상|벗어|경향|연속"], ["한계 구분", "관리 한계|규격"], ["Cpk", "Cpk|공정능력|여유"], ["산포·치우침", "산포|평균|치우침|중심"]], "f": [["관리 한계 안에 있는데도 조치를 해야 하는 경우는 언제입니까?", "연속 상승·하강, 한쪽 치우침 같은 경향이 보일 때. 규격 이탈 전에 원인을 찾는다."], ["Cpk가 낮으면 무엇을 하겠습니까?", "평균 치우침이면 중심 보정, 산포가 크면 산포 원인(설비·자재·방법) 분석."]], "s": ["job1", "gen"]}, {"id": "M06", "c": "mfg", "t": "예상", "sec": 60, "q": "양산기술 엔지니어에게 가장 중요한 역량은 무엇이고, 본인은 그것을 갖추고 있습니까?", "why": ["2지망 직무를 조사했는지 확인하는 질문입니다. 뉴스룸의 표현을 근거로 삼고 본인 경험을 붙이세요."], "p": ["뉴스룸이 꼽은 역량: 데이터 분석, 문제 해결, 소통", "본인 근거", "부족한 점과 보완 계획"], "m": "뉴스룸의 양산기술 직무 소개에서는 **데이터 분석력**을 가장 중요한 역량으로 꼽았고, 문제 해결 능력과 타 부서·협력사와의 **소통 능력**을 함께 강조했습니다. 저도 같은 생각입니다.\n\n제 근거는 이렇습니다. 파일럿 라인에서 불량을 유형별로 나누고 **공정 변수와 결과의 관계를 데이터로 정리**해 조건을 최적화했습니다. 또 장력을 낮춘 뒤 생긴 정렬 문제를 풀 때는 **뒤 공정과 조율**해야 했습니다.\n\n부족한 점은 **대량의 양산 데이터를 프로그래밍으로 다뤄 본 경험**입니다. [직접 채울 것: 현재 수준과 보완 계획 — 예: 엑셀 중심으로 분석해 왔고, 파이썬을 배우는 중이다]", "k": [["역량", "데이터|분석|소통|문제 해결"], ["근거", "뉴스룸|직무 소개"], ["경험", "파일럿|데이터로|조율"], ["보완", "부족|프로그래밍|배우"]], "s": ["job1", "app"], "f": []}, {"id": "M07", "c": "mfg", "t": "예상", "sec": 90, "q": "생산 일정이 급한데 설비에서 이상 징후가 보입니다. 라인을 세우겠습니까?", "why": ["뉴스룸에서 현직자가 \"생산 일정에 영향을 주는 이슈의 우선순위를 정하는 것이 가장 어렵다\"고 했습니다. 혼자 결정하는지, 근거를 만들어 보고하는지를 봅니다."], "p": ["즉답하지 않고 판단 기준을 먼저", "위험 크기 확인 (데이터)", "확산 방지 조치 + 보고", "품질 우선 원칙"], "m": "바로 세운다, 안 세운다를 정하기 전에 **위험의 크기를 먼저 확인**하겠습니다.\n\n이상 징후가 **제품 품질에 영향을 주는 변수**인지, 지금까지 진행된 물량의 측정값에 변화가 있는지를 데이터로 봅니다. 그리고 계속 돌렸을 때 예상되는 **불량 규모**와 세웠을 때의 **생산 손실**을 비교할 수 있게 정리합니다.\n\n품질에 영향을 줄 가능성이 확인되면, 해당 설비의 투입을 먼저 멈추고 **이미 진행된 물량을 구분해 두는 조치**를 한 뒤, 정리한 근거와 함께 **바로 보고**하겠습니다. 판단이 어려운 경우에도 혼자 끌어안지 않고 근거를 공유하겠습니다.\n\n일정은 다시 맞출 수 있지만 **고객에게 나간 불량은 되돌릴 수 없다**고 생각합니다. 그래서 확신이 없을 때는 품질 쪽으로 판단하겠습니다.", "k": [["판단 기준", "위험|크기|영향"], ["데이터", "데이터|측정|비교"], ["조치", "멈추|구분|투입"], ["보고", "보고|공유"], ["원칙", "품질|고객|되돌릴"]], "f": [["상사가 \"그냥 돌려\"라고 하면 어떻게 하겠습니까?", "근거를 한 번 더 숫자로 설명. 그래도 결정이 그렇다면 따르되, 모니터링 강화와 물량 구분은 유지."]], "s": ["job1"]}, {"id": "M08", "c": "mfg", "t": "예상", "sec": 90, "q": "개발에서 넘어온 공정 조건이 양산에서 재현되지 않습니다. 어떻게 하겠습니까?", "why": ["개발(1지망)과 양산(2지망)의 접점입니다. 개발 출신이라 양쪽 입장을 모두 말할 수 있다는 것이 강점이 됩니다."], "p": ["탓하지 않고 차이를 찾는다", "개발 환경과 양산 환경의 차이: 설비, 물량, 자재 편차", "함께 검증", "개발 단계에서 미리 넓게 확인하자는 제안"], "m": "먼저 **누구의 잘못인지가 아니라 무엇이 다른지**를 찾겠습니다.\n\n개발과 양산은 조건값이 같아도 환경이 다릅니다. **설비가 다르고**, 한두 장이 아니라 **대량으로 연속 진행**하며, **자재의 로트 간 편차**도 커집니다. 그래서 개발 때의 설비·자재·진행 수량과 양산의 조건을 나란히 놓고 차이를 좁히겠습니다.\n\n그다음 개발 담당자와 **같은 데이터를 보면서** 어느 변수에 민감한지 확인하고, 조건의 **여유 폭**을 다시 잡겠습니다.\n\n저는 개발 직무에서 파일럿 라인을 함께 경험했기 때문에, **개발 조건이 좁은 범위에서만 맞았을 가능성**을 먼저 의심하는 편입니다. 반대로 제가 개발 쪽에 있다면, 조건을 넘기기 전에 **변수를 일부러 흔들어 본 결과**까지 함께 넘기겠습니다.", "k": [["태도", "잘못|무엇이 다른|차이"], ["환경 차이", "설비|대량|연속|편차|로트"], ["협업", "같은 데이터|함께|개발 담당"], ["여유 폭", "여유|민감|범위"], ["예방", "흔들어|넘기기 전|미리"]], "s": ["jobrep2", "app"], "f": []}, {"id": "M09", "c": "mfg", "t": "지원서", "sec": 90, "q": "지원서에 '타겟 DOE'를 썼습니다. 실험 계획을 실제로 어떻게 설계했습니까?", "why": ["지원서의 용어를 실제로 이해하고 썼는지 확인합니다. 개발·양산 어느 직무에서든 쓰는 기본 도구입니다."], "p": ["DOE의 뜻과 왜 쓰는가", "'타겟'의 의미: 가설로 변수를 좁힘", "실제 설계 ← 준비 필요 (인자, 수준, 반응값)", "상호작용"], "m": "DOE, 즉 실험 계획법은 **여러 변수를 한 번에 체계적으로 바꿔서** 적은 실험으로 변수의 영향과 **변수 간 상호작용**을 알아내는 방법입니다. 한 번에 하나씩 바꾸는 방식보다 실험 수가 줄고, 변수들이 함께 작용할 때의 효과도 볼 수 있습니다.\n\n제가 '타겟 DOE'라고 쓴 것은, 모든 변수를 다 넣지 않고 **메커니즘 가설로 중요한 변수를 먼저 좁힌 뒤** 실험했다는 뜻입니다.\n\n실제로는 [직접 채울 것: 인자 — 예: 단계별 두께 감소율, 가압력 / 수준 수 / 반응값 — 예: Curl, 합제 밀도]로 설계했고, [직접 채울 것: 실험 수와 결과에서 알게 된 것 한 가지]를 확인했습니다.", "k": [["DOE 뜻", "실험 계획|DOE|체계적"], ["상호작용", "상호작용|함께 작용"], ["타겟", "좁힌|가설|중요한 변수"], ["설계", "인자|수준|반응값"]], "f": [["변수가 다섯 개라면 실험을 몇 번 해야 합니까? 줄이는 방법은?", "2수준 완전 요인이면 32회. 일부 실시법이나 사전 가설로 변수를 줄인다. 모르면 원리 수준에서만."]], "tip": "'DOE'를 실제로 설계해 본 적이 없다면, 지원서의 표현을 \"가설로 변수를 좁혀 실험했다\"로 풀어서 사실대로 설명하세요.", "s": ["app", "gen"]}, {"id": "F01", "c": "fit", "t": "기출", "sec": 90, "q": "다른 사람과 갈등이 있었던 경험과, 어떻게 해결했는지 말해 보세요.", "why": ["과거 후기에 반복되는 질문입니다. 누가 옳았는지가 아니라, 상대의 입장을 어떻게 파악하고 무엇을 기준으로 합의했는지를 봅니다."], "p": ["상황: 누구와 무엇이 달랐는가 (한 문장)", "상대가 그렇게 말한 이유를 먼저 파악", "공통 기준(데이터, 전체 목표)으로 합의", "결과와 이후 관계"], "m": "장력 조건을 두고 **뒤 공정 담당자와 의견이 달랐던 경험**이 있습니다. 저는 연신 오차를 줄이려고 장력을 낮추자고 했고, 뒤 공정에서는 정렬이 틀어진다며 반대했습니다. [직접 채울 것: 실제 상황이 이와 다르면 본인의 실제 갈등 사례로 교체]\n\n저는 먼저 **상대가 보는 지표**를 확인했습니다. 제 지표만 보면 제 말이 맞았지만, 뒤 공정의 정렬 데이터를 보니 반대할 이유가 충분했습니다.\n\n그래서 한쪽이 양보하는 대신 **두 지표를 함께 만족하는 조건**을 목표로 다시 잡았고, [직접 채울 것: 함께 한 일 — 예: 데이터를 같이 보며 제어 게인 조정안을 실험]했습니다. 결과적으로 두 지표를 모두 맞췄고, 이후로는 조건을 바꾸기 전에 [직접 채울 것: 이후 달라진 협업 방식]하게 됐습니다.\n\n이 경험에서 **갈등은 대개 서로 다른 지표를 보고 있어서 생긴다**는 것을 배웠습니다.", "k": [["상황", "의견|달랐|반대|갈등"], ["상대 이해", "상대|입장|이유|지표"], ["공통 기준", "함께|데이터|두 지표|목표"], ["결과", "결과|맞췄|해결"], ["배운 점", "배웠|이후"]], "f": [["끝까지 합의가 안 됐다면 어떻게 했겠습니까?", "각자의 근거를 정리해 상위 판단을 요청. 결정되면 따른다."], ["본인이 틀렸던 갈등 경험도 있습니까?", "있다면 사실대로. 인정하고 바꾼 과정이 오히려 좋은 답."]], "tip": "상대를 나쁘게 묘사하지 마세요. 상대의 주장에도 근거가 있었다고 말하는 쪽이 높게 평가됩니다.", "s": ["comm", "app"]}, {"id": "F02", "c": "fit", "t": "기출", "sec": 90, "q": "스스로 높은 목표를 세우고 도전한 경험을 말해 보세요. 실패했다면 그 경험도 좋습니다.", "why": ["SK의 SUPEX(인간의 능력으로 도달할 수 있는 최고 수준) 추구와 연결되는 질문입니다. 목표가 왜 높았는지와 과정에서 무엇을 바꿨는지를 봅니다."], "p": ["목표가 왜 높았는가 (동시에 맞추기 어려운 두 지표)", "기존 방법으로는 안 됐던 이유", "방법을 바꾼 지점", "결과와 남은 한계"], "m": "신규 소재 적용과 폭 축소를 동시에 진행하면서 **Curl과 합제 밀도를 함께 만족**시키는 것이 목표였습니다. 가압력을 올리면 밀도는 맞지만 Curl이 커지고, 낮추면 그 반대여서 **기존 방식으로는 둘을 동시에 맞출 수 없었습니다**.\n\n조건을 조금씩 바꿔 보는 방식을 버리고, **변형이 왜 길이 방향으로 몰리는지**를 메커니즘으로 따져 봤습니다. 그 결과 한 번에 누르는 방식 자체를 바꿔야 한다는 결론에 이르렀고, **다단 압축**으로 전환해 두 지표를 모두 스펙 안에 넣었습니다.\n\n[직접 채울 것: 그 과정에서 가장 힘들었던 점과 걸린 기간, 그리고 남은 한계 한 가지]", "k": [["높은 목표", "동시에|함께 만족|목표"], ["한계 인식", "기존|맞출 수 없|트레이드"], ["방법 전환", "메커니즘|바꿔|다단"], ["결과", "스펙|결과|달성"], ["성찰", "힘들|한계|배운"]], "f": [["그 목표는 본인이 세운 것입니까, 주어진 것입니까?", "사실대로. 주어진 목표였다면 그 안에서 스스로 높인 기준을 말하기."]], "s": ["comm", "app"]}, {"id": "F03", "c": "fit", "t": "기출", "sec": 90, "q": "남들이 꺼리는 일을 맡아서 해낸 경험이 있습니까?", "why": ["SK의 VWBE(자발적이고 의욕적인 두뇌 활용)와 연결됩니다. 시켜서가 아니라 스스로 필요를 느껴서 한 일인지 봅니다."], "p": ["왜 다들 꺼렸는가", "왜 내가 하기로 했는가", "어떻게 했는가", "무엇이 달라졌는가"], "m": "[직접 채울 것: 본인 사례. 아래는 지원서 내용으로 만든 뼈대이니 사실과 다르면 교체하세요.]\n\n**수분 관리 기준을 정리하는 일**이 그랬습니다. 공정마다 수분이 들어오는 경로가 달라서 범위가 넓고, 당장 눈에 보이는 성과가 나지 않는 일이었습니다 [직접 채울 것: 실제로 꺼려지던 이유].\n\n하지만 수분은 단락으로 이어지는 치명적인 요인이라 **누군가는 전체를 한 번 정리해야 한다**고 생각해서 [직접 채울 것: 스스로 맡게 된 계기]. 공정별 발생 원인을 정리하고 [직접 채울 것: 실제로 한 일], 관리 기준과 가이드라인으로 만들었습니다.\n\n그 결과 [직접 채울 것: 달라진 점 — 불량, 문의, 재작업 감소 등].", "k": [["꺼린 이유", "꺼리|성과가|범위|번거"], ["자발성", "스스로|누군가는|맡"], ["실행", "정리|기준|가이드라인"], ["변화", "결과|달라|줄"]], "f": [["본인 업무도 바빴을 텐데 그 시간은 어떻게 냈습니까?", "사실대로. 우선순위 조정이나 추가 시간."]], "s": ["comm", "app"]}, {"id": "F04", "c": "fit", "t": "기출", "sec": 90, "q": "여러 사람과 협업한 경험과, 그 안에서 본인의 역할을 말해 보세요.", "why": ["뉴스룸에서 PKG개발의 핵심 역량으로 커뮤니케이션과 협업을 꼽았습니다. '통합 엔지니어'에 맞는 사람인지 봅니다."], "p": ["누구와 무엇을 위해", "내 역할 (동사로)", "협업에서 어려웠던 점과 해결", "결과"], "m": "[직접 채울 것: 협업 상대 — 예: 설비·제어 담당, 뒤 공정 담당, 소재 담당]과 함께 [직접 채울 것: 과제]를 진행한 경험입니다.\n\n제 역할은 **문제를 메커니즘으로 정리해 공통 언어를 만드는 것**이었습니다. 각 담당자가 보는 지표가 달랐기 때문에, 현상과 원인 가설을 한 장으로 정리해 **같은 그림을 보고 이야기하도록** 했습니다.\n\n어려웠던 점은 [직접 채울 것: 실제 어려움 — 일정, 우선순위 차이 등]이었고, [직접 채울 것: 해결 방법]으로 풀었습니다. 결과적으로 [직접 채울 것: 결과]를 달성했습니다.\n\nPKG개발도 소재, 공정, 설비, 고객을 잇는 일이라고 알고 있어서, **서로 다른 담당자의 말을 하나의 문제 정의로 묶는 역할**을 하고 싶습니다.", "k": [["협업 대상", "담당|함께|부서"], ["내 역할", "역할|정리|공통"], ["어려움", "어려|일정|차이"], ["결과", "결과|달성"], ["직무 연결", "PKG|통합|잇는"]], "f": [["협업에서 본인이 가장 못하는 것은 무엇입니까?", "실제 약점 하나 + 보완 방법."]], "s": ["jobrep2", "comm"]}, {"id": "F05", "c": "fit", "t": "기출", "sec": 60, "q": "본인의 부족한 점은 무엇입니까?", "why": ["자기 인식과 개선 노력을 봅니다. 장점처럼 들리는 가짜 단점(\"너무 꼼꼼해서\")은 감점입니다."], "p": ["실제 단점 하나", "그 단점 때문에 생긴 일", "지금 하고 있는 보완 방법"], "m": "저의 부족한 점은 **원인을 끝까지 이해하려다 초기 공유가 늦어질 때가 있다**는 것입니다. [직접 채울 것: 본인의 실제 단점이 다르면 교체]\n\n메커니즘을 정리한 뒤에 말하려다 보니, 주변에서는 진행 상황을 알기 어려웠던 적이 있습니다 [직접 채울 것: 실제 있었던 일 한 가지].\n\n그래서 지금은 **결론이 나기 전이라도 '현재 가설과 다음 확인 사항'을 먼저 공유**하는 것을 원칙으로 하고 있습니다. [직접 채울 것: 실제로 하고 있는 방법 — 예: 중간 공유 주기를 정해 둠]\n\n지원서에서 표현이 과했던 부분과 오타도 같은 맥락에서 **제출 전 확인이 부족했던 점**이라고 생각해, 중요한 문서는 하루 뒤에 한 번 더 읽는 습관을 들이고 있습니다. [직접 채울 것: 실제로 그렇게 하고 있을 때만 유지]", "k": [["단점", "부족|늦어|단점"], ["사례", "적이 있|사례|때"], ["보완", "원칙|공유|습관|지금은"]], "f": [["그 단점이 우리 업무에서 문제가 된다면 어떤 상황일까요?", "양산 이슈처럼 빠른 공유가 필요한 상황. 그래서 먼저 알리는 원칙을 더 지키겠다."]], "tip": "직무에 치명적인 단점(부주의, 협업 기피)은 피하고, 실제로 고치고 있는 것을 고르세요.", "s": ["comm"]}, {"id": "F06", "c": "fit", "t": "기출", "sec": 45, "q": "주변에서는 본인을 어떤 사람이라고 평가합니까?", "why": ["자기 평가와 타인 평가가 일치하는지 봅니다. 형용사가 아니라 실제로 들은 말이 필요합니다."], "p": ["실제로 들은 말 (인용)", "그 말을 들은 상황", "직무와의 연결"], "m": "[직접 채울 것: 실제로 들은 말 — 예: \"왜 그런지를 끝까지 묻는 사람\"]이라는 말을 자주 듣습니다.\n\n[직접 채울 것: 그 말을 들은 상황 한 가지]. 저는 조건을 바꿔서 결과가 좋아져도 **왜 좋아졌는지 설명되지 않으면** 넘어가지 못하는 편입니다.\n\n이런 성향이 **원인을 메커니즘으로 규명해야 하는 공정 개발**에 잘 맞는다고 생각합니다.", "k": [["인용", "라는 말|듣습니다|평가"], ["근거", "상황|때"], ["직무 연결", "공정|메커니즘|맞는"]], "f": [["반대로 안 좋은 평가를 들은 적은 없습니까?", "부족한 점 문항의 답과 일관되게."]], "s": ["comm"]}, {"id": "F07", "c": "fit", "t": "기출", "sec": 60, "q": "본인에게 행복이란 무엇입니까?", "why": ["SK의 경영철학(SKMS)은 구성원의 행복을 중요하게 다룹니다. 과거 후기에도 나온 질문입니다. 거창한 정의보다 본인의 실제 순간을 말하세요."], "p": ["한 문장 정의", "그렇게 느낀 실제 순간", "일과의 연결"], "m": "저에게 행복은 **이해되지 않던 것이 이해되는 순간**입니다.\n\n현 직장에서 같은 조건인데 소재마다 결과가 다른 이유를 몰라 답답했다가, 입자와 계면의 관점으로 **현상이 하나의 원리로 설명됐을 때** 가장 크게 느꼈습니다. [직접 채울 것: 일 밖에서 행복을 느끼는 순간 한 가지 — 사람, 취미 등]\n\n그리고 그 이해가 **다른 사람의 문제를 줄여 줄 때** 행복이 더 커진다고 생각합니다. 제가 정리한 기준 덕분에 다음 사람이 같은 시행착오를 겪지 않게 되는 경우입니다. SK가 말하는 **구성원의 행복이 이해관계자의 행복과 함께 간다**는 생각에도 그래서 공감합니다.", "k": [["정의", "행복은|순간"], ["실제 경험", "이해|설명됐|느꼈"], ["타인", "다른 사람|함께|도움"], ["SK 연결", "구성원|이해관계자|SK"]], "f": [["일이 행복하지 않은 순간에는 어떻게 합니까?", "스트레스 관리 방법을 사실대로."]], "s": ["comm", "gen"]}, {"id": "F08", "c": "fit", "t": "기출", "sec": 45, "q": "존경하는 사람이나 멘토가 있습니까?", "why": ["과거 후기에 나온 질문입니다. 누구인지보다 그 사람에게서 무엇을 배워 실제로 따라 하고 있는지를 봅니다."], "p": ["누구 (관계)", "그 사람의 어떤 행동", "내가 따라 하고 있는 것"], "m": "[직접 채울 것: 실제 인물 — 예: 현 직장의 선배, 지도 교수님, 가족]을 존경합
